corrections:
  - id: smart-quotes
    slides: [8, 9, 10, 11, 12]
    missions: [automation-works/for-anatomy]
    text: "The loop examples use typographic quotes (“i=%d\\n”). Use plain \" in real code."
  - id: press-any-key
    slides: [5, 23]
    missions: [automation-works/digit-sum]
    text: "'Press any key to continue . . .' in the sample output is printed by the IDE (Visual Studio) after the program ends, not by the program."
  - id: comma-assignment
    slides: [9]
    missions: [automation-works/comma-products]
    text: "a = 2, 3; assigns 2 (assignment binds tighter than the comma); a = (2, 3); assigns 3. Compilers warn that the discarded value is unused: the comma operator is rarely needed outside for headers."
  - id: empty-body
    slides: [9]
    missions: [automation-works/comma-products]
    text: "for (i=1, prod=1; i<=n; prod *= i++); has an empty body (the lone ;). It works, but a stray semicolon is a classic bug, so most style guides prefer the third form with an explicit body."
  - id: do-while-use
    slides: [10]
    missions: [automation-works/do-while-retry]
    text: "do-while is less common, but it is the natural choice when the body must run at least once, such as asking for input until it is valid."
  - id: declare-before-use
    slides: [19]
    missions: [core-systems/times2]
    text: "Correct for C99 and later: calling an undeclared function is an error (C89 allowed 'implicit int' declarations)."
  - id: libm
    slides: [20]
    missions: [core-systems/library-black-boxes]
    text: "With gcc on Linux, programs using <math.h> sometimes need -lm at the end of the command (gcc prog.c -o prog -lm) to link the maths library."
  - id: return-parentheses
    slides: [21]
    missions: [core-systems/times2]
    text: "return (2 * x); and return 2 * x; are identical: return is not a function, the parentheses are optional."
  - id: int-1234567
    slides: [31]
    missions: [core-systems/void-functions]
    text: "sayHi(1234567) needs int to be wider than 16 bits; the standard only guarantees up to 32767. Use long for IDs that can exceed that on small systems."
  - id: implicit-arg-conversion
    slides: [30]
    missions: [core-systems/arguments-and-conversion]
    text: "In the slide's call distance(1, i, x1, sqrt(y1)+2) inside distance y1 is 2.0 (a double), since the int argument i is converted to the parameter type."
