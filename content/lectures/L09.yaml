# Corrections and clarifications shown in the game with a "Correction" label.
corrections:
  - id: main-void
    slides: [7, 9]
    missions: [first-contact/anatomy]
    text: "The slides write int main(). In C17 an empty parameter list in a definition means 'no parameters', but it is an old-style declaration with no prototype. int main(void) states 'main takes no arguments' explicitly and is one of the two forms the standard lists, so the game uses it."
  - id: smart-quotes
    slides: [21, 44, 45, 46, 47]
    missions: [first-contact/beacon-debug, sensor-lab/float-scanf]
    text: "Several slide examples contain typographic quotes (“ ” instead of \"). C only accepts the plain ASCII double quote; copying those lines into a compiler gives errors. All code in the game uses straight quotes."
  - id: typos
    slides: [5, 16, 22]
    missions: [first-contact/build-pipeline]
    text: "Typos repaired: 'objective files' means object files (slide 5); 'floating-poing' means floating-point (slide 22); ASCII stands for American Standard Code for Information Interchange (slide 16)."
  - id: char-bits
    slides: [15]
    missions: [sensor-lab/type-sizes]
    text: "char is not guaranteed to be exactly 8 bits; the standard requires at least 8 (CHAR_BIT in <limits.h>). On practically every current system it is 8."
  - id: int-ranges
    slides: [18]
    missions: [sensor-lab/type-sizes]
    text: "The standard guarantees minimum ranges: short and int at least -32767..32767 (16 bits), long at least -2147483647..2147483647 (32 bits), long long (C99) at least 64 bits. Actual sizes are implementation-defined: long is 64 bits on Linux/macOS x86-64 but 32 bits on Windows and in this game's WebAssembly compiler. Use sizeof to check."
  - id: bool-type
    slides: [37]
    missions: [control-center/truth-values]
    text: "'There is no boolean type in C' was true only of C89. C99 added the type _Bool and the header <stdbool.h> (bool, true, false); C23 makes bool, true and false keywords. Conditions still treat zero as false and non-zero as true."
  - id: no-elseif
    slides: [36]
    missions: [control-center/signum]
    text: "C has no single 'elseif' keyword. 'else if' is simply an else whose statement is another if, which is why chains of else if work."
  - id: ub-increments
    slides: [47]
    missions: [supply-depot/forbidden-expression]
    text: "(++i)+(i++)+(++i) modifies i several times without sequencing. That is undefined behaviour: there is no correct answer, compilers may print anything, and the game never asks you to predict a value for it."
  - id: assignment-value
    slides: [27]
    missions: [supply-depot/assignment-value]
    text: "Strictly, it is the assignment expression (not the statement) that has a value: the value stored in the left operand."
  - id: switch-order
    slides: [43]
    missions: [control-center/machine-modes]
    text: "switch does not test the cases one after another like MATLAB; it jumps straight to the matching case label. The controlling expression must have integer type (char, int, long ...) and case labels must be integer constants."
  - id: conversion-warning
    slides: [31]
    missions: [supply-depot/type-conversion]
    text: "1 + 1.5 converts 1 to double silently (usual arithmetic conversions) without a warning. Warnings appear for possibly lossy conversions, such as double to int, when you enable -Wconversion."
  - id: negation-glyph
    slides: [28]
    missions: [supply-depot/integer-division]
    text: "The slide's 'Negation:' line lost its symbol; it is the unary minus -x. 'Use your common sense for operator order' is replaced in the game by the actual precedence table."
  - id: gcc-flags
    slides: [11]
    missions: [first-contact/build-pipeline]
    text: "gcc file.c works, but prefer gcc -std=c17 -Wall -Wextra file.c -o name: it picks the standard explicitly, turns on helpful warnings and names the executable."
  - id: wording
    slides: [4, 8]
    missions: [first-contact/wake-up]
    text: "Wording clarified: C is usually described as a 'relatively low-level high-level language'. stdio is part of the C standard library defined by the ISO C standard (originally ANSI C)."
