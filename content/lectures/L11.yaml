corrections:
  - id: implicit-int-main
    slides: [11, 14, 15, 16, 17, 18, 19, 20]
    missions: [data-vault/rack-loops]
    text: "The examples write main() without a return type. 'Implicit int' was removed in C99; in C17 write int main(void) and return 0."
  - id: value-typo
    slides: [9]
    missions: [data-vault/storage-racks]
    text: "The slide writes value[1]++ and value[1] += 1, but the array is called values: values[1]++."
  - id: vla-optional
    slides: [11]
    missions: [data-vault/rack-loops]
    text: "Variable-length arrays (int scores[n];) were added in C99 but are optional since C11 (__STDC_NO_VLA__), cannot be initialised, and can overflow the stack for large n. A #define constant is the portable choice."
  - id: out-of-bounds-ub
    slides: [12]
    missions: [data-vault/overflow-alarm]
    text: "Writing outside an array is undefined behaviour: it may overwrite another variable, crash, or appear to work. The game's compiler adds a runtime check that stops such a program."
  - id: array-name-address
    slides: [17, 18, 19]
    missions: [relay-station/clear-banks]
    text: "Strictly, the array name converts to a pointer to its first element when passed. The function's parameter is that pointer, so sizeof inside the function gives the pointer size, not the array size (clang warns about it)."
  - id: gets-removed
    slides: [33, 35]
    missions: [signal-archive/null-terminator]
    text: "gets was not just unsafe: it was removed from the language in C11, so a C17 compiler rejects it. Use fgets(buf, sizeof buf, stdin), and give scanf a width (scanf(\"%29s\", city))."
  - id: smart-quotes-l11
    slides: [33]
    missions: [signal-archive/null-terminator]
    text: "scanf(“%s”, city) uses typographic quotes; real code needs plain \" quotes."
  - id: size-t-format
    slides: [35]
    missions: [text-foundry/length-and-copy]
    text: "strlen returns size_t. Since C99 it is printed with %zu; the slide's cast to unsigned with %u also works."
  - id: strcmp-sign
    slides: [42]
    missions: [text-foundry/join-and-compare]
    text: "Only the sign of strcmp's result is defined. The slide's -1 is what some libraries return; others return the difference of the characters (for example -6). Compare the result with 0, never with -1 or 1."
  - id: strchr-format
    slides: [43]
    missions: [text-foundry/search]
    text: "pch - str has type ptrdiff_t, so printing it with %d is not portable. Use %td or convert it: (int)(pch - str). The prototype on the slide also lacks the parameter name str."
  - id: atoi-errors
    slides: [45]
    missions: [text-foundry/numbers-from-text]
    text: "atoi and atof cannot report errors: atoi(\"abc\") is 0 and atoi(\"12abc\") is 12. strtol and strtod (also in <stdlib.h>) report where the number ended."
