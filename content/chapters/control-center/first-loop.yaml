world:
  scene: terminal
  label: BEACON LAMP
  goal: Blink the beacon n times
title: Blink the Beacon
briefing: |
  The control center's beacon must blink a requested number of times. Writing
  the same printf over and over is not an option — the number changes. Meet
  your first loop.
lesson: |
  ### A simple for loop
  ```c
  for (i = 0; i < n; i++)
      printf("i=%d\n", i);
  ```

  This repeats the printf with `i` = 0, 1, 2, …, n−1 — that is, **n
  times**:

  1. `i = 0` runs once at the start;
  2. `i < n` is tested **before** each repetition — if it is false, the loop
     ends;
  3. after each repetition, `i++` adds one.

  With several statements, use a block:

  ```c example stdin=3
  #include <stdio.h>

  int main(void)
  {
      int i, n;
      scanf("%d", &n);
      for (i = 0; i < n; i++)
      {
          printf("i=%d\n", i);
      }
      return 0;
  }
  ```

  Loops are explained in full in the Automation Works chapter.

  > [!correction] Slide 46's examples use typographic quotes (`“i=%d\n”`);
  > in code always type `"`.
success: |
  `for (i = 0; i < n; i++)` repeats its body n times, with i counting 0 to
  n−1. If n is 0 the condition is false immediately and the body never runs.
steps:
  - id: main
    type: code
    title: Blink n times
    prompt: |
      Read `n` and print `blink 0`, `blink 1`, … up to `blink n-1`, one per
      line, then `done`. For input `3`:

      ```
      blink 0
      blink 1
      blink 2
      done
      ```
    stdin: "3\n"
    starter: |
      #include <stdio.h>

      int main(void)
      {
          int i, n;

          scanf("%d", &n);
          /* the loop goes here */

          printf("done\n");
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void)
      {
          int i, n;

          scanf("%d", &n);
          for (i = 0; i < n; i++) {
              printf("blink %d\n", i);
          }
          printf("done\n");
          return 0;
      }
    explanation: |
      The loop variable `i` starts at 0, the body runs while `i < n`, and `i++`
      moves to the next value. `done` is outside the loop, so it prints once.
    hints:
      - "Repeat the same printf n times, with the counter's value in it."
      - "Use the loop from the lesson and change the text printed in the body."
      - "`for (i = 0; i < n; i++) printf(\"blink %d\\n\", i);`"
      - "Put that loop between the scanf and the done line."
      - "The full solution adds one for loop."
    tests:
      - id: three
        stdin: "3\n"
        expect: { output: "blink 0\nblink 1\nblink 2\ndone\n" }
      - id: one
        stdin: "1\n"
        expect: { output: "blink 0\ndone\n" }
      - id: zero
        stdin: "0\n"
        note: Zero blinks.
        expect: { output: "done\n" }
      - id: five
        stdin: "5\n"
        expect: { output: "blink 0\nblink 1\nblink 2\nblink 3\nblink 4\ndone\n" }
    require:
      constructs: [for]
