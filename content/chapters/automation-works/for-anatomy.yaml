id: automation-works/for-anatomy
version: 1
kind: lesson
source:
  - { lecture: L10, slides: [6, 7, 8] }
topics: [L10.for-purpose, L10.for-syntax, L10.for-variants]
prerequisites: [automation-works/digit-sum]
estimatedMinutes: 18
objectives:
  - Explain when the init, test and step parts of a for loop run.
  - Rewrite a for loop with omitted parts and recognise equivalent loops.
  - Write a counting-down for loop.
world:
  scene: terminal
  label: LAUNCH CLOCK
  goal: Count down to launch
title: Anatomy of a for Loop
briefing: |
  The factory's cargo rocket needs a launch countdown. A `for` loop is the
  natural tool when you know how many times to repeat.
lesson: |
  ### Syntax
  ```c
  for (init; test; step) {
      statements;
  }
  ```

  1. **init** runs **once**, before anything else.
  2. **test** is checked **before each** iteration; if it is false, the loop
     ends.
  3. The **body** runs.
  4. **step** runs **after each** iteration; then back to 2.

  A `for` loop is the natural way to repeat an operation a particular number
  of times. It is exactly equivalent to:

  ```c
  init;
  while (test) {
      statements;
      step;
  }
  ```

  ### Equivalent forms (lecture slide 8)
  All of these print `i=0` … `i=n-1`:

  ```c
  for (i = 0; i < n; ++i) printf("i=%d\n", i);

  i = 0;
  for (; i < n; ++i) printf("i=%d\n", i);          /* init omitted */

  for (i = 0; i < n;) { printf("i=%d\n", i); ++i; } /* step moved into the body */

  for (i = 0; i < n;) printf("i=%d\n", i++);        /* step inside the printf */
  ```

  Any of the three parts may be omitted, but the semicolons stay. Without a
  test, the loop is endless: `for (;;)` means the same as `while (1)`.
  `++i` and `i++` are equivalent as a step, because the step's value is not
  used.

  > [!correction] The slide versions use typographic quotes (`“i=%d\n”`).
success: |
  init runs once, the test runs before every iteration, the step after every
  iteration. Parts can be omitted or moved; `for (;;)` is an endless loop like
  `while (1)`.
steps:
  - id: order
    type: order
    title: What happens when?
    prompt: "Put the events of `for (i = 0; i < 2; i++) printf(\"%d\", i);` in the order they happen."
    lines:
      - "init: i = 0"
      - "test: 0 < 2 is true"
      - "body: prints 0"
      - "step: i becomes 1"
      - "test: 1 < 2 is true"
      - "body: prints 1"
      - "step: i becomes 2"
      - "test: 2 < 2 is false, loop ends"
    explanation: |
      init happens once; then test → body → step repeats until the test fails.
      Note that the test runs one more time than the body.
  - id: equivalent-quiz
    type: quiz
    title: Same output?
    question: "Which loop does NOT print the same as `for (i = 0; i < 3; i++) printf(\"%d\", i);`?"
    choices:
      - "`i = 0; for (; i < 3; i++) printf(\"%d\", i);`"
      - "`for (i = 0; i < 3;) printf(\"%d\", i++);`"
      - "`for (i = 0; i < 3;) { i++; printf(\"%d\", i); }`"
      - "`for (i = 0; i < 3; ++i) printf(\"%d\", i);`"
    correct: 2
    explanation: |
      In the third loop, i is incremented *before* printing, so it prints 123
      instead of 012. Moving the step into the body only works if it stays
      after the work.
  - id: main
    type: code
    title: Launch countdown
    prompt: |
      Read a starting number `n` and count down with a `for` loop. For input
      `3`:

      ```
      T-minus 3
      T-minus 2
      T-minus 1
      Launch!
      ```
    stdin: "3\n"
    starter: |
      #include <stdio.h>

      int main(void)
      {
          int n, t;

          scanf("%d", &n);
          /* for loop: start at n, continue while t is at least 1, count down */

          printf("Launch!\n");
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void)
      {
          int n, t;

          scanf("%d", &n);
          for (t = n; t >= 1; t--) {
              printf("T-minus %d\n", t);
          }
          printf("Launch!\n");
          return 0;
      }
    explanation: |
      init `t = n` starts at the top, the test `t >= 1` stops after 1, and the
      step `t--` counts down.
    hints:
      - "A for loop can count down as well as up."
      - "init: start at n. test: keep going while t is at least 1. step: decrease t."
      - "`for (t = n; t >= 1; t--)`"
      - "Body: `printf(\"T-minus %d\\n\", t);`"
      - "The full solution has one counting-down for loop."
    tests:
      - id: three
        stdin: "3\n"
        expect: { output: "T-minus 3\nT-minus 2\nT-minus 1\nLaunch!\n" }
      - id: one
        stdin: "1\n"
        expect: { output: "T-minus 1\nLaunch!\n" }
      - id: zero
        stdin: "0\n"
        expect: { output: "Launch!\n" }
      - id: five
        stdin: "5\n"
        expect: { output: "T-minus 5\nT-minus 4\nT-minus 3\nT-minus 2\nT-minus 1\nLaunch!\n" }
    require:
      constructs: [for]
