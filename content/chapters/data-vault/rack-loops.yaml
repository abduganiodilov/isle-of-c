  - Give an array its size with a #define constant and use the same constant in the loops.
  - Store input in an array so it can be processed more than once.
world:
  scene: table
  label: SENSOR ROW
  goal: Store six readings and analyse them twice
title: Racks and Loops
briefing: |
  Six temperature sensors line the vault corridor. The climate unit needs
  their readings in reverse order, their average, and how many lie above
  that average — so every reading has to be kept, not just added up.
lesson: |
  ### A variable as the index
  The index can be any integer expression — usually the loop variable. This
  is how a whole array is processed:

  ```c
  for (i = 0; i < 3; i++)
      values[i] = 0;        /* values[0], values[1], values[2] are 0 */
  ```

  The loop runs `i` through 0, 1, 2 — exactly the valid indexes. The
  condition is `i < 3`, **not** `i <= 3`.

  ### The size as a constant
  Use a `#define` constant for the size and use the **same** constant in
  every loop. Changing the size later is then a one-line edit:

  ```c example stdin=3\n1\n4\n1\n5
  #include <stdio.h>

  #define N_VALUES 5

  int main(void)
  {
      int values[N_VALUES];
      int i;

      for (i = 0; i < N_VALUES; i++) {
          scanf("%d", &values[i]);
      }
      for (i = N_VALUES - 1; i >= 0; i--) {
          printf("%d ", values[i]);       /* backwards */
      }
      printf("\n");
      return 0;
  }
  ```

  Why an array here? To print the numbers backwards, the program must
  remember **all** of them before printing the first one. Whenever a program
  needs to look at the data more than once, it needs an array.

  > [!correction] The slides write `main()` without a return type. Since C99
  > every function needs one: use `int main(void)` and `return 0;`.

  > [!correction] Slide 11 says C99 allows a variable as the size
  > (`int scores[n];`, a *variable-length array*). That is true, but since
  > C11 compilers may leave this feature out, such arrays cannot be
  > initialised, and a large `n` can crash the program. A `#define`
  > constant is the portable choice and is used throughout this game.
success: |
  A loop variable makes a perfect index: `for (i = 0; i < N; i++)` visits
  every element exactly once. With the size in a `#define` constant, the
  declaration and every loop always agree.
