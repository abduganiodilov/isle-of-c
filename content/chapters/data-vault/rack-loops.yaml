    solution: |
      #include <stdio.h>

      #define READINGS 6

      int main(void)
      {
          int temp[READINGS];
          int i;
          int sum = 0;
          int above = 0;
          double average;

          for (i = 0; i < READINGS; i++) {
              scanf("%d", &temp[i]);
          }

          printf("Reversed:");
          for (i = READINGS - 1; i >= 0; i--) {
              printf(" %d", temp[i]);
          }
          printf("\n");

          for (i = 0; i < READINGS; i++) {
              sum += temp[i];
          }
          average = (double) sum / READINGS;
          printf("Average: %.2f\n", average);

          for (i = 0; i < READINGS; i++) {
              if (temp[i] > average) {
                  above++;
              }
          }
          printf("Above average: %d\n", above);
          return 0;
      }
    explanation: |
      The readings are stored once and then visited by three loops: one
      backwards for printing, one to add them up, and one to compare each
      reading with the average. The last loop is only possible because the
      array still holds every reading after the average is known.
    hints:
      - "You need the average before you can count the readings above it, so the readings must stay in the array and be visited again."
      - "Write three loops after the input loop: print backwards, add up, then compare each element with the average."
      - "Backwards: `for (i = READINGS - 1; i >= 0; i--)`. Print `\" %d\"` so each number follows a space."
      - "`average = (double) sum / READINGS;` then `if (temp[i] > average) above++;` inside a loop."
      - "The full solution prints `Reversed:` with one loop, computes the sum and average, and counts with a third loop."
    tests:
      - id: example
        stdin: "1 2 3 4 5 6\n"
        expect: { output: "Reversed: 6 5 4 3 2 1\nAverage: 3.50\nAbove average: 3\n" }
      - id: equal
        stdin: "10 10 10 10 10 10\n"
        note: No reading is strictly above an average it equals.
        expect: { output: "Reversed: 10 10 10 10 10 10\nAverage: 10.00\nAbove average: 0\n" }
      - id: mixed
        stdin: "-3 0 7 2 -8 20\n"
        note: Negative readings and an integer average.
        expect: { output: "Reversed: 20 -8 2 7 0 -3\nAverage: 3.00\nAbove average: 2\n" }
      - id: fraction
        stdin: "5 5 5 5 5 6\n"
        note: The average is 5.17, so only one reading is above it.
        expect: { output: "Reversed: 6 5 5 5 5 5\nAverage: 5.17\nAbove average: 1\n" }
    require:
      constructs: [array, for]
