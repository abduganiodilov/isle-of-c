id: core-systems/times2
version: 1
kind: guided
source:
  - { lecture: L10, slides: [19, 21, 22, 23] }
topics: [L10.function-anatomy, L10.calling-functions, L10.prototypes]
prerequisites: [core-systems/library-black-boxes]
estimatedMinutes: 20
objectives:
  - Name the parts of a function - return type, name, parameter list, body, return statement.
  - Write a prototype, a call and a definition for your own function.
  - Explain that the same variable name in two functions means two different variables.
world:
  scene: gauges
  label: POWER DOUBLER
  gauges:
    - { label: Output, pattern: "= (-?\\d+)\\s*$", max: 200 }
title: Your First Function
briefing: |
  The core's power converters multiply their input by a fixed factor. Build
  the converter module as your own function — first the lecture's `times2`,
  then a `times3` of your own.
lesson: |
  ### Anatomy of a function
  ```c
  int times2(int x)
  {
      return (2 * x);
  }
  ```

  | Part | Here |
  |---|---|
  | **return type** — the type of the result | `int` |
  | **function name** | `times2` |
  | **parameter** — an input, with type and name | `int x` |
  | **body** in braces | `{ ... }` |
  | **return statement** — ends the function and gives back a value | `return (2 * x);` |
  | **return value** | `2 * x` |

  The parentheses in `return (2 * x);` are optional — `return` is not a
  function.

  ### Prototype, call, implementation
  Functions must be declared before they are used. A complete program has:

  ```c example stdin=5
  #include <stdio.h>

  int times2(int x);                 /* prototype (declaration) */

  int main(void)
  {
      int x;
      printf("This program will double your input\n");
      printf("Please input an integer-> ");
      scanf("%d", &x);
      printf("%d * 2 = %d\n", x, times2(x));   /* call */
      return 0;
  }

  int times2(int x)                  /* implementation (definition) */
  {
      return (2 * x);
  }
  ```

  The prototype is the first line of the definition followed by `;`. It lets
  `main` call `times2` even though the definition comes later. (Placing the
  whole definition above `main` also works.)

  Note that `main` and `times2` both have a variable called `x`. They are
  **different variables** that happen to share a name — each function has its
  own. You could rename either one.

  > [!correction] Slide 19's rule "functions must be declared before they are
  > used" is enforced since C99: calling an undeclared function is an error.
success: |
  A function has a return type, a name, parameters and a body that returns a
  value. The prototype declares it, the call uses it, and the definition
  implements it.
steps:
  - id: missing-prototype
    type: predict
    title: What if the prototype is missing?
    prompt: This program calls `times2` before it is defined and has no prototype. What happens when it is compiled?
    expectCompileError: true
    code: |
      #include <stdio.h>

      int main(void)
      {
          printf("%d\n", times2(4));
          return 0;
      }

      int times2(int x)
      {
          return 2 * x;
      }
    answer:
      kind: choice
      choices:
        - "It prints 8"
        - "It prints 0"
        - "The compiler reports an error: times2 is not declared at the call"
        - "It crashes when it runs"
      correct: 2
    explanation: |
      The compiler reads the file from top to bottom. At the call, it has not
      seen any declaration of `times2`, and since C99 that is an error. A
      prototype above `main` fixes it.
  - id: main
    type: code
    title: Build times3
    prompt: |
      Add a function `int times3(int x)` that returns three times its argument:
      write its **prototype** above `main`, its **definition** below `main`,
      and print `x * 3 = ...` in main. For input `5`:

      ```
      5 * 2 = 10
      5 * 3 = 15
      ```

      The tests also call your `times3` directly with other values.
    stdin: "5\n"
    starter: |
      #include <stdio.h>

      int times2(int x);
      /* prototype of times3 */

      int main(void)
      {
          int x;

          scanf("%d", &x);
          printf("%d * 2 = %d\n", x, times2(x));
          /* print x * 3 using times3 */

          return 0;
      }

      int times2(int x)
      {
          return 2 * x;
      }

      /* definition of times3 */
    solution: |
      #include <stdio.h>

      int times2(int x);
      int times3(int x);

      int main(void)
      {
          int x;

          scanf("%d", &x);
          printf("%d * 2 = %d\n", x, times2(x));
          printf("%d * 3 = %d\n", x, times3(x));
          return 0;
      }

      int times2(int x)
      {
          return 2 * x;
      }

      int times3(int x)
      {
          return 3 * x;
      }
    explanation: |
      `times3` mirrors `times2`: same interface (one int in, one int out),
      different body. The prototype lets main call it before its definition.
    harness: |
      #include <stdio.h>
      int times3(int x);
      int main(void)
      {
          int v;
          while (scanf("%d", &v) == 1) {
              printf("times3(%d) = %d\n", v, times3(v));
          }
          return 0;
      }
    hints:
      - "times3 has the same interface as times2; only the result is different."
      - "You need three things: a prototype above main, a call inside main, and a definition below main."
      - "Prototype: `int times3(int x);` Definition: `int times3(int x) { return 3 * x; }`"
      - "In main: `printf(\"%d * 3 = %d\\n\", x, times3(x));`"
      - "The full solution adds the prototype, the call and the definition."
    tests:
      - id: program
        stdin: "5\n"
        note: The whole program.
        expect: { output: "5 * 2 = 10\n5 * 3 = 15\n" }
      - id: program-negative
        stdin: "-4\n"
        expect: { output: "-4 * 2 = -8\n-4 * 3 = -12\n" }
      - id: direct
        harness: true
        stdin: "0 1 7 -9 1000\n"
        note: The test harness calls times3 directly.
        expect: { output: "times3(0) = 0\ntimes3(1) = 3\ntimes3(7) = 21\ntimes3(-9) = -27\ntimes3(1000) = 3000\n" }
    require:
      functions: [times3]
