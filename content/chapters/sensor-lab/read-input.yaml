    - { label: Sum, pattern: "sum is\\s*(-?\\d+)", max: 4000000 }
title: Listen to the Operator
briefing: |
  The lab's old energy meter asks an operator for two readings and adds them.
  Half of its program is missing. Teach PIP-7 to read input.
lesson: |
  ### Reading input with scanf
  `scanf` (scan formatted) **reads** values typed by the user:

  ```c
  int n1;
  scanf("%d", &n1);   /* read one int and store it in n1 */
  ```

  * `"%d"` tells scanf what to expect: a whole number in decimal.
  * `&n1` is the **address** of `n1` — where the variable lives in memory.
    scanf needs to know *where* to put the value it reads. `printf` only needs
    the value, so it gets `n1` without `&`.

  You will learn much more about addresses later; for now remember:
  **scanf needs `&` before each variable you read into.**

  ### The lecture's add2.c
  ```c example stdin=3\n4
  /*
   * File: add2.c
   * Add two numbers
   */
  #include <stdio.h>

  int main(void)
  {
      int n1, n2;               /* variable declaration */

      printf("This program adds two numbers\n");
      printf("1st number? ");
      scanf("%d", &n1);
      printf("2nd number? ");
      scanf("%d", &n2);
      printf("The sum is %d.\n", n1 + n2);
      return 0;
  }
  ```

  `int n1, n2;` declares two variables in one line.

  ### Input in this game
  Type the program's input into the **Input** box *before* pressing Run
  (for example `3` and `4` on separate lines, or `3 4`). The output panel shows
  your input where a terminal would show it as you type. In a real terminal,
  the program pauses at scanf and waits for you to type.

  > [!note] scanf skips spaces and line breaks before a number, so `3 4` and
  > `3` ⏎ `4` both work.
success: |
  `scanf("%d", &n)` reads an int into `n`. The `&` gives scanf the address of
  the variable so it can store the value there. You now have a program that
  reacts to input — the same code works for any two numbers.
steps:
  - id: main
    type: code
    title: Finish the energy meter
    prompt: |
      The program reads the first number but not the second. Complete it so it
      reads both and prints their sum, for example with input `3 4`:

      ```
      This program adds two numbers
      1st number? 2nd number? The sum is 7.
      ```

      (The input itself is not part of the output; the prompts and the result
      end up on one line because the prompts have no `\n`.)
    stdin: "3\n4\n"
    starter: |
      #include <stdio.h>

      int main(void)
      {
          int n1, n2;

          printf("This program adds two numbers\n");
          printf("1st number? ");
          scanf("%d", &n1);
          printf("2nd number? ");
          /* read the second number into n2 */

          printf("The sum is %d.\n", n1);   /* print the sum, not just n1 */
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void)
      {
          int n1, n2;

          printf("This program adds two numbers\n");
          printf("1st number? ");
          scanf("%d", &n1);
          printf("2nd number? ");
          scanf("%d", &n2);

          printf("The sum is %d.\n", n1 + n2);
          return 0;
      }
    explanation: |
      The second `scanf("%d", &n2);` stores the next number in `n2`, and the
      final printf prints the expression `n1 + n2`. The tests try several pairs
      (including negative numbers and zero) because a program must work for any
      input, not only the example.
    hints:
      - "The second number needs its own scanf, and the result must use both variables."
      - "Copy the first scanf line and change the variable it stores into. Then fix the final printf."
      - "`scanf(\"%d\", &variable);` — don't forget the & before the variable name."
      - "Add `scanf(\"%d\", &n2);` and print `n1 + n2`."
      - "The full solution reads both numbers and prints their sum."
    tests:
      - id: example
        stdin: "3\n4\n"
        note: The example from the prompt.
        expect: { contains: ["The sum is 7."] }
      - id: negative
        stdin: "-15 6\n"
        note: Negative numbers.
        expect: { contains: ["The sum is -9."] }
      - id: zeros
        stdin: "0 0\n"
        expect: { contains: ["The sum is 0."] }
      - id: large
        stdin: "1000000\n2345678\n"
        note: Larger values.
        expect: { contains: ["The sum is 3345678."] }
    wrong:
      - code: |
          #include <stdio.h>
          int main(void)
          {
              int n1, n2;
              scanf("%d", &n1);
              scanf("%d", n2);
              printf("The sum is %d.\n", n1 + n2);
              return 0;
          }
        why: missing & (compiler warning, crash or wrong value at run time)
