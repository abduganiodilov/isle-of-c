id: relay-station/signal-tools
version: 1
kind: challenge
source:
  - { lecture: L11, slides: [22, 24] }
topics: [L11.array-parameter, L11.array-argument]
prerequisites: [relay-station/swap-pair]
estimatedMinutes: 25
objectives:
  - Write functions with an array parameter and a separate length parameter.
  - Write functions that return information about an array and functions that change it in place.
world:
  scene: terminal
  label: SIGNAL TOOLKIT
  goal: Build three reusable signal tools
title: Signal Tools
briefing: |
  The relay technicians need a toolkit that works on signal banks of any
  length: a summer, a peak finder and a reverser. Each tool is a function
  that receives the bank and its length.
lesson: |
  The typical array function has the shape the lecture calls the *typical
  situation*: the array, and as a separate parameter, its length.

  ```c
  int array_sum(int a[], int n);        /* returns a value      */
  void reverse(int a[], int n);         /* changes the array    */
  ```

  A function that **returns** information about the array (a sum, an index)
  has a return type; a function that **changes** the array in place can be
  `void`, since the caller sees the changes directly.

  > [!tip] To reverse in place, swap the first and last element, then the
  > second and the second-to-last, and so on — stop in the middle
  > (`i < n / 2`), or you will swap everything back.
success: |
  Array functions receive the array and its length. They can return a
  result computed from the elements or change the elements in place.
steps:
  - id: main
    type: code
    title: Build the toolkit
    prompt: |
      Write the three functions (keep `main` unchanged):

      | Function | Specification |
      |---|---|
      | `int array_sum(int a[], int n)` | returns the sum of the first `n` elements (0 if `n` is 0) |
      | `int index_of_max(int a[], int n)` | returns the index of the largest element (the first one if it appears more than once); `n` ≥ 1 |
      | `void reverse(int a[], int n)` | reverses the order of the first `n` elements in place |

      For input `5` and `4 9 2 9 1`:

      ```
      Sum: 25
      Peak: 9 at index 1
      Reversed: 1 9 2 9 4
      ```
    stdin: "5\n4 9 2 9 1\n"
    starter: |
      #include <stdio.h>

      #define MAX_SIGNALS 50

      int array_sum(int a[], int n);
      int index_of_max(int a[], int n);
      void reverse(int a[], int n);

      int main(void)
      {
          int signal[MAX_SIGNALS];
          int n, i, peak;

          scanf("%d", &n);
          for (i = 0; i < n; i++) {
              scanf("%d", &signal[i]);
          }

          printf("Sum: %d\n", array_sum(signal, n));
          peak = index_of_max(signal, n);
          printf("Peak: %d at index %d\n", signal[peak], peak);
          reverse(signal, n);
          printf("Reversed:");
          for (i = 0; i < n; i++) {
              printf(" %d", signal[i]);
          }
          printf("\n");
          return 0;
      }

      /* write the three functions here */
    solution: |
      #include <stdio.h>

      #define MAX_SIGNALS 50

      int array_sum(int a[], int n);
      int index_of_max(int a[], int n);
      void reverse(int a[], int n);

      int main(void)
      {
          int signal[MAX_SIGNALS];
          int n, i, peak;

          scanf("%d", &n);
          for (i = 0; i < n; i++) {
              scanf("%d", &signal[i]);
          }

          printf("Sum: %d\n", array_sum(signal, n));
          peak = index_of_max(signal, n);
          printf("Peak: %d at index %d\n", signal[peak], peak);
          reverse(signal, n);
          printf("Reversed:");
          for (i = 0; i < n; i++) {
              printf(" %d", signal[i]);
          }
          printf("\n");
          return 0;
      }

      int array_sum(int a[], int n)
      {
          int i;
          int sum = 0;

          for (i = 0; i < n; i++) {
              sum += a[i];
          }
          return sum;
      }

      int index_of_max(int a[], int n)
      {
          int i;
          int best = 0;

          for (i = 1; i < n; i++) {
              if (a[i] > a[best]) {
                  best = i;
              }
          }
          return best;
      }

      void reverse(int a[], int n)
      {
          int i, temp;

          for (i = 0; i < n / 2; i++) {
              temp = a[i];
              a[i] = a[n - 1 - i];
              a[n - 1 - i] = temp;
          }
      }
    explanation: |
      `array_sum` and `index_of_max` only read the elements and return a
      result. `reverse` swaps pairs from both ends towards the middle; its
      loop stops at `n / 2`, so every pair is swapped exactly once (with an
      odd `n`, the middle element stays where it is).
    harness: |
      #include <stdio.h>
      int array_sum(int a[], int n);
      int index_of_max(int a[], int n);
      void reverse(int a[], int n);
      int main(void)
      {
          int a[7] = {3, -1, 8, 8, 0, 2, 5};
          int b[1] = {42};
          int c[4] = {-5, -2, -9, -2};
          int i;
          printf("%d %d %d %d\n", array_sum(a, 7), array_sum(a, 3), array_sum(a, 0), array_sum(c, 4));
          printf("%d %d %d\n", index_of_max(a, 7), index_of_max(b, 1), index_of_max(c, 4));
          reverse(a, 7);
          reverse(c, 4);
          reverse(b, 1);
          for (i = 0; i < 7; i++) printf("%d ", a[i]);
          printf("| ");
          for (i = 0; i < 4; i++) printf("%d ", c[i]);
          printf("| %d\n", b[0]);
          reverse(a, 2);
          printf("%d %d %d\n", a[0], a[1], a[2]);
          return 0;
      }
    hints:
      - "Each function only knows the array through its parameter and the length through n; never use MAX_SIGNALS inside them."
      - "Sum: add every element. Peak: remember the best index so far. Reverse: swap element i with element n-1-i."
      - "In reverse, loop only to the middle: `for (i = 0; i < n / 2; i++)`."
      - "`temp = a[i]; a[i] = a[n - 1 - i]; a[n - 1 - i] = temp;`"
      - "The full solution has three short functions, each with one loop."
    tests:
      - id: example
        stdin: "5\n4 9 2 9 1\n"
        expect: { output: "Sum: 25\nPeak: 9 at index 1\nReversed: 1 9 2 9 4\n" }
      - id: even
        stdin: "4\n1 2 3 4\n"
        note: An even number of elements.
        expect: { output: "Sum: 10\nPeak: 4 at index 3\nReversed: 4 3 2 1\n" }
      - id: one
        stdin: "1\n-6\n"
        expect: { output: "Sum: -6\nPeak: -6 at index 0\nReversed: -6\n" }
      - id: direct
        harness: true
        note: The harness calls each tool with different arrays and lengths.
        expect: { output: "25 10 0 -18\n2 0 1\n5 2 0 8 8 -1 3 | -2 -9 -2 -5 | 42\n2 5 0\n" }
    require:
      functions: [array_sum, index_of_max, reverse]
