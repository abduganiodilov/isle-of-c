intro: >
  Beneath the central plateau lies the Archive Core, the island's memory.
  It is controlled by typed commands that store and analyse numbers in its
  memory slots. To restore it, PIP-7 must combine everything from the latest
  regions: arrays, array functions and strings.
outro: >
  The Archive Core remembers again. Every region of the current lectures is
  restored — and the island's memory is ready for whatever comes next.
