intro: >
  PIP-7, a small maintenance robot, wakes up on the shore of an abandoned
  research island. Its only way to talk to the world is a dusty communication
  terminal that runs programs written in C. Teach PIP-7 to speak.
outro: >
  The Comms Tower is broadcasting again. PIP-7 can now run complete C
  programs and print exactly what it needs to say.
