intro: >
  At the summit sleeps the Island Core, which links every station on the
  island. To wake it, PIP-7 must combine everything: input and output,
  calculations, decisions, loops and functions.
outro: >
  The Island Core is online. Every station reports in, and the island hums
  with life again. Beyond the summit, the cliffs and the southern shore
  still hold regions that wait to be restored.
