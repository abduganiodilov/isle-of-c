chapters:
  data-vault:
    title: Хранилище данных
    region: Западные скалы — хранилище данных
    intro: >
      В западных скалах вырублено хранилище данных острова: длинные стеллажи
      пронумерованных ячеек. Отдельных переменных уже не хватает — PIP-7
      должен научиться хранить целые ряды значений в массивах, обходить их
      циклами и никогда не выходить за последнюю ячейку.
    outro: >
      В хранилище порядок. PIP-7 умеет объявлять массивы, нумеровать
      элементы с 0, обрабатывать их циклами и знает, что C никогда не
      проверяет индекс за вас.

missions:
  data-vault/storage-racks:
    title: Складские стеллажи
    objectives:
      - Объяснить, что такое массив — упорядоченный набор значений одного типа.
      - Объявить массив с размером в квадратных скобках.
      - Читать и менять отдельные элементы по индексам, начиная с 0, в том числе с помощью ++ и +=.
    briefing: |
      У первого стеллажа хранилища три пронумерованные полки, и система учёта
      хранит количество ящиков на них в одном массиве. Обновите полки после
      сегодняшней поставки.
    lesson: |
      ### Что такое массив?
      **Массив** — это **упорядоченный** набор значений **одного типа**: все
      `int`, или все `double`, или все `char`. Упорядоченный — значит, у
      каждого элемента есть позиция, и можно обратиться к 1-му, 2-му, …

      ### Объявление массива
      Напишите тип, имя и — в квадратных скобках — сколько элементов будет в
      массиве:

      ```c
      char letters[4];   /* 4 char elements */
      int values[3];     /* 3 int elements  */
      ```

      Элементы лежат в памяти **друг за другом**. `letters` занимает 4 байта
      подряд; `values` — 12 байт, если `int` занимает 4 байта.

      ### Элементы нумеруются с 0
      В C первый элемент имеет индекс **0**, поэтому последний элемент
      массива размера `n` имеет индекс `n - 1`:

      | Массив | Допустимые индексы |
      |---|---|
      | `char letters[4]` | 0, 1, 2, 3 |
      | `int values[3]` | 0, 1, 2 |

      ### Работа с элементами
      `values[1]` — это один `int`. Его можно использовать везде, где можно
      использовать переменную `int`: слева от `=`, в выражениях, с `++` или
      `+=`.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          char letters[4];
          int values[3];
          int i;

          letters[0] = 'A';
          values[1] = 23;
          i = values[1] + 2;      /* i is 25 */
          values[1]++;            /* same as values[1] += 1; now 24 */

          printf("%c %d %d\n", letters[0], values[1], i);
          return 0;
      }
      ```

      Чтобы прочитать значение в элемент через `scanf`, передайте адрес
      элемента, как и для переменной: `scanf("%d", &values[0]);`

      > [!tip] Массиву можно задать начальные значения **списком
      > инициализации**: `int values[3] = {7, 23, 5};`. Пропущенные элементы
      > получают 0, поэтому `int counts[10] = {0};` начинается с десяти нулей.

      > [!correction] На слайде 9 написано `value[1]++`; массив в примере
      > называется `values`, поэтому правильно `values[1]++`.
    success: |
      Массив хранит несколько значений одного типа под одним именем.
      `rack[0]` — первый элемент, `rack[2]` — третий; каждый элемент ведёт
      себя как обычная переменная.
    world: { label: СКЛАДСКОЙ СТЕЛЛАЖ }
    steps:
      element-predict:
        title: Следите за элементами
        prompt: Что выведет эта программа?
        explanation: |
          `values[2]` становится 8, а `i` — 23 + 2 = 25. Затем `values[1]++`
          делает его 24 (i остаётся 25), а `values[0] += values[2]` делает его
          4 + 8 = 12.
      index-quiz:
        title: Какая полка?
        question: "Массив объявлен как `int rack[3];`. Какое выражение — **последний** элемент?"
        explanation: |
          Индексы начинаются с 0, поэтому у массива из 3 элементов индексы 0, 1
          и 2. `rack[3]` был бы *за* концом массива.
      main:
        title: Обновите стеллаж
        prompt: |
          Прочитайте количество ящиков на трёх полках в массив `rack`. Затем
          внесите сегодняшние изменения **в элементы массива**:

          1. на полку 0 привезли 10 ящиков (используйте `+=`),
          2. на полку 2 добавили один ящик (используйте `++`),
          3. полка 1 становится резервной: на ней теперь сумма полок 0 и 2.

          Выведите три полки. Для ввода `5 7 9`:

          ```
          rack[0] = 15
          rack[1] = 25
          rack[2] = 10
          ```
        explanation: |
          Каждый элемент используется как переменная: `rack[0] += 10;` и
          `rack[2]++;` меняют отдельные элементы, а `rack[1] = rack[0] + rack[2];`
          читает два элемента и сохраняет результат в третий. Порядок важен:
          полка 1 вычисляется после двух других изменений.
        hints:
          - |-
            Каждый `rack[k]` — обычная переменная int с номером в имени. Первая полка — индекс 0.
          - |-
            Вносите изменения в указанном порядке: сначала полки 0 и 2, затем вычислите полку 1 из новых значений.
          - |-
            `rack[0] += 10;` прибавляет 10 к первому элементу; `rack[2]++;` прибавляет 1 к третьему.
          - |-
            Последнее изменение: `rack[1] = rack[0] + rack[2];`
          - |-
            Полное решение добавляет три инструкции между scanf и вызовами printf.
        tests:
          empty: Пустые полки.
          negative: Отрицательные количества — это исправления прошлых ошибок.

  data-vault/rack-loops:
    title: Стеллажи и циклы
    objectives:
      - Использовать переменную как индекс массива, чтобы обработать все элементы циклом for.
      - Задать размер массива константой #define и использовать ту же константу в циклах.
      - Сохранить ввод в массиве, чтобы обработать его больше одного раза.
    world: { label: РЯД ДАТЧИКОВ, goal: Сохраните шесть показаний и проанализируйте их дважды }
    briefing: |
      Вдоль коридора хранилища стоят шесть датчиков температуры. Блоку
      климат-контроля нужны их показания в обратном порядке, их среднее и
      сколько из них выше среднего — поэтому каждое показание нужно сохранить,
      а не просто сложить.
    lesson: |
      ### Переменная в роли индекса
      Индексом может быть любое целое выражение — обычно переменная цикла.
      Так обрабатывают весь массив:

      ```c
      for (i = 0; i < 3; i++)
          values[i] = 0;        /* values[0], values[1], values[2] are 0 */
      ```

      Цикл проводит `i` через 0, 1, 2 — ровно по допустимым индексам.
      Условие — `i < 3`, **а не** `i <= 3`.

      ### Размер как константа
      Задайте размер константой `#define` и используйте **ту же** константу в
      каждом цикле. Тогда изменить размер позже — это правка одной строки:

      ```c example stdin=3\n1\n4\n1\n5
      #include <stdio.h>

      #define N_VALUES 5

      int main(void)
      {
          int values[N_VALUES];
          int i;

          for (i = 0; i < N_VALUES; i++) {
              scanf("%d", &values[i]);
          }
          for (i = N_VALUES - 1; i >= 0; i--) {
              printf("%d ", values[i]);       /* backwards */
          }
          printf("\n");
          return 0;
      }
      ```

      Зачем здесь массив? Чтобы вывести числа в обратном порядке, программа
      должна запомнить **все** числа, прежде чем выводить первое. Как только
      программе нужно просмотреть данные больше одного раза, ей нужен массив.

      > [!correction] На слайдах `main()` написана без типа результата.
      > Начиная с C99 он нужен каждой функции: используйте `int main(void)` и
      > `return 0;`.

      > [!correction] Слайд 11 говорит, что C99 разрешает переменную в роли
      > размера (`int scores[n];`, *массив переменной длины*). Это так, но с
      > C11 компиляторы могут эту возможность не поддерживать, такие массивы
      > нельзя инициализировать, а большое `n` может обрушить программу.
      > Константа `#define` — переносимый вариант, и в игре используется
      > именно он.
    success: |
      Переменная цикла — идеальный индекс: `for (i = 0; i < N; i++)` посещает
      каждый элемент ровно один раз. Когда размер задан константой `#define`,
      объявление и все циклы всегда согласованы.
    steps:
      loop-predict:
        title: Квадраты задом наперёд
        prompt: Что выведет эта программа?
        explanation: |
          Первый цикл сохраняет 0, 1, 4, 9 (квадраты индексов от 0 до 3).
          Второй цикл проводит i от 3 до 0 и выводит их в обратном порядке.
      main:
        title: Проанализируйте ряд датчиков
        prompt: |
          Прочитайте `READINGS` (6) целых показаний в массив `temp`. Затем
          выведите:

          1. показания в **обратном** порядке,
          2. их среднее с двумя знаками после точки,
          3. сколько показаний **строго больше** среднего.

          Для ввода `1 2 3 4 5 6`:

          ```
          Reversed: 6 5 4 3 2 1
          Average: 3.50
          Above average: 3
          ```
        explanation: |
          Показания сохраняются один раз, а затем их обходят три цикла: один —
          в обратном порядке для вывода, второй — чтобы сложить, третий —
          чтобы сравнить каждое показание со средним. Последний цикл возможен
          только потому, что массив всё ещё хранит все показания, когда
          среднее уже известно.
        hints:
          - |-
            Среднее нужно знать раньше, чем можно посчитать показания выше него, поэтому показания должны остаться в массиве, и их нужно обойти снова.
          - |-
            Напишите три цикла после цикла ввода: вывод в обратном порядке, суммирование, затем сравнение каждого элемента со средним.
          - |-
            В обратном порядке: `for (i = READINGS - 1; i >= 0; i--)`. Выводите `" %d"`, чтобы перед каждым числом был пробел.
          - |-
            `average = (double) sum / READINGS;`, затем внутри цикла `if (temp[i] > average) above++;`.
          - |-
            Полное решение выводит `Reversed:` одним циклом, вычисляет сумму и среднее и считает третьим циклом.
        tests:
          equal: Ни одно показание не может быть строго больше равного ему среднего.
          mixed: Отрицательные показания и целое среднее.
          fraction: Среднее равно 5.17, поэтому выше него только одно показание.

  data-vault/memory-map:
    title: Карта памяти
    objectives:
      - Предсказать, сколько байт занимает массив, по типу элементов и размеру.
      - Применить sizeof к массиву и вычислить число элементов как sizeof array / sizeof array[0].
    world: { label: КАРТА ПАМЯТИ ХРАНИЛИЩА, goal: Измерьте каждый блок хранения }
    briefing: |
      Карта памяти хранилища потеряла подписи. Каждый блок — массив; измерьте,
      сколько байт занимает каждый и сколько элементов в нём помещается.
    lesson: |
      ### Массивы в памяти
      Элементы массива хранятся **один за другим**. Массив из `n` элементов
      типа, занимающего `b` байт, поэтому занимает `n × b` байт:

      | Объявление | Размер элемента | Всего |
      |---|---|---|
      | `char letters[4];` | 1 байт | 4 байта |
      | `int values[3];` | 4 байта (здесь) | 12 байт |
      | `double samples[8];` | 8 байт | 64 байта |

      `sizeof` (из сенсорной лаборатории) работает и с массивом:
      `sizeof values` — размер **всего** массива в байтах, а
      `sizeof values[0]` — размер одного элемента. Их частное — число
      элементов:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          char letters[4];
          int values[3];

          printf("letters: %zu bytes\n", sizeof letters);
          printf("values: %zu bytes\n", sizeof values);
          printf("elements in values: %zu\n", sizeof values / sizeof values[0]);
          return 0;
      }
      ```

      > [!note] Размеры `int` и `double` зависят от платформы (слайд 6
      > говорит, что int *может* занимать четыре байта). В этой игре `int`
      > занимает 4 байта, а `double` — 8, как и на большинстве настольных
      > компьютеров.
    success: |
      Массив — это один блок элементов подряд: его размер в байтах равен числу
      элементов, умноженному на размер элемента, а `sizeof a / sizeof a[0]`
      возвращает число элементов.
    steps:
      bytes-quiz:
        title: Насколько велик блок?
        question: "`int` занимает 4 байта. Сколько байт занимает `int counts[25];`?"
        explanation: |
          25 элементов × 4 байта = 100 байт, и все они в одном сплошном блоке.
      sizeof-predict:
        title: Измерьте массивы
        prompt: Что выведет эта программа? (В этой игре int занимает 4 байта, а double — 8.)
        explanation: |
          `tag` хранит 10 char по 1 байту: 10 байт. `level` хранит 5 double по
          8 байт: 40 байт. 40 / 8 = 5 элементов.
      main:
        title: Подпишите карту памяти
        prompt: |
          Допишите программу, чтобы она выводила размер в байтах и число
          элементов каждого из трёх массивов, **вычисленные через `sizeof`**
          (не вписывайте числа сами — объявления могут позже измениться):

          ```
          samples: 64 bytes, 8 elements
          tags: 12 bytes, 12 elements
          counts: 20 bytes, 5 elements
          ```
        explanation: |
          `sizeof имя` даёт байты всего массива; деление на размер одного
          элемента даёт их число. Для `char` оба числа совпадают, потому что
          char занимает ровно один байт.
        hints:
          - |-
            Повторите образец строки для samples для двух других массивов.
          - |-
            Байты: `sizeof tags`. Элементы: размер всего массива, делённый на размер одного элемента.
          - |-
            `sizeof counts / sizeof counts[0]`
          - |-
            `printf("tags: %zu bytes, %zu elements\n", sizeof tags, sizeof tags / sizeof tags[0]);`
          - |-
            Полное решение добавляет один printf для tags и один для counts.

  data-vault/overflow-alarm:
    title: Тревога переполнения
    objectives:
      - Объяснить, что C не проверяет индексы массива и что запись за концом — неопределённое поведение.
      - Узнать ошибку времени выполнения, которую игра сообщает при индексе за пределами массива.
      - Защищать каждую запись проверкой по размеру массива.
    world: { label: ЖУРНАЛ ТРЕВОГ, goal: Не дайте журналу писать за последнюю ячейку }
    briefing: |
      В журнале тревог хранилища есть место для пяти записей. Беспокойной
      ночью тревог приходит больше, и программа журнала продолжает писать —
      за конец своего массива. Пусть она сохраняет первые пять записей и
      считает те, что пришлось отбросить.
    lesson: |
      ### C не проверяет индексы
      Когда вы пишете `scores[i] = 100;`, C верит вам, что `i` — допустимый
      индекс. Если в `scores` 500 элементов, а `i` равно 523, значение
      записывается **куда-то** в память — но не в массив. Оно может
      перезаписать другую переменную, обрушить программу или казаться
      безвредным ещё долго.

      Это **неопределённое поведение**: стандарт C не говорит, что
      произойдёт. Компилятор игры добавляет проверку во время выполнения,
      поэтому такая программа останавливается с сообщением *«не пройдена
      проверка во время выполнения»* и именем функции. Обычный компилятор
      такого не сообщает — программа просто ведёт себя неправильно.

      ### Охраняйте индекс
      Прежде чем записывать, убедитесь, что индекс внутри массива:

      ```c
      if (count < MAX_LOG) {
          entries[count] = value;
          count++;
      }
      ```

      Допустимые индексы — от `0` до `MAX_LOG - 1`, поэтому проверка — `<`,
      и никогда не `<=`.

      > [!correction] Слайд 12 говорит, что значение запишется «куда-то».
      > Точнее, поведение не определено: может случиться что угодно, включая
      > аварийное завершение или тихо неверные результаты.
    success: |
      Каждой записи в массив нужен индекс от 0 до размер − 1, и C его за вас
      не проверит. Сравнивайте индекс с той же константой `#define`, которая
      задала размер массива.
    steps:
      bounds-quiz:
        title: Что сделает C?
        question: "`int scores[500];`, а `i` равно 523. Что произойдёт при `scores[i] = 100;` в стандартном C?"
        choices:
          - Компилятор сообщит об ошибке.
          - Массив вырастет до 524 элементов.
          - 'Поведение не определено: значение попадёт за пределы массива, и может случиться что угодно.'
          - Инструкция будет пропущена.
        explanation: |
          C не проверяет индексы ни при компиляции (i известно только во время
          выполнения), ни при выполнении. Запись за пределы массива —
          неопределённое поведение.
      main:
        title: Почините журнал тревог
        prompt: |
          На вводе число `n`, за ним `n` кодов тревог. Сохраняйте в массив
          **только первые `MAX_LOG` (5)** кодов; остальные считайте
          отброшенными. Для ввода `7` и `4 8 15 16 23 42 99`:

          ```
          Stored: 5
          Dropped: 2
          Log: 4 8 15 16 23
          ```

          Сначала запустите исходный код с этим вводом и посмотрите, к чему
          приводит переполнение.
        explanation: |
          Каждый код по-прежнему **читается** (чтобы ввод не сбился), но
          **сохраняется** только пока `stored < MAX_LOG`. Когда журнал полон,
          код считается отброшенным. Индекс никогда не достигает `MAX_LOG`.
        hints:
          - |-
            Запустите исходный код с 7 кодами: проверка во время выполнения остановит его, когда он запишет entries[5], которого не существует.
          - |-
            Продолжайте читать каждый код, но сохраняйте его, только если ещё есть место; иначе считайте его отброшенным.
          - |-
            Место есть, пока `stored < MAX_LOG`.
          - |-
            `if (stored < MAX_LOG) { entries[stored] = code; stored++; } else { dropped++; }`
          - |-
            Полное решение оборачивает сохранение в этот if/else внутри цикла чтения.
        tests:
          overflow: На два кода больше, чем помещается в журнал.
          none: Спокойная ночь.

  data-vault/copy-protocol:
    title: Протокол копирования
    objectives:
      - Объяснить, что массив нельзя присвоить целиком через =.
      - Скопировать массив поэлементно циклом.
    world: { label: БЛОК РЕЗЕРВНОГО КОПИРОВАНИЯ, goal: Сохраните копию показаний перед перекалибровкой }
    briefing: |
      Прежде чем хранилище перекалибрует датчики, оно должно сохранить копию
      исходных показаний. Инженер попытался скопировать весь массив одним
      `=`, и компилятор отказывается. Напишите копирование правильно.
    lesson: |
      ### Массив целиком присвоить нельзя
      Имя массива обозначает весь блок элементов, и C не позволяет присвоить
      блок через `=`:

      ```c example error
      int main(void)
      {
          int readings[4] = {1, 2, 3, 4};
          int backup[4];

          backup = readings;     /* error: array type is not assignable */
          return 0;
      }
      ```

      ### Копируйте поэлементно
      Копируйте по одному элементу в цикле:

      ```c
      for (i = 0; i < N; i++) {
          backup[i] = readings[i];
      }
      ```

      После копирования массивы независимы: если позже изменить
      `readings[0]`, `backup[0]` не изменится.
    success: |
      `=` не копирует массив. Цикл копирует его поэлементно, и копия — это
      отдельный массив, который сохраняется, пока оригинал меняется.
    steps:
      assign-predict:
        title: Одно большое присваивание?
        prompt: Что произойдёт при компиляции этой программы?
        answer:
          choices:
            - Выведет 5
            - Выведет 0
            - 'Компилятор сообщит об ошибке: массиву нельзя присваивать'
            - Скомпилируется, но b останется неинициализированным
        explanation: |
          `b = a;` пытается присвоить массив целиком, а C этого не позволяет.
          Clang сообщает *array type 'int[3]' is not assignable*.
      main:
        title: Сохраните копию и перекалибруйте
        prompt: |
          Прочитайте `N` (4) показаний в `readings`, скопируйте их в `backup`,
          затем перекалибруйте: удвойте каждый элемент `readings`. Выведите оба
          массива. Для ввода `1 2 3 4`:

          ```
          Readings: 2 4 6 8
          Backup: 1 2 3 4
          ```
        explanation: |
          Недопустимое `backup = readings;` заменено циклом, который копирует
          каждый элемент. Копирование выполняется **до** перекалибровки,
          поэтому `backup` хранит исходные значения.
        hints:
          - |-
            Прочитайте ошибку компилятора: весь массив не может стоять слева от =.
          - |-
            Копируйте элементы по одному, и сделайте это до удвоения показаний.
          - |-
            У цикла копирования такой же заголовок, как у цикла чтения: `for (i = 0; i < N; i++)`.
          - |-
            Его тело: `backup[i] = readings[i];`
          - |-
            Полное решение заменяет присваивание этим циклом.

  data-vault/vault-ledger:
    title: 'Испытание главы: книга учёта хранилища'
    objectives:
      - Хранить переменное число значений (не больше максимума) в массиве.
      - Объединить несколько проходов по одному массиву, чтобы ответить на разные вопросы.
    world: { label: КНИГА УЧЁТА ХРАНИЛИЩА, goal: Проверьте вклады хранилища }
    briefing: |
      Хранилище ведёт книгу учёта вкладов энергии. Проверьте её: общую сумму,
      самый большой вклад и где он находится, а также все вклады выше
      среднего.
    lesson: |
      В этом испытании используется всё из хранилища: массив с размером из
      константы `#define`, переменное число реально используемых элементов
      (`n`), индексы с 0 и несколько циклов по одним и тем же данным.

      > [!tip] Чтобы проверить «значение выше среднего», не нужен `double`:
      > `value > total / n` — то же самое, что `value * n > total` при
      > положительном `n`, а у целочисленного варианта вообще нет округления.
    success: |
      Вы сохранили данные один раз и ответили на несколько вопросов о них,
      каждый своим проходом по массиву, — типичный способ работы с массивами.
    steps:
      main:
        title: Проверьте книгу учёта
        prompt: |
          **Ввод:** `n` (1 ≤ n ≤ `MAX_ENTRIES` = 100), затем `n` целых
          вкладов.

          **Вывод:**

          ```
          Entries: <n>
          Total: <sum of all deposits>
          Largest: <largest deposit> at index <its index, the first one if it appears several times>
          Above average: <the deposits greater than the average, in input order, or none>
          ```

          (`Total` — сумма всех вкладов; `Largest` — самый большой вклад и
          его индекс, первый, если он встречается несколько раз;
          `Above average` — вклады больше среднего в порядке ввода или
          `none`.)

          Для ввода `5` и `10 20 5 25 0` (среднее 12):

          ```
          Entries: 5
          Total: 60
          Largest: 25 at index 3
          Above average: 20 25
          ```
        explanation: |
          Первый цикл читает и суммирует. Второй запоминает **индекс** самого
          большого вклада (`best`), начиная с элемента 0 и заменяя его только
          на строго большее значение, поэтому побеждает первый максимум.
          Третий цикл сравнивает каждый вклад со средним без всякого округления
          (`deposit[i] * n > total`) и считает, сколько вывел, чтобы вывести
          `none`.
        hints:
          - |-
            Сначала прочитайте вклады в массив; каждый следующий вопрос — это один цикл по deposit[0] … deposit[n-1].
          - |-
            Для самого большого запоминайте его индекс, а не значение: начните с индекса 0 и заменяйте его, только найдя строго больший вклад.
          - |-
            Выше среднего: `deposit[i] * n > total`. Считайте, сколько вывели, чтобы вывести ` none`, если не вывели ничего.
          - |-
            `for (i = 1; i < n; i++) if (deposit[i] > deposit[best]) best = i;`
          - |-
            В полном решении три цикла: чтение и сумма, поиск индекса максимума, вывод вкладов выше среднего.
        tests:
          single: Один вклад никогда не больше собственного среднего.
          ties: Из двух равных наибольших вкладов считается первый.
          negative: Снятия — отрицательные числа.
          long: Среднее 52 / 12 = 4.33.
