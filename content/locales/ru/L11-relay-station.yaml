chapters:
  relay-station:
    title: Ретрансляционная станция
    region: Западный берег — ретрансляционная станция
    intro: >
      На западном берегу ретрансляционная станция передаёт между модулями
      целые банки значений сигналов. PIP-7 учится передавать массивы в
      функции — и выясняет, почему функция может изменить массив, но не
      обычный аргумент.
    outro: >
      Станция снова гудит. PIP-7 передаёт массивы в функции вместе с их
      длиной и знает, что функция работает с собственными элементами
      вызывающей стороны, а не с копией.

missions:
  relay-station/clear-banks:
    title: Очистка банков
    objectives:
      - Передать массив в функцию по имени вместе с его длиной.
      - Объявить параметр-массив как int array[] в прототипе и в определении.
      - Объяснить, что функция получает адрес элемента 0 и поэтому меняет элементы вызывающей стороны.
    world:
      label: СТЕК ВЫЗОВОВ
      illustration:
        - В main есть массив values из 5 элементов. (В лекции их 500; идея та же.)
        - 'main вызывает ClearIntegerArray(values, 5). Функция НЕ получает копию элементов: её параметр array получает АДРЕС values[0], а n — копию числа 5.'
        - array[i] = 0; пишет по этому адресу, поэтому меняет элементы main.
        - Функция завершается. Её переменные исчезают, но изменения в values остаются.
    briefing: |
      Станция хранит сигналы в банках целых чисел. Модуль сброса должен
      очищать банк, а модуль заполнения — загружать тестовый шаблон. Оба —
      функции, которые получают банк в виде массива.
    lesson: |
      ### Передача массива
      Чтобы передать массив в функцию, укажите аргументом **имя** массива, а
      его длину передайте отдельным аргументом:

      ```c
      ClearIntegerArray(values, N_VALUES);
      ```

      В прототипе и определении параметр-массив пишется с пустыми скобками:

      ```c
      void ClearIntegerArray(int array[], int n);
      ```

      ### Не копия, а адрес
      Обычные аргументы C передаёт **копией** значения (передача по
      значению). Массив не копируется. Значение имени массива — это **адрес
      его первого элемента**, и именно этот адрес получает функция. Поэтому
      `array[i]` внутри функции — тот же самый элемент, что `values[i]` в
      `main`: функция может менять элементы вызывающей стороны. (Сам адрес
      по-прежнему передаётся по значению: функция не может заставить
      `values` указывать на другой массив.)

      ```c example
      #include <stdio.h>

      #define N_VALUES 5

      void ClearIntegerArray(int array[], int n);

      int main(void)
      {
          int values[N_VALUES] = {3, 1, 4, 1, 5};
          int i;

          ClearIntegerArray(values, N_VALUES);
          for (i = 0; i < N_VALUES; i++) {
              printf("%d ", values[i]);
          }
          printf("\n");
          return 0;
      }

      void ClearIntegerArray(int array[], int n)
      {
          int i;
          for (i = 0; i < n; i++) {
              array[i] = 0;
          }
      }
      ```

      ### А размер?
      C разрешает написать `int array[N_VALUES]` в списке параметров, но
      **игнорирует** число: функция получает только адрес и не может знать,
      сколько там элементов. Поэтому длина передаётся отдельным параметром
      `n` — и цикл использует `n`, так что одна и та же функция работает с
      массивами любого размера.

      > [!correction] Строго говоря, имя массива при передаче
      > *преобразуется* в адрес его первого элемента. Поэтому `sizeof array`
      > внутри функции даёт размер этого адреса, а не массива — Clang об этом
      > предупреждает.
    success: |
      Функция получает массив как адрес его первого элемента, поэтому
      работает с собственными элементами вызывающей стороны. Длину нужно
      передавать отдельно, а размер в скобках параметра игнорируется.
    steps:
      change-predict:
        title: Что изменится?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `x` передаётся по значению: функция меняет только свою копию, и x в
          main остаётся 1. Массив передаётся как адрес `a[0]`, поэтому
          `a[0] = 9;` меняет элемент main. `a[1]` не затронут.
      size-quiz:
        title: Игнорируемый размер
        question: "Что делает 500 в `void ClearIntegerArray(int array[500], int n)`?"
        choices:
          - Функция получает копию 500 элементов.
          - 'Ничего: размер в скобках параметра игнорируется, функция получает только адрес.'
          - Вызовы с массивом другого размера не скомпилируются.
          - Присваивает n значение 500.
        explanation: |
          Параметр-массив — это на самом деле адрес первого элемента. C
          принимает размер в скобках, но игнорирует его, поэтому длину нужно
          передавать собственным параметром.
      main:
        title: Модули сброса и заполнения
        prompt: |
          Напишите две функции (`main` не меняйте):

          | Функция | Описание |
          |---|---|
          | `void ClearIntegerArray(int array[], int n)` | обнуляет первые `n` элементов |
          | `void FillIntegerArray(int array[], int n, int value)` | записывает `value` в первые `n` элементов |

          `main` очищает только первые 3 элемента, затем заполняет весь банк
          числом 7. Для ввода `1 2 3 4 5 6`:

          ```
          Before: 1 2 3 4 5 6
          After clear: 0 0 0 4 5 6
          After fill: 7 7 7 7 7 7
          ```

          Тесты также вызывают ваши функции напрямую с другими массивами.
        explanation: |
          Обе функции проходят циклом по первым `n` элементам полученного
          массива. Поскольку параметр ссылается на массив main, изменения
          видны в main после вызова — возвращать ничего не нужно.
        hints:
          - |-
            Параметр функции ссылается на массив main, поэтому присваивание array[i] меняет элементы main напрямую.
          - |-
            Каждая функция — один цикл for по индексам от 0 до n-1; n решает, сколько элементов изменится.
          - |-
            `for (i = 0; i < n; i++) array[i] = 0;`
          - |-
            У FillIntegerArray такой же цикл с `array[i] = value;`
          - |-
            Полное решение добавляет определения двух функций после PrintBank.
        tests:
          direct: Тест очищает 0 и 5 элементов и заполняет 2 и 0 элементов массива из 8 элементов.

  relay-station/swap-pair:
    title: Реле перестановки
    objectives:
      - Объяснить, почему функция с двумя параметрами int не может поменять местами переменные вызывающей стороны.
      - Поменять местами два значения в массиве, переданном в функцию, с помощью временной переменной.
    world:
      label: РЕЛЕ ПЕРЕСТАНОВКИ
      illustration:
        - 'Неудачная попытка: swap(int a, int b) получает КОПИИ. Она меняет местами свои копии, а переменные main не меняются.'
        - С массивом swap_pair(pair) получает адрес pair[0] и меняет местами собственные элементы main.
    briefing: |
      Два канала реле подключены наоборот. Напишите модуль, который меняет их
      местами, — практическая задача из лекции: поменять местами два целых
      числа, передав в функцию массив.
    lesson: |
      ### Почему функция обмена для int не работает
      Из главы о ядре вы знаете, что параметры — это копии. Функция
      `void swap(int a, int b)` может поменять местами `a` и `b`, но это её
      собственные копии; переменные вызывающей стороны остаются прежними.

      ### Обмен через массив
      Аргумент-массив даёт функции доступ к элементам вызывающей стороны.
      Чтобы поменять местами два элемента, нужна **временная** переменная —
      иначе первое присваивание затрёт значение до того, как оно сохранено:

      ```c
      temp = pair[0];
      pair[0] = pair[1];
      pair[1] = temp;
      ```

      > [!note] Функция, которая использует другую функцию, — это нормально:
      > когда `swap_pair` уже есть, `sort_pair` нужно лишь решить, *нужно
      > ли* её вызывать.
    success: |
      Обычные аргументы — копии, поэтому для обмена нужен доступ к
      собственной памяти вызывающей стороны — здесь к массиву. Для обмена
      двух значений всегда нужна временная переменная.
    steps:
      swap-predict:
        title: Обмен копиями
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `swap` меняет местами свои копии `a` и `b`. Ничего не возвращается, и
          `x` и `y` в main не затронуты, поэтому программа выводит `3 8`.
      main:
        title: Обмен и сортировка
        prompt: |
          Напишите две функции (`main` не меняйте):

          | Функция | Описание |
          |---|---|
          | `void swap_pair(int pair[])` | меняет местами `pair[0]` и `pair[1]` |
          | `void sort_pair(int pair[])` | ставит меньшее значение в `pair[0]` (используйте `swap_pair`) |

          Для ввода `3 8`:

          ```
          Swapped: 8 3
          Sorted: 3 8
          ```
        explanation: |
          `swap_pair` сохраняет `pair[0]` в `temp`, прежде чем затереть его.
          Поскольку параметр ссылается на массив main, обмен виден в main.
          `sort_pair` передаёт тот же массив в `swap_pair`, только когда
          значения стоят в неправильном порядке.
        hints:
          - |-
            Функция может менять элементы main, потому что получает массив, а не копии значений.
          - |-
            Сохраните одно значение во временной переменной, прежде чем его затереть.
          - |-
            `temp = pair[0]; pair[0] = pair[1]; pair[1] = temp;`
          - |-
            sort_pair: `if (pair[0] > pair[1]) swap_pair(pair);` — передайте имя массива дальше.
          - |-
            Полное решение определяет обе функции; sort_pair вызывает swap_pair.
        tests:
          direct: Тест вызывает swap_pair, а затем sort_pair для нескольких пар.

  relay-station/signal-tools:
    title: Инструменты для сигналов
    objectives:
      - Написать функции с параметром-массивом и отдельным параметром длины.
      - Написать функции, которые возвращают сведения о массиве, и функции, которые меняют его на месте.
    world: { label: НАБОР ИНСТРУМЕНТОВ, goal: Соберите три универсальных инструмента для сигналов }
    briefing: |
      Техникам станции нужен набор инструментов для банков сигналов любой
      длины: сумматор, поиск пика и разворот. Каждый инструмент — функция,
      которая получает банк и его длину.
    lesson: |
      Типичная функция для массива устроена так, как лекция называет
      *типичной ситуацией*: массив и отдельным параметром — его длина.

      ```c
      int array_sum(int a[], int n);        /* returns a value      */
      void reverse(int a[], int n);         /* changes the array    */
      ```

      У функции, которая **возвращает** сведения о массиве (сумму, индекс),
      есть тип результата; функция, которая **меняет** массив на месте, может
      быть `void`, потому что вызывающая сторона видит изменения напрямую.

      > [!tip] Чтобы развернуть массив на месте, поменяйте местами первый и
      > последний элементы, затем второй и предпоследний и так далее —
      > остановитесь на середине (`i < n / 2`), иначе вы всё поменяете
      > обратно.
    success: |
      Функции для массивов получают массив и его длину. Они могут вернуть
      результат, вычисленный по элементам, или изменить элементы на месте.
    steps:
      main:
        title: Соберите набор
        prompt: |
          Напишите три функции (`main` не меняйте):

          | Функция | Описание |
          |---|---|
          | `int array_sum(int a[], int n)` | возвращает сумму первых `n` элементов (0, если `n` равно 0) |
          | `int index_of_max(int a[], int n)` | возвращает индекс наибольшего элемента (первого, если он встречается несколько раз); `n` ≥ 1 |
          | `void reverse(int a[], int n)` | разворачивает порядок первых `n` элементов на месте |

          Для ввода `5` и `4 9 2 9 1`:

          ```
          Sum: 25
          Peak: 9 at index 1
          Reversed: 1 9 2 9 4
          ```
        explanation: |
          `array_sum` и `index_of_max` только читают элементы и возвращают
          результат. `reverse` меняет местами пары от краёв к середине; её цикл
          останавливается на `n / 2`, поэтому каждая пара меняется ровно один
          раз (при нечётном `n` средний элемент остаётся на месте).
        hints:
          - |-
            Каждая функция знает массив только через параметр, а длину — через n; никогда не используйте MAX_SIGNALS внутри них.
          - |-
            Сумма: сложите все элементы. Пик: запоминайте лучший индекс. Разворот: меняйте местами элемент i и элемент n-1-i.
          - |-
            В reverse идите только до середины: `for (i = 0; i < n / 2; i++)`.
          - |-
            `temp = a[i]; a[i] = a[n - 1 - i]; a[n - 1 - i] = temp;`
          - |-
            В полном решении три короткие функции, в каждой по одному циклу.
        tests:
          even: Чётное число элементов.
          direct: Тест вызывает каждый инструмент с разными массивами и длинами.

  relay-station/calibration:
    title: 'Испытание главы: калибровка реле'
    objectives:
      - Разбить программу с массивом на функции, которые читают, анализируют, меняют и выводят массив.
      - Передавать один и тот же массив через несколько функций, каждая из которых работает с элементами вызывающей стороны.
    world: { label: КАЛИБРАТОР РЕЛЕ, goal: Уберите базовый уровень из сигналов реле }
    briefing: |
      Каждый канал реле несёт постоянное смещение — базовый уровень. Чтобы
      откалибровать канал, найдите наименьшее показание, вычтите его из
      каждого показания и сообщите, сколько показаний всё ещё выше порога
      шума.
    lesson: |
      Это испытание целиком построено из функций для массивов. Даже чтение
      ввода — функция: `read_array(a, n)` заполняет массив вызывающей
      стороны, потому что `scanf("%d", &a[i])` внутри неё записывает в
      элементы вызывающей стороны.

      Планируйте программу сверху вниз: `main` только читает размеры и
      вызывает функции по порядку; каждая функция выполняет одну задачу с
      полученным массивом.
    success: |
      Реле откалибровано четырьмя небольшими функциями, которые работают с
      массивом вызывающей стороны: одна заполняет его, одна измеряет, одна
      меняет и одна выводит.
    steps:
      main:
        title: Откалибруйте реле
        prompt: |
          **Ввод:** `n` (1 ≤ n ≤ 50), `n` целых показаний, затем порог `t`.

          Напишите и используйте эти функции:

          | Функция | Описание |
          |---|---|
          | `void read_array(int a[], int n)` | читает `n` целых чисел в `a` |
          | `void print_array(int a[], int n)` | выводит каждый элемент с пробелом перед ним, затем перевод строки |
          | `int min_value(int a[], int n)` | возвращает наименьший элемент |
          | `void shift(int a[], int n, int amount)` | прибавляет `amount` к каждому элементу |

          **Вывод:** для ввода `5`, `12 15 11 20 11`, `3`:

          ```
          Raw: 12 15 11 20 11
          Baseline: 11
          Calibrated: 1 4 0 9 0
          Above 3: 2
          ```

          (`Above t` считает откалиброванные показания строго больше `t`.)
        explanation: |
          `main` читается как план: прочитать, вывести, измерить, сдвинуть на
          минус базовый уровень, вывести, посчитать. Каждая вспомогательная
          функция работает с массивом вызывающей стороны через параметр,
          поэтому `shift` меняет `reading` в main, ничего не возвращая.
        hints:
          - |-
            main должна только вызывать функции по порядку: прочитать, вывести, найти минимум, сдвинуть, вывести, посчитать.
          - |-
            Чтобы вычесть базовый уровень через `shift`, передайте отрицательную величину: `shift(reading, n, -baseline);`
          - |-
            min_value: начните с `int min = a[0];` и сравните остальные элементы.
          - |-
            read_array: `for (i = 0; i < n; i++) scanf("%d", &a[i]);` — она заполняет массив вызывающей стороны.
          - |-
            Полное решение содержит четыре функции и main, которая их вызывает, плюс цикл подсчёта.
        tests:
          negative-baseline: Отрицательный базовый уровень поднимает каждое показание.
          functions: Тест вызывает каждую функцию напрямую.
