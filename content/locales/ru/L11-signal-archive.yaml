chapters:
  signal-archive:
    title: Архив сигналов
    region: Южные холмы — архив сигналов
    intro: >
      Архив сигналов хранит десятилетия радиосообщений в виде рядов символов.
      Чтобы прочитать их, PIP-7 должен освоить специальные символы,
      арифметику символов и способ, которым C хранит текст: массивы символов,
      заканчивающиеся невидимым нулевым символом.
    outro: >
      Архив снова говорит. PIP-7 читает и пишет строки в стиле C, проходит их
      символ за символом до '\0' и превращает символы-цифры в числа.

missions:
  signal-archive/escape-sequences:
    title: Специальные символы
    objectives:
      - Вспомнить коды ASCII и вывести символ по его коду.
      - Использовать управляющие последовательности для специальных символов — табуляции, кавычек, обратной косой черты, нулевого символа — и восьмеричные или шестнадцатеричные коды.
    world: { label: ПАНЕЛЬ АРХИВА, goal: Выведите панель сигналов архива }
    briefing: |
      Панель архива выравнивает столбцы табуляцией, берёт имена в кавычки и
      показывает пути в стиле Windows, полные обратных косых черт. Для всего
      этого в C нужны специальные символы.
    lesson: |
      ### Снова ASCII
      Каждый символ хранится в виде кода (см. **Блокнот → таблица ASCII**):
      `'A'` — 65, `'0'` — 48, пробел — 32. Большинство кодов —
      печатаемые символы; коды 0–31 и 127 — **специальные символы**,
      которые выполняют действие, например начинают новую строку.

      ### Управляющие последовательности
      Внутри символьных и строковых констант обратная косая черта начинает
      **управляющую последовательность**:

      | Последовательность | Значение | Код |
      |---|---|---|
      | `\n` | новая строка | 10 |
      | `\t` | горизонтальная табуляция | 9 |
      | `\v` | вертикальная табуляция | 11 |
      | `\b` | возврат на символ | 8 |
      | `\r` | возврат каретки | 13 |
      | `\f` | перевод страницы | 12 |
      | `\a` | сигнал (звонок) | 7 |
      | `\\` | обратная косая черта | 92 |
      | `\'` | одинарная кавычка | 39 |
      | `\"` | двойная кавычка | 34 |
      | `\0` | нулевой символ | 0 |
      | `\ooo` | символ с восьмеричным кодом ooo, например `\101` = `'A'` | |
      | `\xhh` | символ с шестнадцатеричным кодом hh, например `\x41` = `'A'` | |

      ```c example
      #include <stdio.h>

      int main(void)
      {
          printf("Name\tCode\n");
          printf("\"A\"\t%d\n", 'A');
          printf("Octal 101 is %c, hex 42 is %c\n", '\101', '\x42');
          printf("Path: C:\\archive\\logs\n");
          return 0;
      }
      ```

      > [!note] Нулевой символ `\0` (код 0) ничего не выводит. В следующей
      > миссии он станет очень важным: он отмечает конец каждой строки C.
      > `\a` просит терминал подать звуковой сигнал; многие современные
      > терминалы его игнорируют.
    success: |
      Обратная косая черта в символьной или строковой константе начинает
      управляющую последовательность: `\t`, `\"`, `\\`, `\0` или символ,
      заданный восьмеричным (`\101`) или шестнадцатеричным (`\x41`) кодом.
    steps:
      codes-predict:
        title: Коды специальных символов
        prompt: Что выведет эта программа?
        explanation: |
          Новая строка — код 10, табуляция — 9, нулевой символ — 0. `'\x48'` —
          шестнадцатеричное 48 = 72 = `'H'`, а `'\111'` — восьмеричное 111 =
          73 = `'I'`.
      main:
        title: Выведите панель сигналов
        prompt: |
          Прочитайте код символа и выведите для него панель архива. Разделяйте
          столбцы **табуляцией** (`\t`). Для ввода `65` вывод такой:

          ```
          Signal	Code	Char
          "beacon"	65	'A'
          Path: C:\archive\65
          ```

          (Промежутки в первых двух строках — одиночные символы табуляции.)
        explanation: |
          `\t` даёт символы табуляции, `\"` ставит двойную кавычку внутрь
          строки, а `\\` даёт одну обратную косую черту. Одинарную кавычку
          внутри *строки* экранировать не нужно (только в символьной
          константе: `'\''`).
        hints:
          - |-
            Специальные символы пишутся с обратной косой чертой: у табуляции, двойной кавычки и обратной косой черты есть свои управляющие последовательности.
          - |-
            Замените пробелы в заголовке на `\t` и выведите символ через `%c` между одинарными кавычками.
          - |-
            `\"` выводит `"`, а `\\` выводит одну обратную косую черту.
          - |-
            `printf("\"beacon\"\t%d\t'%c'\n", code, code);`
          - |-
            Полное решение выводит три строки с табуляциями, экранированными кавычками и обратными косыми чертами.
        tests:
          digit: Код 55 — это символ цифры '7'.

  signal-archive/null-terminator:
    title: Нулевой символ
    objectives:
      - Объяснить, что строка C — это массив char, который заканчивается нулевым символом '\0'.
      - Выводить строки через %s и читать слова через scanf("%19s", ...) с ограничением ширины.
      - Знать, что gets больше не существует, а fgets сохраняет перевод строки.
      - Проходить строку символ за символом до '\0'.
    world: { label: СЧИТЫВАТЕЛЬ ПОЗЫВНЫХ, goal: Прочитайте позывной и произнесите его по буквам }
    briefing: |
      Каждое сообщение в архиве начинается с позывного отправителя. Читайте
      позывные как строки C, измеряйте их и записывайте по буквам для
      указателя архива.
    lesson: |
      ### Строки в стиле C
      В C нет отдельного строкового типа. **Строка в стиле C** — это массив
      `char`, который заканчивается **нулевым символом** `'\0'` (код 0).
      Именно по этому завершающему символу любая функция узнаёт, где
      кончается текст.

      ```c
      char word[] = "PIP";   /* 4 elements: 'P' 'I' 'P' '\0' */
      ```

      Строковая константа вроде `"PIP"` добавляет `'\0'` сама, поэтому в
      этом массиве **4** элемента. В массиве для текста всегда должно быть
      место для завершающего символа: `char name[20]` вмещает не больше 19
      видимых символов.

      `printf` выводит строку через **`%s`**: он выводит символы, пока не
      встретит `'\0'`.

      ### Чтение строк
      ```c example stdin=Los\nAngeles
      #include <stdio.h>

      int main(void)
      {
          char city[30];

          printf("Enter a city: ");
          scanf("%29s", city);          /* no & : city is already an address */
          printf("You entered %s\n", city);
          return 0;
      }
      ```

      * `scanf("%s", city)` читает **одно слово**: он останавливается на
        первом пробеле, поэтому из «Los Angeles» получится только `Los`.
        Имени массива не нужен `&` — оно уже является адресом первого
        элемента.
      * Без ширины `%s` пишет за конец массива, если слово слишком длинное.
        Всегда указывайте ширину: не больше размер − 1 символов (`%29s` для
        `char city[30]`).
      * `fgets(city, sizeof city, stdin)` читает **всю строку** вместе с
        пробелами и никогда не больше, чем вмещает массив, — но сохраняет
        `'\n'` в конце строки.

      ### Обход строки
      Раз конец отмечен `'\0'`, цикл может посетить каждый символ, пока не
      найдёт его:

      ```c
      i = 0;
      while (name[i] != '\0') {
          /* use name[i] */
          i++;
      }
      /* now i is the length */
      ```

      > [!correction] На слайде 33 показан `gets(city)`. `gets` не может знать
      > размер массива, поэтому её **удалили из C** в C11 — компилятор C17
      > её отвергает. Используйте `fgets` (или `scanf` с шириной). В
      > `scanf(“%s”, city)` со слайда также нужны обычные кавычки `"`.
    success: |
      Строка C — массив char, который заканчивается `'\0'`. `%s` выводит её,
      `scanf("%19s", …)` безопасно читает одно слово, `fgets` читает строку
      целиком, а цикл может пройти её до завершающего символа.
    steps:
      size-predict:
        title: Сколько элементов?
        prompt: Что выведет эта программа?
        explanation: |
          В строковой константе 3 видимых символа плюс завершающий, поэтому в
          массиве 4 элемента. `word[3]` — это завершающий `'\0'`, его код 0.
      scanf-quiz:
        title: Одно слово
        question: "Пользователь вводит `Los Angeles`. Что `scanf(\"%29s\", city);` сохранит в city?"
        choices:
          - "`Los Angeles`"
          - "`Los`"
          - "`Los Angeles` и перевод строки"
          - 'Ничего: scanf не умеет читать текст'
        explanation: |
          `%s` читает последовательность символов без пробелов, поэтому
          останавливается на пробеле. Чтобы прочитать всю строку с пробелами,
          используйте `fgets` — она также сохранит перевод строки.
      main:
        title: Произнесите позывной по буквам
        prompt: |
          Прочитайте позывной (одно слово, не больше 19 символов) в `name`.
          Выведите его, его длину и буквы через дефис. Длину считайте
          **сами** циклом, который останавливается на `'\0'`. Для ввода
          `ALPHA`:

          ```
          Callsign: ALPHA
          Length: 5
          Spelled: A-L-P-H-A
          ```
        explanation: |
          Цикл `while` увеличивает `length`, пока не дойдёт до завершающего
          символа, поэтому в конце в ней число видимых символов. Второй цикл
          выводит каждый символ через `%c` и дефис перед каждым символом,
          кроме первого.
        hints:
          - |-
            Строка кончается на элементе, где хранится '\0'. Посчитайте, сколько элементов стоит перед ним.
          - |-
            Один цикл считает, второй выводит каждый символ; ставьте дефис перед каждым символом, кроме первого.
          - |-
            `while (name[length] != '\0') length++;`
          - |-
            `for (i = 0; i < length; i++) { if (i > 0) printf("-"); printf("%c", name[i]); }`
          - |-
            Полное решение считает циклом while и выводит циклом for.
        tests:
          one: Одному символу дефис не нужен.
          two-words: scanf с %s читает только первое слово.
          longest: 19 символов — больше не помещается.

  signal-archive/digit-decoder:
    title: Дешифратор цифр
    objectives:
      - Работать с символами как с целыми числами в сравнениях и арифметике.
      - Проверять, является ли символ цифрой, через ch >= '0' && ch <= '9'.
      - Превращать символ цифры в её значение через ch - '0' и собирать число из цифр.
    world: { label: ДЕШИФРАТОР КОДОВ }
    briefing: |
      Номера сообщений в архиве смешивают буквы и цифры, например `A7B42`.
      Указателю нужны только цифры: сколько их, их сумма и число, которое
      они образуют, если читать их по порядку.
    lesson: |
      ### Символы — это целые числа
      `char` хранит код символа, поэтому его можно сравнивать и использовать
      в арифметике, как любое целое число: `'A' == 65` истинно, а `'A' + 1` —
      это `'B'`.

      ### Это цифра?
      У символов цифр от `'0'` до `'9'` коды идут подряд (от 48 до 57),
      поэтому

      ```c
      if (ch >= '0' && ch <= '9')    /* ch is a digit */
      ```

      ### Из символа — значение
      Раз коды идут подряд, вычитание кода `'0'` даёт значение цифры:
      `'7' - '0'` — это `55 - 48 = 7`.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          char ch = '7';

          printf("code %d, value %d\n", ch, ch - '0');
          printf("%c is a digit: %d\n", 'x', 'x' >= '0' && 'x' <= '9');
          return 0;
      }
      ```

      ### Из цифр — число
      Читайте цифры слева направо и каждый раз сдвигайте число на один
      разряд: `number = number * 10 + (ch - '0');` — для `"742"` это даёт 7,
      74, 742.
    success: |
      Символы — небольшие целые числа. `ch >= '0' && ch <= '9'` проверяет
      цифру, `ch - '0'` даёт её значение, а `number * 10 + value` собирает
      число цифра за цифрой.
    steps:
      arith-predict:
        title: Арифметика символов
        prompt: Что выведет эта программа?
        explanation: |
          `'9' - '0'` — это 57 − 48 = 9. `'A' + 2` — 67, выводится через `%d`.
          `'a' - 32` — это 97 − 32 = 65, выводится через `%c` как `A`
          (строчные и прописные буквы в ASCII отстоят на 32).
      main:
        title: Расшифруйте номер сообщения
        prompt: |
          Прочитайте номер сообщения (одно слово, не больше 31 символа) и
          просмотрите каждый символ до `'\0'`. Выведите, сколько в нём цифр,
          их сумму и число, образованное цифрами по порядку. Для ввода
          `A7B42`:

          ```
          Digits: 3
          Digit sum: 13
          Number: 742
          ```

          Если цифр нет, число равно 0. В номерах никогда не бывает больше 9
          цифр.
        explanation: |
          Условие цикла `id[i] != '\0'` останавливает его в конце строки. Для
          каждого символа цифры `id[i] - '0'` — её значение, которое
          прибавляется к сумме и дописывается к числу через
          `number * 10 + value`.
        hints:
          - |-
            Посетите каждый символ до '\0' и для каждого решите, цифра ли это.
          - |-
            Для цифры: посчитайте её, прибавьте её значение и допишите её значение к числу.
          - |-
            Проверка цифры: `id[i] >= '0' && id[i] <= '9'`. Значение: `id[i] - '0'`.
          - |-
            `number = number * 10 + (id[i] - '0');`
          - |-
            Полное решение использует один цикл for с условием `id[i] != '\0'`.
        tests:
          zeros: Ведущие нули не меняют число.
          symbols: Символы рядом с цифрами в ASCII ('/' — 47, ':' — 58) — не цифры.

  signal-archive/phone-keypad:
    title: Телефонная клавиатура
    objectives:
      - Отображать одни символы в другие сравнениями их кодов.
      - Изменять строку на месте, символ за символом, и выводить результат.
    world: { label: СТАРЫЙ РАДИОТЕЛЕФОН, goal: Наберите аварийный номер архива }
    briefing: |
      Аварийный контакт архива записан буквами, например `021-CODEGAME`, но
      старый радиотелефон набирает только цифры. Превратите буквы в цифры
      телефонной клавиатуры — практическая задача из лекции.
    lesson: |
      На телефонной клавиатуре каждая цифровая клавиша несёт ещё и буквы:

      | Клавиша | Буквы |
      |---|---|
      | 2 | ABC |
      | 3 | DEF |
      | 4 | GHI |
      | 5 | JKL |
      | 6 | MNO |
      | 7 | PQRS |
      | 8 | TUV |
      | 9 | WXYZ |

      Поэтому `021-CODEGAME` превращается в `021-26334263`: цифры и другие
      символы остаются как есть, буквы становятся цифрой своей клавиши.

      Поскольку коды букв идут подряд, проверка диапазона вроде
      `ch >= 'A' && ch <= 'C'` выбирает целую клавишу. Строчные буквы можно
      сначала перевести в прописные: `ch - 'a' + 'A'`.
    success: |
      Сравнения и арифметика символов превращают один набор символов в
      другой. Изменение `number[i]` в цикле до `'\0'` переписывает строку на
      месте.
    steps:
      main:
        title: Наберите номер
        prompt: |
          Напишите `char keypad_digit(char ch)`: для буквы (прописной **или**
          строчной) она возвращает **символ** цифры её клавиши; любой другой
          символ возвращается без изменений. В `main` прочитайте номер (одно
          слово, не больше 31 символа), замените каждый символ на
          `keypad_digit(...)` и выведите результат. Для ввода `021-CODEGAME`:

          ```
          Dial: 021-26334263
          ```
        explanation: |
          `keypad_digit` сначала переводит строчную букву в прописную, затем
          находит клавишу проверками диапазонов кодов. Обратите внимание: на
          клавишах 7 и 9 по четыре буквы. `main` заменяет каждый символ на
          месте и выводит изменённую строку.
        hints:
          - |-
            Коды букв идут подряд, поэтому каждая клавиша — диапазон букв; сравните символ с первой и последней буквой каждой клавиши.
          - |-
            Сначала переведите строчную букву в прописную, затем используйте цепочку else-if по восьми клавишам. Возвращайте цифру как символ, например '2'.
          - |-
            `if (ch >= 'a' && ch <= 'z') ch = ch - 'a' + 'A';`
          - |-
            В main: `for (i = 0; number[i] != '\0'; i++) number[i] = keypad_digit(number[i]);`
          - |-
            В полном решении цепочка else-if из восьми ветвей; на клавишах PQRS и WXYZ по четыре буквы.
        tests:
          lowercase: Строчные буквы тоже набираются.
          every-key: Тест проверяет каждую букву и несколько других символов.
