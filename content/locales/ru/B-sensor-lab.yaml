chapters:
  sensor-lab:
    title: Лаборатория датчиков
    region: Склон холма — лаборатория датчиков
    intro: >
      Над пляжем стоит лаборатория датчиков острова. Её приборы всё ещё
      записывают энергию, температуру и коды символов, но никто их не читает.
      PIP-7 должен научиться хранить значения в переменных и читать ввод.
    outro: >
      Приборы лаборатории снова передают данные. PIP-7 умеет читать числа и
      символы, хранить их в переменных подходящего типа и выводить в разных
      форматах.

missions:
  sensor-lab/variables:
    title: Подписанные ящики
    objectives:
      - Объявить переменную int и задать ей начальное значение.
      - Вывести значение переменной с помощью printf и %d.
      - Использовать переменную в выражении, например cellA + cellB.
    world: { label: ЭНЕРГОЯЧЕЙКИ }
    briefing: |
      В лаборатории две энергоячейки. PIP-7 должен запомнить их заряд и
      сообщить сумму. Чтобы запомнить значение, программа использует
      **переменную**.
    lesson: |
      ### Переменные
      **Переменная** — это именованный ящик в памяти, в котором хранится
      значение. В C у каждой переменной есть **тип**, **имя** и **значение**, и её
      нужно **объявить** до использования:

      ```c
      int cellA;          /* declaration: a box named cellA that holds an int */
      cellA = 40;         /* assignment: put 40 into the box */
      int cellB = 25;     /* declaration with initialisation */
      ```

      `int` означает *integer* — целое число, например `-3`, `0` или `40`.

      ### Вывод значения
      Чтобы вывести значение, поставьте в строку **спецификатор
      преобразования** и укажите значение после запятой:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int cellA = 40;
          printf("Cell A: %d\n", cellA);
          printf("Double: %d\n", cellA * 2);
          return 0;
      }
      ```

      `%d` означает «выведи здесь `int` в десятичном виде». printf заменяет
      каждый `%d` очередным значением из списка, по порядку.

      > [!note] Переменная, объявленная без значения, содержит мусор, пока вы
      > не присвоите ей что-то. Компилятор предупреждает (*variable is
      > uninitialized*), если вы используете такое значение.
    success: |
      У переменной есть тип (`int`), имя (`cellB`) и значение (`25`). `%d` в
      printf выводит значение int, а выражения вроде `cellA + cellB`
      объединяют переменные.
    steps:
      main:
        title: Отчёт по обеим ячейкам
        prompt: |
          Добавьте вторую переменную `cellB` со значением `25`, выведите её и
          выведите сумму с помощью выражения (а не написав 65 вручную).
          Ожидаемый вывод:

          ```
          Cell A: 40
          Cell B: 25
          Total energy: 65
          ```
        explanation: |
          `int cellB = 25;` объявляет и инициализирует вторую переменную. Сумма
          вычисляется выражением `cellA + cellB`, поэтому при изменении значения
          ячейки сумма изменится автоматически.
        hints:
          - |-
            Новой переменной нужно объявление: тип, имя и (здесь) начальное значение.
          - |-
            Повторите образец для cellA: одна строка объявления, одна строка printf. Затем ещё один printf для суммы.
          - |-
            Синтаксис: `int имя = значение;` и `printf("Подпись: %d\n", выражение);`
          - |-
            `int cellB = 25;` … `printf("Total energy: %d\n", cellA + cellB);`
          - |-
            Полное решение объявляет cellB и выводит три строки.
        tests:
          report: Все три показания.
          expression: Сумма должна вычисляться из переменных.

  sensor-lab/read-input:
    title: Слушай оператора
    objectives:
      - Прочитать целое число из ввода с помощью scanf("%d", &n).
      - Одним предложением объяснить, зачем scanf нужен & перед переменной.
      - Написать программу, складывающую два числа, введённых пользователем.
    world: { label: СЧЁТЧИК ЭНЕРГИИ }
    briefing: |
      Старый счётчик энергии в лаборатории спрашивает у оператора два
      показания и складывает их. Половина его программы пропала. Научите PIP-7
      читать ввод.
    lesson: |
      ### Чтение ввода с помощью scanf
      `scanf` (scan formatted) **читает** значения, введённые пользователем:

      ```c
      int n1;
      scanf("%d", &n1);   /* read one int and store it in n1 */
      ```

      * `"%d"` сообщает scanf, чего ожидать: целое число в десятичной записи.
      * `&n1` — это **адрес** `n1`, место в памяти, где живёт переменная. scanf
        нужно знать, *куда* положить прочитанное значение. `printf` нужно
        только значение, поэтому она получает `n1` без `&`.

      Об адресах вы узнаете гораздо больше позже; пока запомните:
      **scanf нужен `&` перед каждой переменной, в которую читаем.**

      ### add2.c из лекции
      ```c example stdin=3\n4
      /*
       * File: add2.c
       * Add two numbers
       */
      #include <stdio.h>

      int main(void)
      {
          int n1, n2;               /* variable declaration */

          printf("This program adds two numbers\n");
          printf("1st number? ");
          scanf("%d", &n1);
          printf("2nd number? ");
          scanf("%d", &n2);
          printf("The sum is %d.\n", n1 + n2);
          return 0;
      }
      ```

      `int n1, n2;` объявляет две переменные в одной строке.

      ### Ввод в этой игре
      Введите данные для программы в поле **Ввод** *до* нажатия «Запуск»
      (например, `3` и `4` на отдельных строках или `3 4`). Вкладка вывода
      показывает ваш ввод там, где его отобразил бы терминал. В настоящем
      терминале программа останавливается на scanf и ждёт, пока вы введёте
      данные.

      > [!note] scanf пропускает пробелы и переводы строк перед числом, поэтому
      > работают и `3 4`, и `3` ⏎ `4`.
    success: |
      `scanf("%d", &n)` читает int в `n`. `&` даёт scanf адрес переменной, чтобы
      она могла сохранить туда значение. Теперь программа реагирует на ввод —
      один и тот же код работает для любых двух чисел.
    steps:
      main:
        title: Допишите счётчик энергии
        prompt: |
          Программа читает первое число, но не второе. Допишите её, чтобы она
          читала оба и выводила сумму; например, для ввода `3 4`:

          ```
          This program adds two numbers
          1st number? 2nd number? The sum is 7.
          ```

          (Сам ввод не является частью вывода; приглашения и результат
          оказываются на одной строке, потому что в приглашениях нет `\n`.)
        explanation: |
          Второй `scanf("%d", &n2);` сохраняет следующее число в `n2`, а
          последний printf выводит выражение `n1 + n2`. Тесты пробуют несколько
          пар (включая отрицательные числа и ноль), потому что программа должна
          работать для любого ввода, а не только для примера.
        hints:
          - |-
            Второму числу нужен свой scanf, а результат должен использовать обе переменные.
          - |-
            Скопируйте первую строку со scanf и поменяйте переменную, в которую она сохраняет. Затем исправьте последний printf.
          - |-
            `scanf("%d", &переменная);` — не забудьте & перед именем переменной.
          - |-
            Добавьте `scanf("%d", &n2);` и выводите `n1 + n2`.
          - |-
            Полное решение читает оба числа и выводит их сумму.
        tests:
          example: Пример из условия.
          negative: Отрицательные числа.
          large: Большие значения.

  sensor-lab/char-codes:
    title: Коды символов
    objectives:
      - Записывать символьные константы вроде 'A' и хранить их в переменных char.
      - Объяснить, что символы хранятся как числовые коды (ASCII 0–127).
      - Выводить значение как символ с %c и как число с %d.
    world: { label: КОДОВЫЙ ЗАМОК, goal: Расшифруйте символы замка }
    briefing: |
      Кодовый замок на двери лаборатории передаёт числа вместо букв. Каждое
      число — это **код символа**. Расшифруйте коды, чтобы PIP-7 мог прочитать
      сообщения двери.
    lesson: |
      ### Символы
      Символы — это знаки, которые можно набрать или отобразить: буквы, цифры,
      знаки препинания, пробел, клавиша Enter... Из них строится любой текст.

      * **Символьная константа** пишется в **одинарных кавычках**: `'a'`, `'7'`,
        `'?'`. (Двойные кавычки `"a"` создают *строку* — это другое.)
      * Тип **`char`** хранит один символ.

      ### Символы — это числа
      Внутри компьютера каждый символ хранится как число — его **код**.
      Распространённая таблица — **ASCII** (American Standard Code for
      Information Interchange), она определяет коды 0–127. Например, `'A'` —
      это 65, `'a'` — 97, `'0'` — 48, а пробел — 32. Коды 0–31 и 127 —
      невидимые управляющие символы, например перевод строки (10).

      Полная таблица: **Блокнот → ASCII table**.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          char letter = 'A';
          printf("%c has code %d\n", letter, letter);
          printf("Code 98 is %c\n", 98);
          printf("Next letter: %c\n", letter + 1);
          return 0;
      }
      ```

      `%c` выводит значение как символ, `%d` — то же значение как число.
      Поскольку символы — это числа, `letter + 1` — следующий код (`'B'`).

      > [!note] Коды больше 127 — уже не ASCII; их смысл зависит от кодировки,
      > поэтому в игре используются только 0–127.
    success: |
      `char` хранит маленькое целое число — код символа. `'A'` и `65` — одно и то
      же значение; `%c` показывает его как знак, а `%d` — как число.
    steps:
      code-predict:
        title: Число или буква?
        prompt: Что выведет эта программа?
        explanation: |
          `'C'` имеет код 67, поэтому `%d` выводит 67. `'C' + 2` — это 69, и `%c`
          выводит символ с кодом 69, то есть `E`.
      main:
        title: Расшифруйте замок
        prompt: |
          Прочитайте из ввода один целочисленный код и выведите символ, который
          он обозначает, и следующий за ним символ. Для ввода `72` вывод должен
          быть:

          ```
          Symbol: H
          Next: I
          ```
        explanation: |
          `%c` выводит значение int как символ с этим кодом. `code + 1` —
          следующий код в таблице, поэтому выводится следующий символ.
        hints:
          - |-
            Символ выводится по его коду — спецификатор для символов не %d.
          - |-
            Выведите code со спецификатором символа, затем так же code + 1.
          - |-
            `printf("Symbol: %c\n", code);`
          - |-
            Вторая строка: `printf("Next: %c\n", code + 1);`
          - |-
            Полное решение выводит две строки с %c.
        tests:
          lowercase: У строчных букв свои коды.
          digit: У цифры '0' код 48, а не 0.
          z: В ASCII после Z идёт [.

  sensor-lab/type-sizes:
    title: Какого размера ящик?
    objectives:
      - Перечислить основные целые типы C (char, short, int, long, long long) и их беззнаковые варианты.
      - Назвать минимальные диапазоны, гарантированные стандартом, и объяснить, почему реальные размеры различаются.
      - С помощью sizeof узнать размер типа в байтах и вывести его через %zu.
    world: { label: СКЛАД, goal: Измерьте каждый ящик }
    briefing: |
      На складе хранятся ящики разных размеров для разных видов данных.
      Этикетки отвалились. Измерьте каждый тип ящика с помощью `sizeof`.
    lesson: |
      ### Целые типы
      В C есть несколько целых типов. Более крупные типы вмещают большие числа:

      | Тип | Гарантия стандарта C (не менее) | Типично сегодня |
      |---|---|---|
      | `char` | 8 бит | 8 бит |
      | `short` | 16 бит: −32 767 … 32 767 | 16 бит |
      | `int` | 16 бит: −32 767 … 32 767 | 32 бита: около ±2,1 млрд |
      | `long` | 32 бита: −2 147 483 647 … 2 147 483 647 | 32 или 64 бита |
      | `long long` (C99) | 64 бита | 64 бита |

      **Точные размеры зависят от реализации** (компилятора и платформы).
      Стандарт обещает только минимумы и то, что каждый тип не меньше
      предыдущего. Например, `long` занимает 64 бита в gcc на Linux или macOS
      (x86-64), но 32 бита в Windows и в WebAssembly-компиляторе этой игры.

      ### unsigned
      Слово `unsigned` (например, `unsigned int`, `unsigned char`) создаёт тип,
      хранящий только ноль и положительные значения, — положительный диапазон
      примерно вдвое больше. Беззнаковая арифметика **переполняется по кругу**:
      наибольшее значение плюс один даёт 0.

      ### sizeof
      `sizeof(тип)` даёт размер типа **в байтах** (1 байт = `CHAR_BIT` бит,
      практически всегда 8). Результат имеет тип `size_t`; выводите его через
      `%zu`.

      ```c example
      #include <stdio.h>
      #include <limits.h>

      int main(void)
      {
          printf("int uses %zu bytes\n", sizeof(int));
          printf("int range: %d to %d\n", INT_MIN, INT_MAX);
          printf("long long uses %zu bytes\n", sizeof(long long));
          return 0;
      }
      ```

      `<limits.h>` задаёт фактические пределы вашей реализации, например
      `INT_MAX` и `CHAR_BIT`.

      > [!correction] На слайде 15 сказано, что `char` — 8 бит. Стандарт
      > требует *не менее* 8 бит (`CHAR_BIT`); практически во всех современных
      > системах это 8. Минимумы со слайда 18 верны; этот урок добавляет
      > `long long` и `sizeof`, чтобы вы могли проверить свою платформу.
    success: |
      Размеры типов определяются реализацией: стандарт гарантирует минимальные
      диапазоны, а `sizeof` сообщает реальный размер в байтах на конкретной
      машине. В этой игре: `short` 2, `int` 4, `long` 4, `long long` 8 байт.
    steps:
      long-predict:
        title: Какой здесь размер long?
        prompt: |
          Эта игра компилирует в 32-битный WebAssembly. Что выведет программа?
          (Вспомните таблицу из урока, затем запустите и проверьте.)
        answer:
          choices:
            - '2'
            - '4'
            - '8'
            - Он одинаков на всех компьютерах
        explanation: |
          Здесь `long` занимает 4 байта (32 бита). В gcc на 64-битном Linux было
          бы 8. Ни то, ни другое не ошибка: стандарт требует лишь, чтобы `long`
          был не меньше 32 бит. Поэтому переносимый код использует `sizeof`, а не
          предположения о размере.
      wrap-predict:
        title: Переполнение по кругу
        prompt: Что выведет эта программа?
        explanation: |
          8-битный `unsigned char` хранит 0…255. Запись 256 переполняется до 0.
          (Для беззнаковых типов такое переполнение гарантировано. Переполнение
          *знакового* типа, например `int`, — неопределённое поведение;
          никогда на него не полагайтесь.)
      main:
        title: Измерьте ящики
        prompt: |
          Выведите размер в байтах пяти типов с помощью `sizeof` и `%zu` ровно в
          таком формате (числа берутся из `sizeof`, а не вписываются вручную):

          ```
          char: 1
          short: 2
          int: 4
          long: 4
          long long: 8
          ```
        explanation: |
          `sizeof(тип)` вычисляется компилятором для платформы, под которую он
          компилирует. Ожидаемые в тестах числа — размеры в этой игре; в gcc на
          64-битном Linux `long` дал бы 8.
        hints:
          - |-
            Размер типа измеряется с помощью sizeof, а результат выводится через %zu.
          - |-
            Скопируйте строку для char четыре раза и поменяйте подпись и тип.
          - |-
            `printf("int: %zu\n", sizeof(int));`
          - |-
            Последняя строка: `printf("long long: %zu\n", sizeof(long long));`
          - |-
            Полное решение выводит пять результатов sizeof.
        tests:
          sizes: Размеры в компиляторе этой игры (wasm32).

  sensor-lab/floating-point:
    title: Плавающая точка
    objectives:
      - Объяснить, что float и double хранят вещественные числа приближённо, как в научной записи.
      - Прочитать double с помощью scanf("%lf") и вывести его с %f, %e, %g и заглавными %E / %G.
      - Предпочитать double, если память не очень ограничена.
    world: { label: ДИСПЛЕЙ ЭНЕРГИИ }
    briefing: |
      Дисплей энергии в лаборатории умеет показывать показание в трёх стилях,
      но его программа знает только целые числа. У настоящих измерений есть
      дробная часть — используйте типы с плавающей точкой.
    lesson: |
      ### float и double
      Вещественные числа вроде `21.5` или `2.9979e8` хранятся в типах с
      **плавающей точкой**:

      * `float` — одинарная точность (обычно 32 бита, около 7 значащих цифр)
      * `double` — двойная точность (обычно 64 бита, около 15–16 значащих цифр)

      **Используйте `double`**, если только вам действительно не жалко памяти.

      ### Как они хранятся
      Число с плавающей точкой хранится как научная запись: фиксированное
      число **значащих цифр**, умноженное на **основание** в некоторой
      **степени** (`мантисса × основание^порядок`). Основание почти всегда 2.
      Точка «плавает», потому что порядок указывает, где она стоит. Следствие:
      большинство десятичных дробей, например 0,1, **нельзя хранить точно** —
      только очень близкое двоичное приближение.

      `2.9979e8` в коде C означает 2,9979 × 10⁸.

      ### Вывод через printf
      | Спецификатор | Показывает | 1234.5 выводится как |
      |---|---|---|
      | `%f` | с фиксированной точкой, 6 знаков | `1234.500000` |
      | `%e` | научная запись `d.dddddde±xx` | `1.234500e+03` |
      | `%g` | более короткий из стилей %f / %e, без лишних нулей | `1234.5` |
      | `%E`, `%G` | как %e / %g, но с заглавной `E` | `1.234500E+03` |

      Для printf `%f`, `%e` и `%g` подходят и для `float`, и для `double`
      (float при передаче в printf превращается в double). `%.2f` ограничивает
      вывод 2 знаками после точки.

      ### Чтение double
      `scanf` устроена иначе: чтобы прочитать **double**, используйте **`%lf`**
      (буква L); `%f` — для **float**. Это отрабатывается в следующих миссиях.

      ```c example stdin=0.1
      #include <stdio.h>

      int main(void)
      {
          double x;
          scanf("%lf", &x);
          printf("%f | %e | %g | %.2f\n", x, x, x, x);
          return 0;
      }
      ```
    success: |
      Значения с плавающей точкой — приближения, хранящиеся как мантисса ×
      2^порядок. printf показывает их в фиксированной (`%f`), научной (`%e`,
      `%E`) или общей (`%g`, `%G`) записи; scanf читает double через `%lf`.
    steps:
      approx-predict:
        title: Равно ли 0.1 + 0.2 ровно 0.3?
        prompt: |
          `%.17g` выводит 17 значащих цифр — достаточно, чтобы увидеть
          хранимое значение. Что выведет эта программа?
        explanation: |
          Ни 0,1, ни 0,2 нельзя точно хранить в двоичном виде, и их сумма чуть
          больше 0,3. Для арифметики с плавающей точкой это нормально — и именно
          поэтому тесты игры сравнивают вещественные числа с небольшим допуском.
      main:
        title: Три стиля отображения
        prompt: |
          Прочитайте одно показание как `double` и выведите его в четырёх
          стилях. Для ввода `1234.5`:

          ```
          fixed: 1234.500000
          scientific: 1.234500e+03
          general: 1234.5
          SCIENTIFIC: 1.234500E+03
          ```
        explanation: |
          Одно и то же значение double выводится четыре раза с разными
          спецификаторами: `%f`, `%e`, `%g` и `%E`. Значение не меняется — меняется
          только его текстовая форма.
        hints:
          - |-
            Каждый стиль — это другая буква после %.
          - |-
            Добавьте три строки printf, похожие на строку fixed, с другой подписью и спецификатором.
          - |-
            Научная запись — `%e`, общая — `%g`, научная с заглавной E — `%E`.
          - |-
            `printf("scientific: %e\n", reading);`, затем то же с %g и %E.
          - |-
            Полное решение выводит значение с %f, %e, %g и %E.
        tests:
          small: Маленькие значения.
          light: Ввод сам может быть в научной записи.

  sensor-lab/float-scanf:
    title: Дрейф датчика
    objectives:
      - 'Выбирать правильный спецификатор scanf: %f для float, %lf для double.'
      - Знать, что %e и %g в scanf читают так же, как %f.
      - Находить ошибки с помощью предупреждений компилятора о несоответствии формата.
    world: { label: МОНИТОР МОЩНОСТИ }
    briefing: |
      Монитор мощности умножает напряжение на ток, но его показания уплывают
      в бессмыслицу. Спецификаторы scanf не соответствуют типам переменных.
      Исправьте их.
    lesson: |
      ### Форматы scanf строже форматов printf
      printf получает *значения*; `float` по пути автоматически превращается в
      `double`, поэтому `%f` выводит оба. **scanf получает адреса**: она должна
      точно знать размер ящика, в который пишет.

      | Тип переменной | Спецификатор scanf |
      |---|---|
      | `float` | `%f` (или `%e`, `%g` — для scanf то же самое) |
      | `double` | `%lf` (или `%le`, `%lg`) |
      | `int` | `%d` |

      Если читать `double` через `%f` (или `float` через `%lf`), записывается не
      то количество байт, и в переменной оказывается мусор. Компилятор
      предупреждает: *format specifies type 'double \*' but the argument has
      type 'float \*'*. Относитесь к таким предупреждениям как к ошибкам.

      > [!correction] Пример на слайде 21 напечатан как `scanf(“%f”, &value);`
      > с типографскими кавычками. В настоящем коде: `scanf("%f", &value);` — и
      > это верно, только если `value` имеет тип `float`.

      > [!note] В printf `%lf` тоже допустим (начиная с C99) и означает то же,
      > что `%f`. Многие программисты пишут `%f` в printf и `%lf` в scanf.
    success: |
      scanf нужен `%f` для `float` и `%lf` для `double`, потому что она пишет в
      переменную через её адрес. Предупреждения компилятора о формате прямо
      указывают на такие несоответствия.
    steps:
      main:
        title: Почините монитор мощности
        prompt: |
          Запустите программу с заданным вводом и посмотрите вкладку
          **Диагностика**. Исправьте программу так, чтобы для ввода `12.5 2` она
          выводила:

          ```
          Power: 25 W
          ```

          Оставьте `voltage` типа `float`, а `current` — типа `double`.
        explanation: |
          `voltage` имеет тип float, поэтому читается через `%f`; `current` —
          double, поэтому читается через `%lf`. Тогда оба показания сохраняются
          правильно, и произведение верно.
        hints:
          - |-
            Прочитайте два предупреждения на вкладке «Диагностика»: в них сказано, какой тип аргумента не подходит к какому формату.
          - |-
            Подберите каждому спецификатору scanf тип переменной, в которую он читает.
          - |-
            float → `%f`; double → `%lf`.
          - |-
            Поменяйте форматы местами: `scanf("%f", &voltage);` и `scanf("%lf", &current);`
          - |-
            Полное решение меняет только две строки формата.

  sensor-lab/combine-resources:
    title: Объедините баки
    objectives:
      - Написать полную программу, которая читает два значения double и выводит их сумму через %g.
    world: { label: ТОПЛИВНЫЕ БАКИ }
    briefing: |
      Два топливных бака сообщают частичный уровень, например 2.5 и 0.75 литра.
      Напишите программу, которая их складывает, — на этот раз без шаблона.
    lesson: |
      Это упражнение `add2f.c` из лекции: сумматор целых чисел из миссии
      «Слушай оператора», но для чисел с плавающей точкой. Подумайте, какой
      нужен **тип**, какой спецификатор **scanf** и какой спецификатор **printf**.

      > [!correction] В комментарии на слайде 22 написано «floating-poing»;
      > правильно — *floating-point* (с плавающей точкой).
    success: |
      Вы объединили всё из этой главы: переменные `double`, `scanf("%lf")` и
      `printf("%g")`. Тесты сравнивали результат с небольшим допуском, потому
      что результаты с плавающей точкой приближённые.
    steps:
      main:
        title: Напишите add2f
        prompt: |
          Напишите программу, которая читает два числа с плавающей точкой и
          выводит их сумму через `%g` с точкой в конце. Для ввода `2.5 0.75`:

          ```
          The sum is 3.25.
          ```

          Перед чтением можно выводить приглашения, как в лекции.
        explanation: |
          `double d1, d2;` объявляет две переменные с плавающей точкой,
          `scanf("%lf", ...)` читает в них, а `%g` выводит сумму без лишних
          нулей.
        hints:
          - |-
            Это снова сумматор целых чисел, но для вещественных: меняются три вещи.
          - |-
            Поменяйте тип переменных, спецификатор scanf и спецификатор printf.
          - |-
            `double d1;` … `scanf("%lf", &d1);` … `printf("The sum is %g.\n", d1 + d2);`
          - |-
            Объявите `double d1, d2;`, прочитайте оба через %lf и выведите d1 + d2 через %g.
          - |-
            Полное решение — это add2f.c из лекции.

  sensor-lab/lab-report:
    title: 'Итог главы: отчёт лаборатории'
    objectives:
      - Читать в одной программе значения разных типов (int и double).
      - Выводить int как число и как символ, а double — в двух форматах.
    world: { label: ПРИНТЕР ОТЧЁТОВ, goal: Распечатайте полный отчёт станции }
    briefing: |
      Каждая метеостанция присылает три значения: свой номер, код типа датчика
      и температуру. Превратите их в понятный отчёт для принтера лаборатории.
    lesson: |
      Всё нужное было в этой главе: переменные `int` и `double`, `scanf` с `%d`
      и `%lf`, а также printf с `%d`, `%c`, `%g` и `%e`.
    success: |
      Ваша программа прочитала int, код символа и double и вывела каждое с
      нужным спецификатором. Лаборатория датчиков полностью работает.
    steps:
      main:
        title: Распечатайте отчёт станции
        prompt: |
          Ввод: номер станции (int), **код** типа датчика (int, код ASCII) и
          температура (double). Для ввода `7 84 21.5` выведите:

          ```
          Station 7
          Sensor type: T
          Reading: 21.5 (2.150000e+01)
          ```

          Показание выводится дважды: с `%g` и в скобках с `%e`.
        explanation: |
          Каждое значение получает переменную подходящего типа и
          соответствующий спецификатор scanf. Код типа выводится через `%c`,
          чтобы показать символ, а одна и та же температура выводится дважды с
          двумя спецификаторами.
        hints:
          - |-
            Три входных значения → три переменные. Какие из них целые, а какое вещественное?
          - |-
            Сначала прочитайте все три значения, затем выведите три строки.
          - |-
            `scanf("%d", &station);` … `scanf("%lf", &temperature);` … `printf("Reading: %g (%e)\n", temperature, temperature);`
          - |-
            Для кода типа используйте %c: `printf("Sensor type: %c\n", typeCode);`
          - |-
            Полное решение объявляет два int и один double.
        tests:
          freezing: Значения на отдельных строках и отрицательное показание.
