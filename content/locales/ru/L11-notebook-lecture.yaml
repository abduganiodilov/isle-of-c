notebook:
  arrays:
    title: Массивы
    summary: Объявление, индексы с 0, обход всех элементов циклом.
    body: |
      ```c
      #define N 5
      int values[N];               /* N ints, consecutive in memory */
      int counts[3] = {7, 0, 2};   /* initialiser list; missing ones are 0 */

      values[0] = 4;               /* first element  */
      values[N - 1] = 9;           /* last element   */
      values[1]++;                 /* elements work like variables */

      for (i = 0; i < N; i++) {    /* every element: i < N, not i <= N */
          scanf("%d", &values[i]);
      }
      ```

      * Индексы идут **от 0 до N − 1**.
      * `sizeof values` — байты всего массива;
        `sizeof values / sizeof values[0]` — число элементов.
      * Массив нельзя присвоить через `=` — копируйте его поэлементно.
  array-bounds:
    title: Границы массива
    summary: C никогда не проверяет индексы — это делаете вы.
    body: |
      Запись `a[i]` при `i < 0` или `i >= размер` — **неопределённое
      поведение**: она может затереть другие переменные, обрушить программу
      или казаться безвредной. C этого не проверяет. В игре такую программу
      останавливает проверка во время выполнения («не пройдена проверка во
      время выполнения»).

      Задавайте размер массива константой `#define` и проверяйте индексы по
      той же константе: `if (count < MAX_LOG) entries[count++] = value;`.
  array-functions:
    title: Массивы и функции
    summary: Передавайте имя массива и его длину.
    body: |
      ```c
      void ClearIntegerArray(int array[], int n);   /* prototype */

      ClearIntegerArray(values, N_VALUES);          /* call: just the name */

      void ClearIntegerArray(int array[], int n)
      {
          int i;
          for (i = 0; i < n; i++)
              array[i] = 0;
      }
      ```

      * Функция получает **адрес элемента 0**, а не копию, поэтому меняет
        элементы вызывающей стороны.
      * Размер в скобках параметра игнорируется; передавайте длину отдельным
        параметром.
      * `sizeof array` внутри функции — размер адреса, а не массива.
  escape-table:
    title: Все управляющие последовательности
    summary: "\\n \\t \\v \\b \\r \\f \\a \\\\ \\' \\\" \\ooo \\xhh \\0 — полная таблица"
    body: |
      | Последовательность | Значение | Код |
      |---|---|---|
      | `\n` | новая строка | 10 |
      | `\t` | горизонтальная табуляция | 9 |
      | `\v` | вертикальная табуляция | 11 |
      | `\b` | возврат на символ | 8 |
      | `\r` | возврат каретки | 13 |
      | `\f` | перевод страницы | 12 |
      | `\a` | сигнал (звонок) | 7 |
      | `\\` | обратная косая черта | 92 |
      | `\'` | одинарная кавычка | 39 |
      | `\"` | двойная кавычка | 34 |
      | `\0` | нулевой символ (конец строки) | 0 |
      | `\101` | восьмеричный код: `'A'` | 65 |
      | `\x41` | шестнадцатеричный код: `'A'` | 65 |
  c-strings:
    title: Строки C
    summary: Массивы char, заканчивающиеся '\0'; чтение слов и строк.
    body: |
      ```c
      char word[] = "PIP";          /* 'P' 'I' 'P' '\0' : 4 elements */
      char name[20];                /* up to 19 characters + '\0' */

      scanf("%19s", name);          /* one word; no & ; width = size - 1 */
      fgets(name, sizeof name, stdin);   /* a whole line, keeps '\n' */
      printf("%s\n", name);         /* prints up to the '\0' */

      for (i = 0; name[i] != '\0'; i++) { /* visit each character */ }
      ```

      `gets` удалена из C (C11): никогда её не используйте.
  char-arithmetic:
    title: Арифметика символов
    summary: Символы — это целые числа.
    body: |
      | Задача | Код |
      |---|---|
      | ch — цифра? | `ch >= '0' && ch <= '9'` |
      | значение цифры | `ch - '0'` |
      | дописать цифру к числу | `number = number * 10 + (ch - '0')` |
      | ch — прописная буква? | `ch >= 'A' && ch <= 'Z'` |
      | в строчную | `ch + ('a' - 'A')` (то есть + 32) |
      | в прописную | `ch - 'a' + 'A'` |
  string-h:
    title: string.h
    summary: Длина, копирование, склейка, сравнение, поиск.
    body: |
      `#include <string.h>`

      | Вызов | Что делает |
      |---|---|
      | `strlen(s)` | число символов до `'\0'` (`size_t`, выводится через `%zu`) |
      | `strcpy(dst, src)` | копирует src вместе с `'\0'`; dst должен быть достаточно большим |
      | `strncpy(dst, src, n)` | копирует не больше n символов; добавьте `dst[n] = '\0';` сами |
      | `strcat(dst, src)` | дописывает src к строке в dst |
      | `strcmp(a, b)` | 0, если равны, < 0, если a идёт первой, > 0 иначе (важен только знак) |
      | `strchr(s, ch)` | адрес первого ch или `NULL` |
      | `strstr(s, sub)` | адрес первого sub или `NULL` |

      Позиция результата поиска: `(int) (p - s)` (с нуля). Следующее
      совпадение: ищите снова с `p + 1`. Никогда не сравнивайте текст через
      `==`.
  stdlib-conversions:
    title: Текст в числа
    summary: atoi, atol, atof из stdlib.h.
    body: |
      `#include <stdlib.h>` — `atoi("42")` → 42 (`int`), `atol` → `long`,
      `atof("4.5")` → 4.5 (`double`).

      Они останавливаются на первом неподходящем символе (`atoi("12abc")` —
      12) и возвращают 0 для текста без числа (`atoi("abc")`), поэтому не
      могут сообщить об ошибке. Сначала проверьте текст или используйте
      `strtol` / `strtod`.

lectures:
  L11:
    title: Массивы; массивы как аргументы функций; символы и строки в стиле C
    topics:
      L11.outline: План лекции и разделители разделов
      L11.array-concept: Массив — упорядоченный набор значений одного типа
      L11.array-declaration: 'Объявление массивов (char letters[4]; int values[3];) и их размещение в памяти элементами подряд'
      L11.zero-index: Элементы массива в C нумеруются с 0
      L11.element-access: Квадратные скобки выбирают элемент в присваиваниях и выражениях; ++ и += с элементами
      L11.loop-index: 'Целая переменная или выражение в роли индекса; обработка массивов циклами for'
      L11.define-size: Константы #define как размеры массивов; переменные размеры только с C99
      L11.bounds: 'C не проверяет индексы: запись за концом сохраняет значение вне массива'
      L11.no-array-assign: Массив нельзя присвоить целиком (scores = ...; недопустимо)
      L11.array-argument: 'Передача массива в функцию по имени: функция получает адрес элемента 0 и меняет элементы вызывающей стороны (ClearIntegerArray)'
      L11.swap-practice: 'Практика: поменять местами два целых числа, передав массив в качестве аргумента'
      L11.array-parameter: 'Параметры-массивы: int array[] в прототипе, размер в скобках игнорируется, длина передаётся отдельным параметром'
      L11.ascii: Коды ASCII 0–127 (повторение)
      L11.escapes: Специальные символы и управляющие последовательности (\n \t \v \b \r \f \a \\ \' \" \ooo \xhh \0)
      L11.char-arithmetic: "Арифметика символов: 'A' == 65, проверка на цифру, преобразование цифры через ch - '0'"
      L11.phone-practice: 'Практика: превратить буквы телефонного номера в цифры клавиатуры'
      L11.c-strings: "Строки в стиле C: массивы char, заканчивающиеся нулевым символом '\\0'; вывод через %s"
      L11.reading-strings: 'Чтение строк: scanf("%s") останавливается на пробелах; gets небезопасна, fgets сохраняет перевод строки'
      L11.string-h: '<string.h>: копирование, склейка, сравнение, поиск'
      L11.strlen: strlen возвращает длину без завершающего символа
      L11.strcpy: strcpy копирует строку вместе с завершающим символом
      L11.strncpy: strncpy копирует не больше num символов и может оставить результат без завершающего символа
      L11.strcat: strcat дописывает одну строку к другой
      L11.strcmp: 'strcmp сравнивает строки: 0, если равны, иначе отрицательное или положительное число'
      L11.strchr: strchr находит символ; позиция — результат минус массив
      L11.strstr: strstr находит подстроку или возвращает нулевой указатель
      L11.atoi: <stdlib.h> atoi, atof, atol превращают текст в числа
      L11.command-practice: 'Практика: разобрать командную строку ключевое_слово параметр1 параметр2 (add 1 2 -> 3)'
    corrections:
      implicit-int-main: В примерах main() записана без типа результата. «Неявный int» удалён в C99; в C17 пишите int main(void) и return 0.
      value-typo: 'На слайде написано value[1]++ и value[1] += 1, но массив называется values: values[1]++.'
      vla-optional: 'Массивы переменной длины (int scores[n];) появились в C99, но с C11 необязательны (__STDC_NO_VLA__), их нельзя инициализировать, и при большом n они могут переполнить стек. Константа #define — переносимый вариант.'
      out-of-bounds-ub: 'Запись за пределы массива — неопределённое поведение: она может затереть другую переменную, обрушить программу или казаться работающей. Компилятор игры добавляет проверку во время выполнения, которая останавливает такую программу.'
      array-name-address: Строго говоря, имя массива при передаче преобразуется в указатель на первый элемент. Параметр функции — этот указатель, поэтому sizeof внутри функции даёт размер указателя, а не массива (clang предупреждает об этом).
      gets-removed: 'gets не просто небезопасна: её удалили из языка в C11, поэтому компилятор C17 её отвергает. Используйте fgets(buf, sizeof buf, stdin) и указывайте scanf ширину (scanf("%29s", city)).'
      smart-quotes-l11: В scanf(“%s”, city) типографские кавычки; в настоящем коде нужны обычные ".
      size-t-format: strlen возвращает size_t. Начиная с C99 он выводится через %zu; приведение к unsigned с %u на слайде тоже работает.
      strcmp-sign: 'Определён только знак результата strcmp. -1 на слайде возвращают некоторые библиотеки; другие возвращают разность символов (например, -6). Сравнивайте результат с 0, а не с -1 или 1.'
      strchr-format: 'pch - str имеет тип ptrdiff_t, поэтому вывод через %d непереносим. Используйте %td или приведение: (int)(pch - str). В прототипе на слайде также нет имени параметра str.'
      atoi-errors: 'atoi и atof не умеют сообщать об ошибках: atoi("abc") — 0, а atoi("12abc") — 12. strtol и strtod (тоже из <stdlib.h>) сообщают, где закончилось число.'
