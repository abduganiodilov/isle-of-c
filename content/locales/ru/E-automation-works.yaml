chapters:
  automation-works:
    title: Автоматический завод
    region: Долина — автоматический завод
    intro: >
      В долине лежит завод острова. Конвейерам, солнечным полям и
      калибровочным стендам нужно повторять одни и те же действия сотни раз.
      PIP-7 изучает циклы while, for и do-while, break и continue, а также
      вложенные циклы.
    outro: >
      Автоматический завод снова гудит. PIP-7 умеет повторять действия заданное
      число раз, пока выполняется условие или пока не придёт сигнал остановки,
      — и знает, как останавливать вышедшие из-под контроля циклы.

missions:
  automation-works/while-batches:
    title: Партии на ленте
    objectives:
      - Написать цикл while с условием, телом и обновлением.
      - Читать последовательность значений с помощью scanf внутри цикла.
      - Накапливать текущую сумму.
    world: { label: ВЕСЫ КОНВЕЙЕРА }
    briefing: |
      Ящики катятся по конвейеру партиями. Весы должны сложить вес каждого
      ящика в партии — а число ящиков каждый раз разное.
    lesson: |
      ### while
      ```c
      while (condition)
          statement;

      while (condition) {
          statements;
      }
      ```

      Условие проверяется **перед** каждым повторением. Пока оно истинно (не
      ноль), выполняется тело; как только оно ложно, цикл заканчивается, и
      программа продолжается после него. Если условие ложно с самого начала,
      тело не выполняется ни разу.

      Что-то в теле должно со временем сделать условие ложным — обычно
      обновление счётчика. Иначе цикл не закончится никогда:

      ```c
      while (1) {}     /* an infinite loop: 1 is always true */
      ```

      ### Счёт и накопление
      ```c example stdin=3\n5\n7\n9
      #include <stdio.h>

      int main(void)
      {
          int n, value, count = 0, sum = 0;
          scanf("%d", &n);            /* how many values follow */
          while (count < n) {
              scanf("%d", &value);
              sum += value;           /* accumulate */
              count++;                /* update: brings the loop closer to its end */
          }
          printf("sum = %d\n", sum);
          return 0;
      }
      ```

      Переменные `sum` и `count` должны получить 0 **до** цикла.
    success: |
      Цикл while повторяется, пока условие истинно. Счётчик, обновляемый в
      теле, завершает цикл; накопитель (`total += weight`) собирает результат по
      всем итерациям.
    steps:
      main:
        title: Взвесьте партию
        prompt: |
          Первое число ввода — количество ящиков `n`, за ним идут `n` весов
          ящиков. Выведите общий вес. Для ввода `3 10 20 30`:

          ```
          Total weight: 60 kg
          ```
        explanation: |
          Каждая итерация читает один вес, прибавляет его к `total` и
          увеличивает `count`. Когда `count` достигает `n`, условие `count < n`
          становится ложным, и цикл останавливается.
        hints:
          - |-
            Каждое повторение обрабатывает ровно один ящик.
          - |-
            Внутри цикла: прочитать, накопить, сосчитать. Без обновления счётчика цикл никогда не закончится.
          - |-
            `scanf("%d", &weight);` `total += weight;` `count++;`
          - |-
            Эти три инструкции и составляют всё тело цикла.
          - |-
            Полное решение заполняет тело цикла.
        tests:
          empty: Пустая партия.

  automation-works/runaway-loop:
    title: Взбесившийся пресс
    objectives:
      - Распознать бесконечный цикл и объяснить, почему он не заканчивается.
      - Остановить вышедшую из-под контроля программу и добавить пропущенное обновление.
      - Использовать while (1) с намеренным выходом только тогда, когда это задумано.
    world: { label: ПРЕСС С ОТСЧЁТОМ, goal: Отсчитайте и остановитесь }
    briefing: |
      Штамповочный пресс должен отсчитывать оставшиеся ящики и
      останавливаться. Вместо этого он работает бесконечно. В игре
      вышедшие из-под контроля программы автоматически останавливаются через
      несколько секунд — также можно нажать **Стоп**.
    lesson: |
      ### Бесконечные циклы
      Цикл, условие которого никогда не становится ложным, работает
      **вечно**. Частые причины:

      * обновления нет (`count` не меняется);
      * обновление идёт не в ту сторону (`count++` вместо `count--`);
      * условие не может стать ложным (`while (x != 10)`, а `x` перескакивает с
        9 на 11).

      На своём компьютере нажмите **Ctrl+C** в терминале, чтобы остановить
      такую программу. В этой игре у каждого запуска есть лимит времени (3
      секунды) и лимит вывода, а **Стоп** завершает программу сразу — браузер
      никогда не зависает.

      ### Намеренно бесконечные циклы
      `while (1)` (или `for (;;)`) иногда используют специально, например в
      контроллере машины, который должен работать до выключения. Такие циклы
      завершаются инструкцией `break` — скоро вы с ней познакомитесь.
    success: |
      Циклу нужно обновление, приближающее его к концу. Если программа как
      будто зависла, ищите цикл, условие которого не меняется, — а в игре
      используйте «Стоп».
    steps:
      main:
        title: Остановите пресс
        prompt: |
          Запустите программу: она никогда не заканчивается (игра остановит её
          через 3 секунды). Исправьте её так, чтобы для ввода `3` она выводила:

          ```
          Crates left: 3
          Crates left: 2
          Crates left: 1
          Press stopped
          ```
        explanation: |
          `crates--` каждый раз уменьшает число, поэтому `crates > 0` в конце
          концов становится ложным, и цикл заканчивается.
        hints:
          - |-
            Ничто внутри цикла не меняет значение, которое проверяет условие.
          - |-
            Каждый проход цикла обрабатывает один ящик, значит количество должно уменьшаться на один.
          - |-
            Декремент: `crates--;`
          - |-
            Добавьте `crates--;` после printf внутри цикла.
          - |-
            Полное решение добавляет одну инструкцию.
        tests:
          zero: Тело цикла не выполняется ни разу.

  automation-works/digit-sum:
    title: Контрольные суммы цифр
    objectives:
      - Извлекать последнюю цифру целого числа через % 10 и отбрасывать её через / 10.
      - Использовать цикл while, который заканчивается, когда число становится 0.
    world: { label: СКАНЕР КОНТРОЛЬНЫХ СУММ }
    briefing: |
      На каждом ящике есть номер. Сканер проверяет его контрольной суммой —
      суммой цифр. Реализуйте цикл суммы цифр из лекции.
    lesson: |
      ### Разбираем число на части
      Для положительного целого `n`:

      * `n % 10` — его **последняя цифра** (123 % 10 = 3);
      * `n / 10` **отбрасывает** последнюю цифру (123 / 10 = 12, целочисленное
        деление).

      Повторяйте, пока ничего не останется (`n` станет 0):

      | n | n % 10 | dsum | n / 10 |
      |---|---|---|---|
      | 123 | 3 | 3 | 12 |
      | 12 | 2 | 5 | 1 |
      | 1 | 1 | 6 | 0 |

      Программа из лекции (`digitsum.c`):

      ```c
      int n, dsum = 0;
      ...
      while (n > 0)
      {
          dsum += n % 10;
          n /= 10;
      }
      ```

      > [!correction] Пример вывода на слайде 5 заканчивается строкой «Press
      > any key to continue . . .» — её выводит окно консоли Visual Studio, а
      > не программа.
    success: |
      `n % 10` даёт последнюю цифру, а `n /= 10` её отбрасывает. Цикл, пока
      `n > 0`, посещает каждую цифру ровно один раз — он заканчивается, потому
      что `n` каждый раз уменьшается.
    steps:
      main:
        title: Вычислите контрольную сумму
        prompt: |
          Допишите цикл, чтобы программа выводила сумму цифр. Для ввода `123`:

          ```
          This program sums the digits in an integer.
          Enter a positive integer: The sum of the digits is 6
          ```
        explanation: |
          `dsum += n % 10;` прибавляет последнюю цифру; `n /= 10;` её отбрасывает.
          Когда последняя цифра убрана, n становится 0, и цикл заканчивается.
        hints:
          - |-
            Две операции за круг: взять последнюю цифру, затем выбросить её.
          - |-
            Какая операция даёт остаток от деления на 10? Какая отбрасывает последнюю цифру?
          - |-
            `dsum += n % 10;`
          - |-
            После неё добавьте `n /= 10;` — без этого цикл не закончится.
          - |-
            Полное решение — digitsum.c из лекции.
        tests:
          zeros: Нули в середине и в конце.

  automation-works/for-anatomy:
    title: Анатомия цикла for
    objectives:
      - Объяснить, когда выполняются части init, test и step цикла for.
      - Переписывать цикл for с пропущенными частями и узнавать эквивалентные циклы.
      - Написать цикл for с обратным отсчётом.
    world: { label: СТАРТОВЫЕ ЧАСЫ, goal: Обратный отсчёт до старта }
    briefing: |
      Грузовой ракете завода нужен обратный отсчёт перед стартом. Цикл `for` —
      естественный инструмент, когда известно, сколько раз повторять.
    lesson: |
      ### Синтаксис
      ```c
      for (init; test; step) {
          statements;
      }
      ```

      1. **init** выполняется **один раз**, раньше всего остального.
      2. **test** проверяется **перед каждой** итерацией; если он ложен, цикл
         заканчивается.
      3. Выполняется **тело**.
      4. **step** выполняется **после каждой** итерации; затем снова шаг 2.

      Цикл `for` — естественный способ повторить операцию заданное число раз.
      Он в точности эквивалентен:

      ```c
      init;
      while (test) {
          statements;
          step;
      }
      ```

      ### Эквивалентные формы (слайд 8 лекции)
      Все эти циклы выводят `i=0` … `i=n-1`:

      ```c
      for (i = 0; i < n; ++i) printf("i=%d\n", i);

      i = 0;
      for (; i < n; ++i) printf("i=%d\n", i);          /* init omitted */

      for (i = 0; i < n;) { printf("i=%d\n", i); ++i; } /* step moved into the body */

      for (i = 0; i < n;) printf("i=%d\n", i++);        /* step inside the printf */
      ```

      Любую из трёх частей можно пропустить, но точки с запятой остаются. Без
      проверки цикл бесконечен: `for (;;)` означает то же, что `while (1)`.
      `++i` и `i++` в качестве шага эквивалентны, потому что значение шага не
      используется.

      > [!correction] В вариантах со слайда — типографские кавычки (`“i=%d\n”`).
    success: |
      init выполняется один раз, проверка — перед каждой итерацией, шаг —
      после каждой. Части можно пропускать или переносить; `for (;;)` —
      бесконечный цикл, как `while (1)`.
    steps:
      order:
        title: Что когда происходит?
        prompt: 'Расставьте события цикла `for (i = 0; i < 2; i++) printf("%d", i);` в порядке, в котором они происходят.'
        lines:
          - 'init: i = 0'
          - 'проверка: 0 < 2 истинно'
          - 'тело: выводит 0'
          - 'шаг: i становится 1'
          - 'проверка: 1 < 2 истинно'
          - 'тело: выводит 1'
          - 'шаг: i становится 2'
          - 'проверка: 2 < 2 ложно, цикл заканчивается'
        explanation: |
          init выполняется один раз; затем проверка → тело → шаг повторяются,
          пока проверка не провалится. Заметьте: проверка выполняется на один раз
          больше, чем тело.
      equivalent-quiz:
        title: Тот же вывод?
        question: 'Какой цикл НЕ выводит то же, что `for (i = 0; i < 3; i++) printf("%d", i);`?'
        explanation: |
          В третьем цикле i увеличивается *до* вывода, поэтому он выводит 123
          вместо 012. Перенос шага в тело работает, только если шаг остаётся
          после работы.
      main:
        title: Обратный отсчёт
        prompt: |
          Прочитайте начальное число `n` и сделайте обратный отсчёт циклом
          `for`. Для ввода `3`:

          ```
          T-minus 3
          T-minus 2
          T-minus 1
          Launch!
          ```
        explanation: |
          init `t = n` начинает сверху, проверка `t >= 1` останавливает после 1, а
          шаг `t--` считает вниз.
        hints:
          - |-
            Цикл for может считать не только вверх, но и вниз.
          - |-
            init: начать с n. проверка: продолжать, пока t не меньше 1. шаг: уменьшать t.
          - |-
            `for (t = n; t >= 1; t--)`
          - |-
            Тело: `printf("T-minus %d\n", t);`
          - |-
            Полное решение содержит один цикл for с обратным отсчётом.

  automation-works/off-by-one:
    title: Ошибка на единицу
    objectives:
      - Распознавать ошибки на единицу в границах циклов.
      - Выбирать между < и <= и правильное начальное значение для диапазона с включёнными концами.
      - Проверять циклы на наименьших входах (0 и 1).
    world: { label: КАЛИБРОВОЧНАЯ ЛИНЕЙКА, goal: Нанесите отметки от 1 до n }
    briefing: |
      Калибровочный стенд наносит на линейку отметки 1, 2, …, n и сообщает их
      сумму. Текущая программа наносит на одну отметку меньше. Найдите ошибку
      на границе.
    lesson: |
      ### Ошибки на единицу
      Самая частая ошибка в циклах — выполнить его **на один раз больше или
      меньше**:

      | Цикл | Значения i | Количество |
      |---|---|---|
      | `for (i = 0; i < n; i++)` | 0 … n−1 | n |
      | `for (i = 1; i <= n; i++)` | 1 … n | n |
      | `for (i = 1; i < n; i++)` | 1 … n−1 | **n−1** |
      | `for (i = 0; i <= n; i++)` | 0 … n | **n+1** |

      Проверяйте первое и последнее значения вручную и всегда тестируйте
      маленькие входы вроде 0 и 1 — именно там проявляются ошибки на единицу.
    success: |
      Для диапазона 1…n с включёнными концами начинайте с 1 и используйте
      `<=`. Ручная проверка первой и последней итерации (и тесты для n = 0 и n =
      1) ловят ошибки на единицу.
    steps:
      main:
        title: Почините линейку
        prompt: |
          Для ввода `n` программа должна вывести от `mark 1` до `mark n`, а
          затем сумму отметок. Для ввода `4`:

          ```
          mark 1
          mark 2
          mark 3
          mark 4
          sum = 10
          ```
        explanation: |
          `i < n` останавливается до n. Диапазон 1…n включает n, поэтому
          проверка должна быть `i <= n`.
        hints:
          - |-
            Сравните ожидаемый и фактический вывод: какой отметки не хватает?
          - |-
            Проверьте последнее значение i, при котором условие ещё истинно.
          - |-
            Чтобы включить само n, используйте в проверке <=.
          - |-
            `for (i = 1; i <= n; i++)`
          - |-
            Полное решение меняет один символ.

  automation-works/comma-products:
    title: Запятые и произведения
    objectives:
      - Объяснить операцию запятая — вычисление слева направо, результат — последний операнд.
      - Объяснить, чем различаются a = 2, 3 и a = (2, 3).
      - Накапливать произведение в цикле for (факториал).
    world: { label: ФАБРИКАТОР }
    briefing: |
      Фабрикатор может расположить n разных деталей n! (n факториал)
      способами. Вычислите это произведение — и познакомьтесь со странной
      операцией «запятая».
    lesson: |
      ### Операция запятая
      `выр1, выр2` вычисляет `выр1`, затем `выр2`, **слева направо**, а
      значение всего выражения — значение **последнего** операнда.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int a, b;
          a = 2, 3;       /* (a = 2), 3;  assignment binds tighter: a is 2 */
          b = (2, 3);     /* parentheses: the comma expression is 3, so b is 3 */
          printf("%d %d\n", a, b);
          return 0;
      }
      ```

      Компилятор предупреждает, что `3` не используется, — признак того, что
      операция запятая редко бывает нужна. Её основное законное применение —
      заголовки `for`, чтобы инициализировать или обновлять **две**
      переменные.

      ### Накопление произведения
      Чтобы перемножить 1·2·…·n, начинайте произведение с **1** (не с 0!). В
      лекции показаны три эквивалентных цикла:

      ```c
      for (i = 1, prod = 1; i <= n; prod *= i++);           /* empty body */
      for (i = 1, prod = 1; i <= n; prod *= i, i++);        /* empty body */
      for (i = 1, prod = 1; i <= n; i++) prod *= i;         /* clearest */
      ```

      `prod *= i++` определено корректно: `i` изменяется один раз, `prod` —
      один раз.

      > [!correction] У первых двух форм **пустое тело** — `;` сразу после `)`.
      > Они работают, но лишняя точка с запятой после заголовка `for` —
      > классическая ошибка (компилятор предупреждает «for loop has empty
      > body»). Предпочитайте третью форму.
    success: |
      Операция запятая вычисляет слева направо и даёт последний операнд; она
      полезна в основном в заголовках for. Произведения начинаются с 1 и
      накапливаются через `*=`.
    steps:
      comma-predict:
        title: Какое значение сохранится?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          Значение `(5, 6, 7)` — последний операнд, 7. Цикл перемножает
          1·2·3·4 = 24 и останавливается, когда i становится 5.
      main:
        title: Факториалы
        prompt: |
          Прочитайте `n` (0 ≤ n ≤ 12) и выведите `n! = <значение>` с помощью
          цикла `for` с накопителем произведения. Для ввода `5`: `5! = 120`.
          Помните, что 0! = 1.
        explanation: |
          `i = 1, prod = 1` инициализирует обе переменные с помощью операции
          запятая. Произведение начинается с 1, поэтому при n = 0 цикл не
          выполняется и результат равен 1. 12! = 479001600 ещё помещается в
          32-битный int; 13! переполнил бы его.
        hints:
          - |-
            При перемножении нужно начальное значение, которое не меняет произведения.
          - |-
            Начните prod с 1 и умножайте его на каждое i от 1 до n.
          - |-
            `for (i = 1, prod = 1; i <= n; i++) prod *= i;`
          - |-
            Поставьте этот цикл между scanf и printf.
          - |-
            Полное решение использует третью форму из лекции.
        tests:
          zero: Пустое произведение равно 1.
          twelve: Наибольший факториал, помещающийся в 32-битный int.

  automation-works/do-while-retry:
    title: Спрашивай, пока не подойдёт
    objectives:
      - Написать цикл do-while, тело которого выполняется хотя бы один раз.
      - Проверять ввод, повторяя, пока не придёт допустимое значение.
      - Использовать значение, возвращаемое scanf, чтобы безопасно остановиться, когда ввод закончился.
    world: { label: СЕЛЕКТОР КЛАПАНОВ }
    briefing: |
      Селектор клапанов принимает номера от 1 до 9. Операторы ошибаются,
      поэтому селектор должен переспрашивать, пока не получит допустимый номер
      — но должен и остановиться, если оператор ушёл.
    lesson: |
      ### do ... while
      ```c
      do {
          statements;
      } while (condition);     /* note the semicolon */
      ```

      Сначала выполняется тело, затем проверяется условие. Поэтому тело всегда
      выполняется **хотя бы один раз** — идеально для ситуаций «спросить,
      потом проверить».

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int i = 0;
          do {
              printf("i=%d\n", i);
              i++;
          } while (i < 3);
          return 0;
      }
      ```

      > [!correction] Слайд 10 называет do-while «редко используемым, его
      > можно заменить другими циклами». Это так, но когда тело должно
      > выполниться хотя бы раз (например, чтение ввода до допустимого
      > значения), do-while выражает это прямее всего.

      ### Когда ввод заканчивается
      `scanf` **возвращает количество успешно прочитанных значений**. Если ввод
      закончился (конец файла) или содержит не число, она возвращает меньше,
      чем просили, — а переменная сохраняет старое значение. Цикл, который это
      игнорирует, может работать вечно. Проверяйте:

      ```c
      if (scanf("%d", &value) != 1) {
          /* no number could be read: stop */
      }
      ```

      (В настоящем терминале конец ввода обозначают Ctrl+D в Linux/macOS или
      Ctrl+Z и Enter в Windows. В игре ввод заканчивается там, где
      заканчивается поле «Ввод».)
    success: |
      `do { ... } while (условие);` всегда выполняет тело один раз, что
      подходит для проверки ввода. Проверка `scanf(...) == 1` позволяет циклу
      безопасно остановиться, когда ввод закончился.
    steps:
      main:
        title: Проверьте номер клапана
        prompt: |
          Читайте числа, пока не встретится число от 1 до 9 включительно.
          Для каждого недопустимого числа выводите `Rejected: <x>`, для
          допустимого — `Accepted: <x>`, затем остановитесь. Если ввод
          закончился раньше, чем пришло допустимое число, выведите
          `No valid input`. Для ввода `12 0 7 3`:

          ```
          Rejected: 12
          Rejected: 0
          Accepted: 7
          ```
        explanation: |
          Тело сначала читает, а потом проверяет, поэтому подходит do-while.
          `valid` хранит 1 или 0 из сравнения; `while (!valid)` повторяет, только
          пока число было недопустимым. Проверка scanf завершает программу, если
          ввод закончился.
        hints:
          - |-
            Цикл повторяется, пока последнее число было недопустимым.
          - |-
            Вычислите valid по проверке диапазона, затем выведите одно из двух сообщений.
          - |-
            `valid = valve >= 1 && valve <= 9;`
          - |-
            Затем `if (valid) printf("Accepted: %d\n", valve); else printf("Rejected: %d\n", valve);`
          - |-
            Полное решение добавляет проверку и два сообщения.
        tests:
          first: Первое значение уже допустимо.
          runs-out: Ввод заканчивается без допустимого значения — программа должна остановиться, а не крутиться вечно.

  automation-works/break-continue:
    title: break и continue
    objectives:
      - Досрочно завершать цикл с помощью break.
      - Пропускать остаток одной итерации с помощью continue.
      - Переписать скомканный пример while(1) из лекции в читаемом виде.
    world: { label: СОРТИРОВОЧНЫЕ ВОРОТА, goal: Пропустите нужные ящики, остановитесь на маркере конца }
    briefing: |
      На сортировочные ворота приходят коды ящиков. Код 0 — маркер конца
      смены. Код 1 означает «пустой ящик, пропустить». Все остальные коды
      пропускаются дальше и записываются в журнал.
    lesson: |
      ### break
      `break` **завершает** самый внутренний цикл `for`, `while` или `do` (или
      `switch`) немедленно. Выполнение продолжается с инструкции после цикла.
      Так заканчивается намеренный цикл `while (1)`:

      ```c
      while (1) {
          scanf("%d", &n);
          if (n == 0) break;
          printf("n=%d\n", n);
      }
      ```

      ### continue
      `continue` пропускает **остаток текущей итерации** и начинает следующую
      (в цикле `for` шаг всё равно выполняется первым).

      ```c
      while (1) {
          scanf("%d", &n);
          if (n == 0) break;
          else if (n == 1) continue;
          printf("n=%d\n", n);
      }
      ```

      Это примеры из лекции. Вспомните прошлую миссию: если ввод закончится,
      `scanf` не сработает, `n` сохранит старое значение, и цикл никогда не
      закончится. Безопаснее так:

      ```c
      if (scanf("%d", &n) != 1 || n == 0) break;
      ```

      ### Урок стиля
      Слайд 47 лекции показывает тот же цикл, сжатый в несколько строк:

      ```c
      while (1){ scanf("%d", &n);
      if (n==0) break; else if (n==1) continue;
      printf("n=%d\n", n);}
      ```

      Он компилируется и делает то же самое, но прячет структуру.
      Оформляйте циклы по одной инструкции на строку с отступом в теле.
    success: |
      `break` выходит из цикла; `continue` переходит к следующей итерации.
      Вместе с проверкой `scanf` они делают циклы с маркером конца безопасными
      и читаемыми.
    steps:
      main:
        title: Запустите сортировочные ворота
        prompt: |
          Читайте коды ящиков до `0` (или до конца ввода). Код `1` пропускайте с
          помощью `continue`; для остальных кодов выводите `n=<код>`; на `0`
          останавливайтесь с помощью `break`. В конце выведите `passed:
          <количество>` — число выведенных ящиков. Для ввода `5 1 7 0 9`:

          ```
          n=5
          n=7
          passed: 2
          ```
        explanation: |
          `break` обрабатывает и маркер конца, и конец ввода. `continue`
          пропускает printf и счётчик для пустых ящиков. При одной инструкции на
          строку структура видна с первого взгляда.
        hints:
          - |-
            Два особых кода: один завершает цикл, другой пропускает один ящик.
          - |-
            Добавьте проверку на 0 с break и проверку на 1 с continue — обе перед printf.
          - |-
            `if (n == 0) break;` `if (n == 1) continue;`
          - |-
            Объедините с проверкой ввода: `if (scanf("%d", &n) != 1 || n == 0) break;` — и разнесите код по строкам.
          - |-
            Полное решение — читаемая версия цикла из лекции со счётчиком.
        tests:
          no-marker: Ввод заканчивается без 0 — цикл всё равно должен остановиться.

  automation-works/repair-row:
    title: Почините солнечный ряд
    objectives:
      - Управлять роботом циклом, конец которого определяется значением, возвращаемым функцией.
      - Совмещать цикл с условием, чтобы действовать только там, где нужно.
      - Отличать стандартный C от собственных функций игры из island.h.
    world: { label: СОЛНЕЧНЫЙ РЯД }
    briefing: |
      К востоку от завода лежит ряд солнечных панелей. Некоторые повреждены.
      Ряды разной длины, поэтому PIP-7 должен двигаться на восток, пока не
      дойдёт до конца, — по пути ремонтируя только повреждённые панели.
    lesson: |
      ### API острова (только в игре)
      Начиная с этой миссии некоторые задания позволяют вашей программе на C
      управлять PIP-7 напрямую. Игра предоставляет заголовок **`island.h`** с
      несколькими функциями. Они **не входят в стандартный C** — они существуют
      только в этой игре. Всё остальное в вашей программе — обычный C17.

      | Функция | Что делает |
      |---|---|
      | `int robot_move(char direction)` | шаг на одну клетку: `'N'`, `'S'`, `'E'` или `'W'`. Возвращает **1**, если робот сдвинулся, **0**, если мешает край (или стена). |
      | `int robot_scan(void)` | уровень повреждения клетки под роботом (**0** — исправна) |
      | `void robot_repair(void)` | ремонтирует клетку под роботом |
      | `int robot_x(void)`, `int robot_y(void)` | столбец и строка робота |

      Подключайте его как `#include <island.h>`, как стандартный заголовок.
      Во время работы программы каждый вызов записывается, и вид мира
      воспроизводит ровно эти вызовы — анимация является реальной трассой
      вашей программы, а не заранее снятым роликом. (Подробности: **Блокнот →
      Island API**.)

      ### Цикл до наступления события
      Длина ряда неизвестна, но `robot_move` сообщает, когда робот не может
      двигаться дальше. Цикл `while` может использовать это возвращаемое
      значение прямо как условие:

      ```c
      while (robot_move('E')) {
          /* runs after every successful step */
      }
      ```

      До первой клетки (где робот стоит в начале) шаг не ведёт, поэтому
      проверьте её до цикла — или используйте цикл do-while, который выполняет
      тело один раз до проверки.
    success: |
      Цикл закончился, потому что `robot_move` вернула 0 у края, — программа
      работает для рядов любой длины. Сканирование перед ремонтом избавило от
      лишних ремонтов.
    steps:
      main:
        title: Почините весь ряд
        prompt: |
          Отремонтируйте все повреждённые панели ряда, **какой бы длины он ни
          был**. Ремонтируйте только повреждённые клетки (сначала сканируйте).
          Текущая программа проходит фиксированные три шага; тесты используют
          ряды разной длины и с разными повреждениями.
        explanation: |
          do-while сначала проверяет стартовую клетку, затем продолжает
          двигаться на восток, пока `robot_move('E')` возвращает 1. В конце ряда
          она возвращает 0, и цикл останавливается. `robot_scan() > 0` не даёт
          ремонтировать исправные панели.
        hints:
          - |-
            Цикл должен останавливаться, когда робот не может двигаться дальше, а не после фиксированного числа шагов.
          - |-
            robot_move возвращает 1 или 0 — используйте это как условие цикла. Перед ремонтом проверяйте каждую клетку через robot_scan.
          - |-
            `while (robot_move('E')) { ... }` или `do { ... } while (robot_move('E'));`
          - |-
            Внутри цикла: `if (robot_scan() > 0) robot_repair();` — и не забудьте стартовую клетку.
          - |-
            Полное решение использует цикл do-while.
        tests:
          default-row: Ряд, показанный в виде мира.
          start-damaged: Повреждена сама стартовая клетка.
          long: Длинный ряд из 15 панелей.
          single: Ряд всего из одной панели.
          clean: Ремонтировать нечего.

  automation-works/sweep-field:
    title: Обход солнечного поля
    objectives:
      - Использовать вложенные циклы for, чтобы посетить каждую клетку сетки.
      - Подсчитывать события внутри вложенных циклов.
      - Спланировать маршрут (строка за строкой) до написания кода.
    world: { label: СОЛНЕЧНОЕ ПОЛЕ }
    briefing: |
      За заводом лежит целое поле солнечных панелей: несколько рядов,
      несколько столбцов. PIP-7 должен обойти поле ряд за рядом,
      отремонтировать каждую повреждённую панель и сообщить, сколько ремонтов
      сделано.
    lesson: |
      ### Вложенные циклы
      Цикл внутри другого цикла — **вложенный цикл**. Внутренний цикл
      выполняется полностью для **каждой** итерации внешнего:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int row, col;
          for (row = 0; row < 3; row++) {
              for (col = 0; col < 4; col++) {
                  printf("(%d,%d) ", col, row);
              }
              printf("\n");
          }
          return 0;
      }
      ```

      3 строки × 4 столбца = 12 итераций внутреннего цикла. Используйте для
      двух циклов разные переменные!

      ### План обхода
      Распространённый приём — путь «газонокосилки» или **змейкой**: пройти
      первый ряд на восток, шагнуть на юг, пройти следующий ряд на запад и так
      далее. Внутри ряда ширины `w` роботу нужно `w - 1` шагов; между рядами —
      один шаг на юг. Другие пути тоже подходят, если робот не упирается в
      край и все повреждённые панели отремонтированы.
    success: |
      Два вложенных цикла посетили каждую панель ровно один раз: внешний цикл
      выбирал ряд, внутренний шёл вдоль него. Счётчик во внутреннем цикле
      подсчитал ремонты.
    steps:
      main:
        title: Обойдите поле и доложите
        prompt: |
          Ввод задаёт ширину и высоту поля. Обойдите всё поле, начиная с
          левого верхнего угла, отремонтируйте каждую повреждённую панель
          (сначала сканируйте), ни разу не упритесь в край и в конце выведите:

          ```
          Repaired: <число отремонтированных панелей>
          ```
        explanation: |
          Внутренний цикл обрабатывает один ряд: сканировать/ремонтировать,
          затем шагнуть (кроме последнего столбца). После каждого ряда
          направление меняется, и робот шагает на юг (кроме последнего ряда).
          Это путь змейкой — ровно width × height − 1 шагов.
        hints:
          - |-
            Робот должен посетить каждую панель один раз: думайте строками (внешний цикл) и столбцами (внутренний).
          - |-
            Во внутреннем цикле: проверить текущую клетку, затем шагнуть к следующей, если это не последний столбец. После каждого ряда: развернуться и шагнуть на юг, если это не последний ряд.
          - |-
            Смена направления: `direction = (direction == 'E') ? 'W' : 'E';`. Защищайте шаги условием `if (col < width - 1)`.
          - |-
            Тело внутреннего цикла: `if (robot_scan() > 0) { robot_repair(); repaired++; } if (col < width - 1) robot_move(direction);`
          - |-
            Полное решение использует путь змейкой.
        tests:
          tall: Один столбец.

  automation-works/times-table:
    title: Таблица умножения
    objectives:
      - Выводить двумерную таблицу с помощью вложенных циклов.
      - Использовать ширину поля (%4d) для выравнивания столбцов.
    world: { label: КАЛИБРОВОЧНАЯ СЕТКА, goal: Выведите выровненную таблицу умножения }
    briefing: |
      Калибровочному стенду нужна эталонная сетка произведений. Сгенерируйте
      её программой `timestab.c` из лекции, затем сделайте размер таблицы
      настраиваемым.
    lesson: |
      Программа из лекции выводит таблицу умножения 9 × 9:

      ```c example
      /* File: timestab.c
       * Generates a multiplication table
       */
      #include <stdio.h>

      int main(void)
      {
          int i, j;
          for (i = 1; i <= 9; i++)
          {
              for (j = 1; j <= 9; j++) printf("%4d", i * j);
              printf("\n");
          }
          return 0;
      }
      ```

      * **Внутренний** цикл выводит одну строку: произведения `i*1` … `i*9`.
      * После окончания внутреннего цикла `printf("\n")` завершает строку;
        затем внешний цикл переходит к следующему `i`.
      * `%4d` выводит число **с выравниванием вправо в поле шириной 4 символа**
        (дополняя пробелами), поэтому столбцы выстраиваются.
    success: |
      Внешний цикл выбирает строку, внутренний выводит её элементы, а перевод
      строки после внутреннего цикла завершает каждую строку. `%4d` держит
      столбцы выровненными.
    steps:
      main:
        title: Настраиваемая таблица
        prompt: |
          Прочитайте `n` и выведите таблицу умножения `n × n`, каждое число через
          `%4d`, по одной строке таблицы на строку. Для ввода `3`:

          ```
             1   2   3
             2   4   6
             3   6   9
          ```
        explanation: |
          Если заменить оба предела 9 на `n`, размер таблицы будет следовать
          вводу. Расположение задают `%4d` и перевод строки после внутреннего
          цикла.
        hints:
          - |-
            Размер таблицы зафиксирован числом 9 в двух местах.
          - |-
            Оба цикла должны идти до n, а не до 9.
          - |-
            `for (i = 1; i <= n; i++)` и `for (j = 1; j <= n; j++)`
          - |-
            Внутри оставьте `printf("%4d", i * j);`, а после внутреннего цикла — `printf("\n");`
          - |-
            Полное решение дважды заменяет 9 на n.
        tests:
          nine: Полная таблица из лекции.

  automation-works/celsius-table:
    title: Таблица Цельсий–Фаренгейт
    objectives:
      - Написать цикл с шагом, отличным от 1, и отрицательным начальным значением.
      - Совместить цикл с вещественной формулой и форматированным выводом.
    world: { label: ТЕПЛОВОЙ СТЕНД, goal: Выведите справочную таблицу Цельсий–Фаренгейт }
    briefing: |
      На тепловом стенде стоит импортный термометр, показывающий градусы
      Фаренгейта. Выведите справочную таблицу, чтобы инженеры могли сравнивать
      показания.
    lesson: |
      Это упражнение из лекции (слайд 14): вывести таблицу Цельсий–Фаренгейт
      для −20, −10, 0, 10, 20, 30 и 40 °C.

      Формула: F = C × 9 / 5 + 32. Осторожно с целочисленным делением: `9 / 5`
      в целочисленной арифметике равно 1! Используйте `9.0 / 5` или `1.8`.

      `%6.1f` выводит double с выравниванием вправо в поле из 6 символов с одним
      знаком после точки.
    success: |
      Цикл for может шагать на любую величину: здесь `c += 10`. Константа
      double (`9.0`) помогла избежать ловушки целочисленного деления в формуле.
    steps:
      main:
        title: Выведите таблицу
        prompt: |
          Выведите ровно такую таблицу (столбец C через `%4d`, столбец F через
          `%6.1f`):

          ```
             C      F
           -20   -4.0
           -10   14.0
             0   32.0
            10   50.0
            20   68.0
            30   86.0
            40  104.0
          ```

          Строка заголовка: `   C      F`. Для строк таблицы используйте цикл.
        explanation: |
          Цикл начинается с −20 и каждый раз прибавляет 10 до 40.
          `celsius * 9.0` делает всю формулу вещественной.
        hints:
          - |-
            Семь строк с регулярным шагом: нужен цикл, а не семь вызовов printf.
          - |-
            Начните с -20, продолжайте, пока не больше 40, шаг 10. В каждой строке выводите C и результат формулы.
          - |-
            `for (c = -20; c <= 40; c += 10)` и `printf("%4d %6.1f\n", c, c * 9.0 / 5 + 32);`
          - |-
            Выведите заголовок `printf("   C      F\n");` один раз перед циклом.
          - |-
            Полное решение — строка заголовка и один цикл.
        tests:
          values: Все числа по порядку (пробелы не учитываются).

  automation-works/factory-shift:
    title: 'Итог главы: смена на заводе'
    objectives:
      - Обрабатывать поток ввода неизвестной длины с маркером конца.
      - Совместить подсчёт, накопление, поиск максимума, break и continue.
    world: { label: ОТЧЁТ О СМЕНЕ }
    briefing: |
      В конце каждой смены завод печатает отчёт: сколько партий выпущено, их
      общий объём и самая крупная партия. Ошибочные показания датчиков
      (отрицательные размеры) нужно игнорировать.
    lesson: |
      Это задание объединяет главу: цикл по вводу неизвестной длины, маркер
      конца (`0`), `continue` для недопустимых значений, `break` для конца, а
      также подсчёт и накопление. Не забудьте остановиться и тогда, когда ввод
      закончился.

      > [!tip] Поиск максимума: храните наибольшее из уже увиденных значений в
      > переменной. Поскольку все допустимые размеры положительны, её можно
      > начать с 0.
    success: |
      Ваш цикл отчёта читает до маркера конца или до конца ввода, пропускает
      недопустимые значения и ведёт счётчик, сумму и текущий максимум.
      Автоматический завод теперь работает сам — следующая остановка: системы
      ядра острова.
    steps:
      main:
        title: Напишите отчёт о смене
        prompt: |
          Читайте размеры партий (int) до `0` или до конца ввода.
          Отрицательные размеры игнорируйте. Затем для ввода `12 40 -3 7 0 99`
          выведите:

          ```
          Batches: 3
          Total: 59
          Largest: 40
          ```

          Если допустимых партий не было, выведите `Batches: 0`, `Total: 0` и
          `Largest: none`.
        explanation: |
          Цикл заканчивается на маркере 0 или когда scanf больше не может
          прочитать число. Отрицательные размеры пропускаются через continue
          до подсчёта. `largest` обновляется всякий раз, когда появляется партия
          крупнее.
        hints:
          - |-
            Один цикл читает значения; три переменные (количество, сумма, максимум) собирают отчёт.
          - |-
            Внутри цикла while (1): прочитать и выйти по break на 0 или при неудачном чтении; continue на отрицательных; иначе обновить три переменные.
          - |-
            `if (scanf("%d", &size) != 1 || size == 0) break;` и `if (size > largest) largest = size;`
          - |-
            После цикла выведите три строки; с помощью if выведите `Largest: none`, если ни одна партия не учтена.
          - |-
            Полное решение использует while (1), break и continue.
        tests:
          no-sentinel: Ввод заканчивается без 0.
          nothing: Ввода нет вообще.
