chapters:
  text-foundry:
    title: Текстовая мастерская
    region: Южный берег — текстовая мастерская
    intro: >
      В текстовой мастерской сообщения режут, копируют, склеивают, сравнивают
      и ищут в них набором библиотечных функций. PIP-7 изучает <string.h> — и
      учится каждый раз оставлять место для завершающего символа.
    outro: >
      Мастерская работает. PIP-7 измеряет, копирует, склеивает, сравнивает и
      ищет строки с помощью <string.h>, превращает текст в числа и разбирает
      команды.
  archive-core:
    title: Ядро архива
    region: Центральное плато — ядро архива
    intro: >
      Под центральным плато лежит Ядро архива — память острова. Оно
      управляется текстовыми командами, которые сохраняют и анализируют числа
      в его ячейках памяти. Чтобы восстановить его, PIP-7 должен объединить
      всё из последних регионов: массивы, функции для массивов и строки.
    outro: >
      Ядро архива снова помнит. Все регионы пройденных лекций восстановлены —
      и память острова готова ко всему, что будет дальше.

missions:
  text-foundry/length-and-copy:
    title: Измерить и скопировать
    objectives:
      - Подключить <string.h> и читать её прототипы.
      - Измерять строку через strlen и копировать её через strcpy.
      - Копировать не больше n символов через strncpy и самому добавлять завершающий символ.
    world: { label: ПРЕСС ДЛЯ ЭТИКЕТОК, goal: Копируйте слова и печатайте короткие этикетки }
    briefing: |
      Прессу для этикеток в мастерской каждое слово нужно дважды: целиком —
      для архива и обрезанным до пяти букв — для этикетки на ящике.
    lesson: |
      ### Набор инструментов <string.h>
      Строки — это массивы, поэтому `=` не может их копировать, а `==` не
      может сравнить их текст. `#include <string.h>` даёт функции для
      копирования, склеивания, сравнения и поиска.

      Прототипы выглядят непривычно, потому что в них есть *указатели*:
      `char *` и `const char *` означают «адрес символа» — ровно то, что даёт
      имя массива. `const` обещает, что функция не изменит эту строку.
      `size_t` — беззнаковый целый тип для размеров.

      ### strlen — длина
      `size_t strlen(const char *str);` возвращает число символов **до**
      `'\0'`. `size_t` выводится через `%zu`.

      ### strcpy — копирование
      `strcpy(destination, source);` копирует `source` **вместе** с
      завершающим символом в `destination`. Массив назначения должен быть
      достаточно большим — `strcpy` этого не проверяет.

      ```c example
      #include <stdio.h>
      #include <string.h>

      int main(void)
      {
          char str1[] = "Sample string";
          char str2[40];
          char str3[40];

          strcpy(str2, str1);
          strcpy(str3, "copy successful");
          printf("str1: %s\nstr2: %s\nstr3: %s\n", str1, str2, str3);
          printf("length of str1: %zu\n", strlen(str1));
          return 0;
      }
      ```

      ### strncpy — копирование не больше n символов
      `strncpy(destination, source, num);` копирует первые `num` символов.
      Если `source` короче, остаток заполняется `'\0'`. Но если в `source`
      `num` или больше символов, **завершающий символ не добавляется** — его
      нужно добавить самому:

      ```c example
      #include <stdio.h>
      #include <string.h>

      int main(void)
      {
          char str1[] = "To be or not to be";
          char str2[6];

          strncpy(str2, str1, 5);
          str2[5] = '\0';          /* important! */
          puts(str2);              /* puts prints a string and a newline */
          return 0;
      }
      ```

      > [!correction] На слайде 35 `strlen` выводится через `%u` после
      > приведения к `unsigned`. Это работает, но подходящий формат для
      > `size_t` — `%zu` (начиная с C99). Кроме того, на слайде используется
      > `gets`, которой больше не существует.
    success: |
      `strlen` считает символы до `'\0'`, `strcpy` копирует строку целиком с
      завершающим символом, а `strncpy` копирует не больше n символов — и
      завершающий символ добавляете вы, если источник длиннее.
    steps:
      strncpy-predict:
        title: Пять символов
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `strncpy` копирует `L i g h t`, а программа добавляет завершающий
          символ в индекс 5. `strlen` насчитывает 5 символов в `part` и 10 в
          `source`.
      main:
        title: Напечатайте этикетки
        prompt: |
          Прочитайте слово (не больше 29 символов) в `word`. Скопируйте его в
          `archive` через `strcpy` и сделайте так, чтобы `tag` содержал первые
          5 символов через `strncpy` (или всё слово, если оно короче).
          Выведите:

          ```
          Word: Navigator (9 letters)
          Archive: Navigator
          Tag: Navig
          ```
        explanation: |
          `archive` того же размера, что `word`, поэтому `strcpy` всегда
          помещается. В `tag` есть место для 5 символов и завершающего:
          `strncpy` копирует не больше 5, а `tag[TAG_LEN] = '\0';` гарантирует
          завершение строки, даже если слово длиннее. Для более короткого
          слова `strncpy` уже заполнила остаток символами `'\0'`.
        hints:
          - |-
            Всю работу делают три библиотечных вызова: один измеряет, один копирует всё, один копирует не больше 5 символов.
          - |-
            После strncpy запишите завершающий символ в последний элемент tag сами.
          - |-
            `strcpy(archive, word);` и `strncpy(tag, word, TAG_LEN);`
          - |-
            `tag[TAG_LEN] = '\0';`, затем выведите длину через `%zu` и `strlen(word)`.
          - |-
            Полное решение добавляет три строки копирования и три вызова printf.
        tests:
          short: Слово короче этикетки.
          exact: Ровно 5 букв — здесь strncpy не добавляет завершающий символ.

  text-foundry/join-and-compare:
    title: Склеить и сравнить
    objectives:
      - Собрать более длинную строку через strcpy и затем strcat.
      - Сравнивать строки через strcmp и использовать только знак результата.
      - Объяснить, почему == не сравнивает текст двух строк.
    world: { label: СКЛЕЙКА ИМЁН, goal: Склейте и упорядочите имена экипажа }
    briefing: |
      Пары экипажа в архиве хранятся под склеенным именем вроде
      `delta-alpha`, и мастерской нужно знать, какое имя стоит первым по
      алфавиту — и не одинаковые ли это имена.
    lesson: |
      ### strcat — дописать
      `strcat(destination, source);` дописывает `source` в конец
      `destination`: старый завершающий символ затирается первым символом
      `source`, и добавляется новый завершающий символ. В массиве назначения
      уже должна быть строка — обычно начинают с `strcpy`, — и он должен быть
      достаточно большим.

      ```c example
      #include <stdio.h>
      #include <string.h>

      int main(void)
      {
          char str[80];

          strcpy(str, "these ");
          strcat(str, "strings ");
          strcat(str, "are ");
          strcat(str, "concatenated.");
          puts(str);
          return 0;
      }
      ```

      ### strcmp — сравнить
      `strcmp(str1, str2)` сравнивает строки посимвольно, пока два символа не
      различатся или одна строка не кончится. Она возвращает

      * `0`, если строки равны,
      * значение **> 0**, если первый различающийся символ больше в `str1`,
      * значение **< 0** в противном случае.

      Для букв одного регистра это алфавитный порядок:
      `strcmp("alpha", "beta") < 0`.

      ```c example
      #include <stdio.h>
      #include <string.h>

      int main(void)
      {
          char str1[] = "string1";
          char str2[] = "string2";

          printf("%d\n", strcmp(str1, str2));
          return 0;
      }
      ```

      > [!warning] `if (name == "alpha")` сравнивает два **адреса**, а не
      > текст, — это практически всегда ложь. Используйте
      > `strcmp(name, "alpha") == 0`.

      > [!correction] На слайде 42 показан результат `-1`. Стандарт
      > определяет только **знак**; некоторые библиотеки вместо этого
      > возвращают разность двух символов (`strcmp("apple", "apricot")` может
      > дать -6). Всегда сравнивайте результат с 0.

      > [!note] У прописных букв коды меньше, чем у строчных, поэтому
      > `strcmp("Zebra", "apple") < 0`. В этой миссии имена строчными
      > буквами.
    success: |
      `strcat` дописывает к существующей строке, `strcmp` сравнивает две
      строки и сообщает только знаком результата, какая идёт первой; 0
      означает равенство.
    steps:
      sign-predict:
        title: Только знаки
        prompt: Что выведет эта программа?
        explanation: |
          `'l' < 'r'`, поэтому apple идёт первым (отрицательный результат).
          `"pi"` кончается там, где у `"pip"` ещё есть `'p'`, поэтому более
          длинная строка больше (положительный результат). Равные строки дают
          0. Все три сравнения истинны, поэтому программа выводит `1 1 1`.
      equal-quiz:
        title: Сравнение текста
        question: "В `name` текст `alpha`. Какое условие истинно ровно тогда, когда name равно \"alpha\"?"
        explanation: |
          `==` сравнивает адреса. `strcmp` возвращает 0 для равных строк,
          поэтому просто `strcmp(...)` истинно, когда строки *различаются*, а
          сравнение с 1 полагается на значение, которое стандарт не обещает.
      main:
        title: Склейте имена
        prompt: |
          Прочитайте два имени (каждое — одно слово не длиннее 19 строчных
          букв). Соберите `joined` = первое имя + `-` + второе имя через
          `strcpy` и `strcat`. Затем через `strcmp` выведите, какое имя идёт
          первым по алфавиту и одинаковы ли они. Для ввода `delta alpha`:

          ```
          Joined: delta-alpha
          First: alpha
          Same: no
          ```
        explanation: |
          В `joined` есть место для 19 + 1 + 19 символов и завершающего. Она
          начинается через `strcpy` и дважды продлевается через `strcat`.
          Сравнения смотрят только на знак `strcmp` (или на 0) и никогда — на
          конкретное значение.
        hints:
          - |-
            Сначала скопируйте, затем допишите дважды: имя, дефис, второе имя.
          - |-
            Порядок зависит только от знака strcmp(a, b); 0 означает, что имена равны.
          - |-
            `strcpy(joined, a); strcat(joined, "-"); strcat(joined, b);`
          - |-
            `if (strcmp(a, b) <= 0) printf("First: %s\n", a); else printf("First: %s\n", b);`
          - |-
            Полное решение собирает joined и использует два if/else со strcmp.
        tests:
          prefix: Имя, которое является началом другого, идёт первым.
          longest: Два имени по 19 букв заполняют joined целиком.

  text-foundry/search:
    title: Поиск по журналам
    objectives:
      - Найти символ через strchr и каждое следующее вхождение, продолжая поиск со следующей позиции.
      - Найти подстроку через strstr и сравнить результат с NULL.
      - Превратить результат поиска в позицию, вычтя начало массива.
      - Прочитать целую строку через fgets и убрать её перевод строки.
    world: { label: СКАНЕР ЖУРНАЛА, goal: Найдите разделители и ошибки в строке журнала }
    briefing: |
      Строки журнала мастерской длинные, и инженерам нужно знать, где стоят
      разделители и было ли — и где — сообщение ERROR.
    lesson: |
      ### Результаты поиска — это адреса
      `strchr(str, ch)` ищет первый `ch` в `str`. Она возвращает не индекс, а
      **адрес** найденного символа (тип `char *`, *указатель*) или особое
      значение **`NULL`**, если символа нет. Сохраните результат в переменной
      указателя:

      ```c
      char *pch;               /* pch can hold the address of a char */
      pch = strchr(str, 's');
      if (pch != NULL) { ... }
      ```

      Здесь достаточно двух фактов об адресах:

      * `pch - str` — **индекс** найденного символа (`+ 1` — позиция с
        единицы, как считают люди);
      * `pch + 1` — адрес следующего символа, то есть строка, которая
        начинается сразу после найденного, поэтому `strchr(pch + 1, 's')`
        находит **следующее** вхождение.

      ```c example
      #include <stdio.h>
      #include <string.h>

      int main(void)
      {
          char str[] = "This is a sample string";
          char *pch;

          printf("Looking for the 's' character in \"%s\"...\n", str);
          pch = strchr(str, 's');
          while (pch != NULL) {
              printf("found at %d\n", (int) (pch - str + 1));
              pch = strchr(pch + 1, 's');
          }
          return 0;
      }
      ```

      `strstr(str1, str2)` работает так же для целой подстроки: она
      возвращает адрес, где `str2` впервые встречается в `str1`, или `NULL`.

      ### Чтение строки
      `fgets(line, sizeof line, stdin)` читает всю строку вместе с пробелами,
      но сохраняет `'\n'`. `strchr` аккуратно его убирает:

      ```c
      pch = strchr(line, '\n');
      if (pch != NULL) {
          *pch = '\0';         /* * means: the character at that address */
      }
      ```

      > [!correction] На слайде 43 `pch - str + 1` выводится через `%d`, но
      > разность двух адресов имеет тип `ptrdiff_t`; приведите её через
      > `(int)` или выводите через `%td`. В прототипе на слайде также нет
      > имени первого параметра: `char *strchr(const char *str, int character);`.

      > [!note] Указателям будет посвящена отдельная лекция; пока считайте
      > `char *` ответом на вопрос «где в строке».
    success: |
      `strchr` и `strstr` возвращают место, где что-то нашли, или `NULL`.
      Вычитание массива даёт индекс, а новый поиск с `pch + 1` находит
      следующее совпадение.
    steps:
      strstr-predict:
        title: Где это?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          Первое `"ok"` начинается с индекса 11 (`c` — индекс 0). `"fail"`
          не встречается, поэтому `strstr` возвращает `NULL`, и `q == NULL`
          равно 1.
      main:
        title: Просканируйте строку журнала
        prompt: |
          Прочитайте одну строку (не больше 79 символов) через `fgets` и
          уберите её перевод строки. Выведите строку, позиции (с **единицы**)
          всех `:` (или `none`) и позицию первого `ERROR` с единицы (или
          `none`). Для ввода `12:05 pump ERROR: low pressure`:

          ```
          Line: 12:05 pump ERROR: low pressure
          Colons at: 3 17
          ERROR at: 12
          ```
        explanation: |
          `strchr(line, '\n')` находит перевод строки, который сохранила
          `fgets`, а `*pch = '\0';` завершает строку в этом месте. Цикл по
          двоеточиям — образец из лекции: найти, вывести, искать снова с
          `pch + 1`. `strstr` отвечает на вопрос об ERROR, а `NULL` означает,
          что ничего не найдено.
        hints:
          - |-
            Сначала уберите перевод строки, затем ищите двоеточия в цикле, затем один раз ищите ERROR.
          - |-
            Каждый поиск возвращает NULL, когда ничего (больше) не найдено; это завершает цикл или выбирает вывод `none`.
          - |-
            Позиция: `(int) (pch - line + 1)`. Следующее двоеточие: `pch = strchr(pch + 1, ':');`
          - |-
            `pch = strstr(line, "ERROR"); if (pch != NULL) ... else printf("ERROR at: none\n");`
          - |-
            Полное решение использует strchr три раза и strstr один раз.
        tests:
          start: Совпадения в самом начале и вплотную друг к другу.
          lowercase: strstr различает регистр, а ERRORS содержит ERROR.

  text-foundry/numbers-from-text:
    title: Числа из текста
    objectives:
      - Превращать строки в числа через atoi, atol и atof из <stdlib.h>.
      - По первому символу слова решать, число ли это, прежде чем его преобразовывать.
      - Знать, что atoi и atof не умеют сообщать о неверном вводе.
    world: { label: ГРУЗОВЫЕ ВЕСЫ }
    briefing: |
      Грузовая накладная приходит обычными словами: веса вперемешку с
      названиями ящиков. Весы должны сложить только слова-числа — до слова
      `end`.
    lesson: |
      ### Текст — не число
      Строка `"42"` — это три символа `'4'`, `'2'`, `'\0'`, а не целое число
      42. `<stdlib.h>` превращает текст в числа:

      | Функция | Превращает в |
      |---|---|
      | `int atoi(const char *str)` | `int` |
      | `long atol(const char *str)` | `long` |
      | `double atof(const char *str)` | `double` |

      ```c example
      #include <stdio.h>
      #include <stdlib.h>

      int main(void)
      {
          printf("%d\n", atoi("4") + atoi("5"));
          printf("%g\n", atof("4.5") + atof("5.6"));
          return 0;
      }
      ```

      ### Они не умеют жаловаться
      `atoi` читает цифры, пока может: `atoi("12abc")` — 12, а `atoi("abc")`
      — просто **0**, ровно как `atoi("0")`. Поэтому проверяйте текст сами,
      прежде чем преобразовывать, например по первому символу (цифра или
      знак `-`).

      > [!correction] В лекции об этом не сказано: у `atoi` и `atof` нет
      > способа сообщить о неверном вводе. `strtol` и `strtod` (тоже из
      > `<stdlib.h>`) сообщают, где закончилось число, — так настоящие
      > программы проверяют числа.
    success: |
      `atoi`, `atol` и `atof` превращают текст в числа, но не умеют
      обнаруживать неверный текст. Сначала проверьте символы (здесь — первый
      символ) и преобразуйте только то, что действительно является числом.
    steps:
      atoi-predict:
        title: Преобразование текста
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `atoi("4") + atoi("5")` — это 9 (а не `"45"`). `atoi` останавливается
          на первом нецифровом символе, поэтому `"12abc"` даёт 12, а `"abc"` —
          0. 4.5 + 5.6 = 10.1, и `%g` выводит это без лишних нулей.
      main:
        title: Взвесьте накладную
        prompt: |
          Читайте слова (каждое не длиннее 19 символов) до слова `end`. Слово
          является **числом**, если его первый символ — цифра или `-`;
          преобразуйте такие слова через `atof` и сложите. Остальные слова
          пропускаются. Выведите:

          ```
          Numbers: 3
          Total: 16.50
          Ignored: 1
          ```

          для ввода `12 7.5 crate -3 end`.
        explanation: |
          Цикл останавливается, когда `strcmp` сообщает, что слово равно
          `"end"`. Первый символ решает, число ли это — цифра или минус, — и
          только такие слова преобразуются через `atof`, которая понимает и
          `12`, и `7.5`.
        hints:
          - |-
            Цикл уже есть; внутри него смотрите только на word[0], чтобы решить, число ли это.
          - |-
            Число начинается с цифры (от '0' до '9') или с '-'. Преобразуйте такие слова через atof и посчитайте их; остальные считайте пропущенными.
          - |-
            `if ((word[0] >= '0' && word[0] <= '9') || word[0] == '-')`
          - |-
            `total += atof(word); numbers++;` — затем после цикла выведите три строки, сумму через `%.2f`.
          - |-
            Полное решение добавляет один if/else внутри цикла и три вызова printf.
        tests:
          lines: Слова на отдельных строках, значение с нулём перед точкой и 2e1 (научная запись, 20).
          after-end: Слова после end не читаются.

  text-foundry/command-console:
    title: 'Испытание главы: командная консоль'
    objectives:
      - Разбирать команды вида ключевое_слово параметр1 параметр2.
      - Выбирать действие сравнением ключевого слова через strcmp и преобразовывать параметры через atoi.
    world: { label: КОНСОЛЬ МАСТЕРСКОЙ, goal: Запустите командную консоль }
    briefing: |
      Мастерской управляют с консоли, которая понимает короткие команды вроде
      `add 1 2`. Напишите интерпретатор команд — последнюю практическую
      задачу лекции, дополненную несколькими командами.
    lesson: |
      Строка команды имеет вид `ключевое_слово параметр1 параметр2 …`.
      Простой интерпретатор читает ключевое слово как слово, сравнивает его с
      каждой известной командой через `strcmp`, а затем читает и
      преобразует параметры найденной команды.

      Если читать каждый параметр как слово и преобразовывать через `atoi`,
      обработка ввода одинакова для всех команд.
    success: |
      Вы написали интерпретатор: прочитать ключевое слово, выбрать команду
      через `strcmp`, преобразовать её параметры через `atoi` и ответить —
      та же идея, что у любой программы командной строки.
    steps:
      main:
        title: Интерпретируйте команды
        prompt: |
          Читайте команды до `quit` (или до конца ввода). После каждой
          команды, кроме `quit`, идут два целых параметра.

          | Команда | Вывод |
          |---|---|
          | `add a b` | a + b |
          | `sub a b` | a − b |
          | `mul a b` | a × b |
          | `div a b` | a / b (целочисленное деление) или `error: division by zero` |
          | `quit` | `bye`, и программа завершается |
          | что угодно другое | `unknown command: <keyword>` (два его параметра пропускаются) |

          Пример ввода и вывода:

          ```
          add 1 2          3
          mul 6 7          42
          sub 3 10         -7
          div 7 0          error: division by zero
          jump 1 2         unknown command: jump
          quit             bye
          ```

          (Слева ввод, справа строки, которые выводит программа.)
        explanation: |
          Цикл читает по одному ключевому слову за итерацию и останавливается
          в конце ввода. `quit` обрабатывается первой, потому что у неё нет
          параметров. Для любого другого ключевого слова два параметра
          читаются как слова и преобразуются через `atoi`; цепочка else-if из
          вызовов `strcmp` выбирает команду.
        hints:
          - |-
            Обработайте quit до чтения параметров — у неё их нет. Любая другая команда читает два слова.
          - |-
            Сравнивайте ключевое слово с каждой командой через strcmp(...) == 0 в цепочке else-if; последний else — неизвестная команда.
          - |-
            `scanf("%15s %15s", p1, p2); a = atoi(p1); b = atoi(p2);`
          - |-
            Для div проверьте b == 0 перед делением; для quit выведите bye и выйдите из цикла через `break;`.
          - |-
            В полном решении один цикл while с цепочкой else-if из пяти проверок strcmp.
        tests:
          lecture: Пример из лекции без quit — ввод просто заканчивается.
          negative: Целочисленное деление отбрасывает дробную часть в сторону нуля.
          after-quit: Команды после quit не выполняются.
          case: Ключевые слова различают регистр.

  text-foundry/palindrome:
    title: Зеркальные ворота
    objectives:
      - Сравнивать символы с обоих концов строки, используя strlen для последнего индекса.
      - Не различать прописные и строчные буквы с помощью арифметики символов.
    world: { label: ЗЕРКАЛЬНЫЕ ВОРОТА }
    briefing: |
      Необязательная головоломка: старые зеркальные ворота открываются только
      для паролей, которые одинаково читаются слева направо и справа налево, —
      и регистр букв им безразличен.
    lesson: |
      **Палиндром** одинаково читается в обе стороны: `level`, `Racecar`,
      `noon`. Сравните первый символ с последним, второй — с предпоследним и
      так далее до середины — как инструмент `reverse` на ретрансляционной
      станции, только сравнивая, а не меняя местами. `strlen` подсказывает,
      где последний символ: в индексе `strlen(word) - 1`.

      Чтобы не различать регистр, сравнивайте строчные варианты: если символ
      между `'A'` и `'Z'`, прибавление `'a' - 'A'` (32) даёт его строчную
      букву.
    success: |
      Два индекса, движущиеся навстречу друг другу, проверяют строку сразу с
      обоих концов; арифметика символов делает сравнение нечувствительным к
      регистру.
    steps:
      main:
        title: Откройте зеркальные ворота
        prompt: |
          Напишите `int is_palindrome(char word[])`, которая возвращает 1,
          если слово одинаково читается в обе стороны без учёта регистра, и 0
          иначе. `main` читает слова (не длиннее 39 символов) до конца ввода и
          для каждого выводит:

          ```
          Racecar is a palindrome
          Gate is not a palindrome
          ```
        explanation: |
          `left` начинается с первого символа, а `right` — с последнего
          (`strlen - 1`). Они движутся навстречу друг другу; первое
          несовпадение возвращает 0. Если они встретились без несовпадений,
          слово — палиндром. Вспомогательная `lower` делает сравнение
          нечувствительным к регистру.
        hints:
          - |-
            Сравнивайте пары снаружи внутрь: первый с последним, второй с предпоследним, и остановитесь на середине.
          - |-
            Используйте два индекса, left = 0 и right = strlen(word) - 1, и двигайте их навстречу, пока left < right.
          - |-
            Не учитывайте регистр, переводя оба символа в строчные перед сравнением: `if (ch >= 'A' && ch <= 'Z') ch = ch + ('a' - 'A');`
          - |-
            `if (lower(word[left]) != lower(word[right])) return 0;` — после цикла `return 1;`
          - |-
            Полное решение добавляет небольшую вспомогательную функцию `lower` и цикл while в is_palindrome.
        tests:
          direct: Короткие слова, смешанный регистр, чётная и нечётная длина, цифры.

  archive-core/restore-archive:
    title: Восстановите ядро архива
    objectives:
      - Спроектировать полную программу, объединяющую массивы, функции с параметрами-массивами, строки и разбор команд.
      - Защищать каждое обращение к массиву проверкой границ и сообщать о неверном вводе вместо аварийного завершения.
    world:
      checkpoints:
        - Сохранить и показать значения
        - Прибавлять к ячейкам и отклонять неверные ячейки
        - Проанализировать память
        - Завершить набор команд
    briefing: |
      Ядро архива хранит десять пронумерованных ячеек памяти и управляется
      текстовыми командами. Напишите его контроллер: сохраняйте значения,
      меняйте их, анализируйте память и отклоняйте каждую команду, которая
      затронула бы несуществующую ячейку.
    lesson: |
      Это **финальное задание** по массивам и строкам. В нём используется
      только то, что было в лекциях; структуру выбираете вы. Тесты
      сгруппированы в четыре **контрольные точки**.

      Предлагаемая структура:

      * `int slot[MAX_SLOTS]` в `main`, в начале все нули (`= {0}` или
        функция очистки).
      * Один цикл, который читает **ключевое слово** через
        `scanf("%15s", keyword)`, и цепочка else-if из проверок `strcmp`,
        выбирающая команду.
      * Небольшие функции, которые получают массив и его длину: вывод,
        сумма, поиск максимума, очистка.
      * Функция `int valid_slot(int i)`, отвечающая, верно ли
        `0 <= i < MAX_SLOTS`, — **каждая** команда с номером ячейки должна
        проверить его, прежде чем трогать массив.
    success: |
      Вы объединили всю лекцию: массив с размером из константы, защищённый
      проверками границ, функции, получающие массив и его длину, и цикл
      команд на строках. Ядро архива в сети.
    steps:
      main:
        title: Напишите контроллер ядра архива
        prompt: |
          У ядра `MAX_SLOTS` (10) целых ячеек с номерами 0–9, в начале все
          равны 0. Читайте команды до `quit` или до конца ввода:

          | Команда | Действие и вывод |
          |---|---|
          | `set i v` | slot i = v; выводит `slot <i> = <v>` |
          | `add i v` | slot i += v; выводит `slot <i> = <new value>` |
          | `show` | выводит `slots:` и десять значений, каждое после пробела |
          | `sum` | выводит `sum: <total of all slots>` |
          | `max` | выводит `max: <largest value> at slot <its number>` (наименьший номер ячейки, если значений несколько) |
          | `clear` | обнуляет все ячейки; выводит `cleared` |
          | `quit` | выводит `archive closed` и завершает работу |

          * Если номер ячейки у `set` или `add` вне 0–9, выведите
            `error: no slot <i>` и ничего не меняйте.
          * Любое другое ключевое слово выводит `unknown command: <keyword>`
            (параметров у него нет).

          Пример:

          ```
          set 2 40        slot 2 = 40
          add 2 5         slot 2 = 45
          set 10 1        error: no slot 10
          set 7 -3        slot 7 = -3
          show            slots: 0 0 45 0 0 0 0 -3 0 0
          sum             sum: 42
          max             max: 45 at slot 2
          quit            archive closed
          ```

          (Слева ввод, справа вывод.)
        explanation: |
          `main` — цикл команд; каждая задача над массивом — функция, которая
          получает массив и его длину. `set` и `add` используют общую проверку
          границ `valid_slot`, поэтому ни одна команда не может записать за
          пределы массива, а неверный номер ячейки даёт сообщение об ошибке
          вместо неопределённого поведения.
        hints:
          - |-
            Стройте по контрольным точкам: сначала цикл с set, show и quit; затем add и проверка ячейки; затем sum и max; затем clear и неизвестные команды.
          - |-
            Читайте ключевое слово через scanf("%15s", keyword) в цикле while и выбирайте через strcmp(keyword, "...") == 0. Только set и add читают после этого два числа.
          - |-
            Проверьте ячейку, прежде чем её использовать: `if (i < 0 || i >= MAX_SLOTS) printf("error: no slot %d\n", i);`
          - |-
            max: запоминайте индекс наибольшего значения, начиная с 0 и заменяя его только на строго большее значение; выведите `slot[best]` и `best`.
          - |-
            В полном решении цикл команд в main и пять небольших функций; другие варианты тоже проходят тесты.
        tests:
          cp1-set-show: Первая и последняя ячейки.
          cp1-start: Все ячейки в начале равны 0; ввод может закончиться без quit.
          cp2-bounds: Ячеек 10, -1 и 99 не существует — программа не должна аварийно завершаться.
          cp3-max-ties: При равенстве побеждает наименьший номер; при отрицательных значениях наибольшим может быть нетронутый 0.
          cp4-clear-unknown: clear, неизвестная команда и команды после quit.
