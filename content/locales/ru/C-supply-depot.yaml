chapters:
  supply-depot:
    title: Склад снабжения
    region: Гавань — склад снабжения
    intro: >
      На складе в гавани всё ещё лежат ящики, батареи и запчасти, но
      распределяющий компьютер разучился считать. PIP-7 должен освоить
      выражения, операции и преобразования типов, чтобы честно делить припасы.
    outro: >
      Снабжение снова идёт. PIP-7 умеет строить выражения, управлять порядком
      вычислений скобками, изменять переменные с помощью ++ и += и
      осознанно преобразовывать типы.

missions:
  supply-depot/expressions:
    title: Строим выражения
    objectives:
      - Различать четыре вида термов в выражении — константы, переменные, вызовы функций и выражения в скобках.
      - Применять правила именования C и помнить, что имена чувствительны к регистру.
      - Вычислить результат по вводу, используя константу в научной записи.
    world: { label: ТАЙМЕР СИГНАЛА }
    briefing: |
      Склад общается с дронами снабжения по радио. Радиосигнал идёт со
      скоростью света, и PIP-7 должен вычислить, сколько времени сигнал летит
      до дрона.
    lesson: |
      ### Выражения
      **Выражение** описывает вычисление, например `n1 + n2`. Оно состоит из
      **термов**, соединённых **операциями**. Терм — это одно из:

      | Терм | Пример |
      |---|---|
      | **константа** — явное значение | `42`, `-7`, `2.5`, `2.9979e8`, `'A'` |
      | **переменная** | `distance` |
      | **вызов функции**, возвращающей значение | `sqrt(2.0)` (функции — в главе F) |
      | **выражение в скобках** | `(a + b)` |

      `2.9979e8` — константа типа `double`, означающая 2,9979 × 10⁸.

      ### Имена переменных
      * Имя начинается с **буквы или подчёркивания** `_`.
      * Дальше могут быть буквы, цифры и подчёркивания — **никаких пробелов** и
        других символов.
      * C **различает регистр**: `energy`, `Energy` и `ENERGY` — три разных
        имени.
      * Имя не может быть **ключевым словом**, например `int`, `return`, `if`,
        `while`.
      * Каждую переменную нужно **объявить** до использования.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int energy = 10;
          int Energy = 99;     /* a different variable! */
          double speed_of_light = 2.9979e8;

          printf("%d %d\n", energy, Energy);
          printf("%g\n", speed_of_light);
          return 0;
      }
      ```
    success: |
      Выражения соединяют константы, переменные, вызовы функций и
      подвыражения в скобках с помощью операций. Имена подчиняются строгим
      правилам и различают регистр.
    steps:
      names:
        title: Допустимые имена
        question: Какие из этих имён переменных допустимы в C? (Выберите все подходящие.)
        explanation: |
          `fuel_level`, `_count` и `Drone7` соответствуют правилам. `2nd_drone`
          начинается с цифры, в `drone speed` есть пробел, а `return` — ключевое
          слово.
      main:
        title: Задержка сигнала
        prompt: |
          Прочитайте расстояние в метрах (`double`) и выведите, сколько секунд
          радиосигнал его проходит, через `%e`. Скорость света — `2.9979e8` м/с,
          время = расстояние / скорость. Для ввода `1000`:

          ```
          Delay: 3.335668e-06 s
          ```
        explanation: |
          `distance / c` — выражение из двух термов-переменных. Если сохранить его
          в переменной с понятным именем (`delay`), printf читается легко.
        hints:
          - |-
            время = расстояние / скорость. Оба значения уже лежат в переменных.
          - |-
            Вычислите выражение, сохраните его в новой переменной double, затем выведите.
          - |-
            Деление — это `/`. Double в научной записи выводится через `%e`.
          - |-
            `double delay = distance / c;`, затем `printf("Delay: %e s\n", delay);`
          - |-
            Полное решение добавляет переменную для задержки.
        tests:
          moon: Расстояние до Луны.

  supply-depot/assignment-value:
    title: У присваивания есть значение
    objectives:
      - Объяснить, что присваивание вычисляет правую часть, сохраняет её и само имеет сохранённое значение.
      - Читать цепочку присваиваний a = b = 1 справа налево.
      - Сбрасывать несколько переменных к одному значению цепочкой присваиваний.
    world: { label: СЧЁТЧИКИ ЯЩИКОВ }
    briefing: |
      В начале каждой смены три счётчика причалов нужно сбросить к одному и
      тому же начальному числу. В C это делается одной строкой.
    lesson: |
      ### Присваивание
      `переменная = выражение;` вычисляет выражение и **сохраняет** результат в
      переменной. `=` не означает «равно» — оно означает «становится».

      ```c
      total = total + 5;   /* take total, add 5, store the result back in total */
      ```

      ### Присваивание само является выражением
      У выражения присваивания есть **значение** — то, которое было сохранено.
      Поэтому его можно использовать внутри большего выражения:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int x;
          printf("%d\n", x = 5);   /* stores 5 in x, and the expression's value is 5 */
          printf("%d\n", x);
          return 0;
      }
      ```

      ### Цепочка присваиваний
      Присваивание группируется **справа налево**, поэтому

      ```c
      a = b = 1;      /* means: a = (b = 1); */
      ```

      сначала сохраняет 1 в `b`; значение этого присваивания (1) затем
      сохраняется в `a`.

      > [!correction] На слайде 27 сказано, что значение возвращает
      > *инструкция*. Точнее, значение есть у **выражения** присваивания;
      > инструкция просто вычисляет его.

      > [!note] Использовать значения присваиваний внутри больших выражений —
      > значит усложнять чтение кода. Цепочка сброса вроде `a = b = c = 0;` —
      > распространённый и понятный случай.
    success: |
      `=` сохраняет значение, и выражение присваивания имеет это значение.
      `a = b = c = n;` работает справа налево: сначала `c = n`, затем `b`, затем
      `a`.
    steps:
      chain-predict:
        title: Справа налево
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `c = 7` сохраняет 7 в c; его значение 7 сохраняется в b, затем в a.
          Потом только b меняется на 8.
      main:
        title: Сбросьте причалы
        prompt: |
          Прочитайте начальное число `n`, установите все три счётчика в `n`
          **одной цепочкой присваиваний**, затем прибавьте 2 только к причалу B.
          Для ввода `10`:

          ```
          A=10 B=12 C=10
          ```
        explanation: |
          `dockA = dockB = dockC = n;` вычисляется как
          `dockA = (dockB = (dockC = n));`, поэтому все три получают n.
        hints:
          - |-
            У присваивания есть значение, поэтому его результат можно присвоить снова.
          - |-
            Напишите одну инструкцию с тремя знаками =, от самого левого счётчика до n.
          - |-
            Образец: `a = b = значение;`
          - |-
            `dockA = dockB = dockC = n;`
          - |-
            Полное решение добавляет эту одну строку.

  supply-depot/integer-division:
    title: Честные доли
    objectives:
      - Использовать арифметические операции + - * / % и унарный минус.
      - Предсказывать целочисленное деление (дробная часть отбрасывается) и операцию остатка %.
      - Делить количество на равные доли и остаток.
    world: { label: РАСПРЕДЕЛИТЕЛЬ ЯЩИКОВ }
    briefing: |
      Роботы выстраиваются на складе за ящиками. Каждый робот должен получить
      одинаковое целое число ящиков; всё, что поделить нельзя, остаётся на
      складе.
    lesson: |
      ### Арифметические операции
      | Операция | Смысл | Пример | Значение |
      |---|---|---|---|
      | `+` `-` `*` | сложение, вычитание, умножение | `7 * 3` | `21` |
      | `/` | деление | `7.0 / 2` | `3.5` |
      | `/` для двух целых | **целочисленное деление**: дробная часть отбрасывается | `7 / 2` | `3` |
      | `%` | **остаток** (только для целых) | `7 % 2` | `1` |
      | унарный `-` | смена знака | `-x` | |

      Если оба операнда `/` целые, результат целый: C отбрасывает дробную
      часть (усекает к нулю). `%` даёт то, что осталось, поэтому для
      положительных чисел `a == (a / b) * b + a % b`.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          printf("%d %d\n", 17 / 5, 17 % 5);
          printf("%d %d\n", -17 / 5, -17 % 5);
          printf("%g\n", 17.0 / 5);
          return 0;
      }
      ```

      Начиная с C99, `-17 / 5` равно `-3` (усечение к нулю), а `-17 % 5` равно
      `-2`.

      > [!warning] Целочисленное деление на ноль — **неопределённое
      > поведение**. В этой игре программа останавливается с ошибкой
      > выполнения; на настоящем компьютере она часто аварийно завершается.

      > [!correction] На слайде 28 после «Negation:» пропал символ; это унарный
      > минус `-x`.
    success: |
      Для целых `/` отбрасывает дробную часть, а `%` даёт остаток. Вместе они
      делят любое количество на равные доли и остаток.
    steps:
      div-predict:
        title: Только целые числа
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          23 / 4 = 5,75, а целочисленное деление оставляет только 5. Остаток:
          23 − 5·4 = 3. −23 / 4 усекается к нулю, получается −5.
      main:
        title: Разделите ящики
        prompt: |
          Прочитайте число ящиков и число роботов (оба int, роботов не меньше 1).
          Выведите, сколько ящиков получает каждый робот и сколько остаётся на
          складе. Для ввода `17 5`:

          ```
          Each robot gets 3 crates
          Left in depot: 2
          ```
        explanation: |
          `crates / robots` — целочисленное деление, оно даёт целую долю.
          `crates % robots` — ровно та часть, которую нельзя поделить. Один
          вызов `scanf("%d %d", ...)` может прочитать сразу два значения.
        hints:
          - |-
            Равные целые доли — это деление; то, что осталось, — остаток.
          - |-
            Используйте / для доли и % для остатка. Оба операнда int, поэтому результаты тоже int.
          - |-
            `share = crates / robots;` `leftover = crates % robots;`
          - |-
            Выведите: `printf("Each robot gets %d crates\n", share);` и `printf("Left in depot: %d\n", leftover);`
          - |-
            Полное решение вычисляет оба значения и выводит две строки.
        tests:
          exact: Делится без остатка.
          few: Ящиков меньше, чем роботов.

  supply-depot/precedence:
    title: Порядок операций
    objectives:
      - Применять приоритет операций — * / % раньше + -, слева направо внутри уровня.
      - Использовать скобки, чтобы задать нужный порядок вычислений.
      - Найти и исправить ошибку приоритета по результатам тестов.
    world: { label: БАТАРЕЙНЫЙ БЛОК }
    briefing: |
      Батарейный блок сообщает процент оставшегося заряда, но показывает
      невозможные числа. Формула не учитывает порядок, в котором C вычисляет
      операции.
    lesson: |
      ### Приоритет
      C сначала выполняет операции с более высоким **приоритетом**:

      | Приоритет (от высокого к низкому) | Операции | Группировка |
      |---|---|---|
      | 1 | `( )` скобки | сначала внутренние |
      | 2 | унарные `-`, `+`, `!`, `++`, `--`, приведения типа | справа налево |
      | 3 | `*` `/` `%` | слева направо |
      | 4 | `+` `-` | слева направо |
      | … | сравнения, `&&`, `||`, `?:` | (в следующих главах) |
      | низший | `=` `+=` `-=` … | справа налево |

      Поэтому `2 + 3 * 4` равно `14`, а `(2 + 3) * 4` — `20`. Операции одного
      уровня группируются **слева направо**: `7 / 2 * 2` — это `(7 / 2) * 2` = `6`.

      **Если не уверены — ставьте скобки.** Они ничего не стоят и делают
      замысел понятным читателю.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          printf("%d\n", 2 + 3 * 4);
          printf("%d\n", (2 + 3) * 4);
          printf("%d\n", 7 / 2 * 2);
          printf("%d\n", -2 * -3);
          return 0;
      }
      ```
    success: |
      `*`, `/` и `%` связывают сильнее, чем `+` и `-`; внутри одного уровня C
      работает слева направо. Скобки явно задают нужный порядок.
    steps:
      order-predict:
        title: Что сначала?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `b / 2` выполняется раньше `+` (12). Скобки заставляют сначала
          сложить (7). `a - b - 2` группируется слева направо: (10 − 4) − 2 = 4.
          `%` и `*` на одном уровне: (10 % 4) · 3 = 6.
      main:
        title: Исправьте формулу батареи
        prompt: |
          Программа читает **ёмкость** батареи и **израсходованное** количество и
          должна вывести оставшийся процент (целочисленная арифметика подходит).
          Для ввода `200 50` она должна вывести `Remaining: 75%`. Запустите
          тесты, посмотрите на неверные значения и исправьте формулу.
        explanation: |
          Без скобок C вычислял `capacity - ((used * 100) / capacity)`. Остаток
          заряда — это `capacity - used`; его нужно вычислить первым, затем
          умножить на 100 и разделить на ёмкость. (`%%` в printf выводит один
          знак процента.)
        hints:
          - |-
            Запишите формулу на бумаге: оставшийся процент = (что осталось) × 100 ÷ ёмкость.
          - |-
            Какая операция в текущей строке выполняется первой? Этого ли вы хотите?
          - |-
            Скобки задают порядок: `(a - b) * c / d`.
          - |-
            `percent = (capacity - used) * 100 / capacity;`
          - |-
            Полное решение добавляет только одну пару скобок.
        tests:
          rounding: Целочисленное деление отбрасывает дробь (66,67 → 66).

  supply-depot/increment:
    title: Считаем вверх и вниз
    objectives:
      - Использовать ++ и -- для прибавления или вычитания единицы.
      - Объяснить разницу между постфиксным x++ (сначала использовать, потом увеличить) и префиксным ++x (сначала увеличить, потом использовать).
      - Изменять переменные с помощью += -= *= /= %=.
    world: { label: КНИГА УЧЁТА }
    briefing: |
      Книга учёта склада записывает каждое изменение запаса ящиков. Изменения
      вроде «прибавить 12» или «разделить пополам» так часты, что в C для них
      есть короткие операции.
    lesson: |
      ### Инкремент и декремент
      `x++` и `++x` оба прибавляют 1 к `x`; `x--` и `--x` оба вычитают 1. Как
      отдельные инструкции они делают одно и то же:

      ```c
      count++;    /* same effect as count = count + 1; */
      ```

      Разница видна, только когда используется **значение** выражения:

      * **постфиксная** форма `x++`: значение выражения — **старое** `x`, затем
        `x` увеличивается;
      * **префиксная** форма `++x`: `x` увеличивается, и значение выражения —
        **новое** `x`.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int x = 5;
          int y = x++;    /* y gets 5, then x becomes 6 */
          printf("x=%d y=%d\n", x, y);
          int z = ++x;    /* x becomes 7, then z gets 7 */
          printf("x=%d z=%d\n", x, z);
          return 0;
      }
      ```

      > [!warning] Применяйте `++`/`--` к переменной **не больше одного раза в
      > выражении** и не читайте эту переменную в других местах того же
      > выражения. Следующая миссия покажет почему.

      ### Составное присваивание
      | Сокращение | Означает |
      |---|---|
      | `x += y` | `x = x + y` |
      | `x -= y` | `x = x - y` |
      | `x *= y` | `x = x * y` |
      | `x /= y` | `x = x / y` |
      | `x %= y` | `x = x % y` |

      Правая часть сначала вычисляется целиком: `x *= a + b` означает
      `x = x * (a + b)`.
    success: |
      `++` и `--` изменяют переменную на единицу; префиксная и постфиксная
      формы различаются только значением выражения. Составные присваивания
      вроде `+=` и `/=` изменяют переменную на месте.
    steps:
      prefix-predict:
        title: До или после?
        prompt: Что выведет эта программа?
        explanation: |
          `b = a++` сохраняет в b старое значение 3, затем a становится 4.
          `c = ++a` сначала делает a равным 5 и сохраняет 5 в c.
      main:
        title: Ведите учёт
        prompt: |
          Прочитайте начальное число ящиков. Затем примените изменения
          **с помощью составного присваивания**, нумеруя каждый шаг счётчиком,
          который увеличивается через `++`:

          1. поставка добавляет 12 ящиков (`+=`)
          2. ремонт расходует 5 ящиков (`-=`)
          3. фабрикатор удваивает запас (`*=`)
          4. запас делится на 3 склада; оставьте треть (`/=`)

          После каждого изменения выводите `step <номер>: crates = <значение>`.
          Для ввода `10`:

          ```
          step 1: crates = 22
          step 2: crates = 17
          step 3: crates = 34
          step 4: crates = 11
          ```
        explanation: |
          Каждое составное присваивание изменяет `crates` на месте, а `step++`
          считает изменения. `/=` для int — целочисленное деление, поэтому 34 / 3
          даёт 11.
        hints:
          - |-
            Каждое изменение — одно составное присваивание; каждый шаг также увеличивает счётчик на один.
          - |-
            Повторите трёхстрочный образец шага 1 (изменение, счёт, вывод) ещё три раза.
          - |-
            `crates -= 5;` `crates *= 2;` `crates /= 3;`
          - |-
            Шаг 2: `crates -= 5; step++; printf("step %d: crates = %d\n", step, crates);`
          - |-
            Полное решение повторяет образец для всех четырёх шагов.

  supply-depot/forbidden-expression:
    title: Запретное выражение
    objectives:
      - Распознавать неопределённое поведение, вызванное двойным изменением переменной в одном выражении.
      - Объяснить, почему у такого выражения нет правильного «ответа».
      - Переписать его отдельными корректными инструкциями, выражающими задуманное вычисление.
    world: { label: ОПЕЧАТАННЫЙ ТЕРМИНАЛ }
    briefing: |
      В опечатанном кабинете склада PIP-7 находит терминал, вычисляющий
      `(++i) + (i++) + (++i)`. Разные машины на острове выводят разные
      результаты. Выясните почему — и замените его кодом, который имеет смысл.
    lesson: |
      ### Неопределённое поведение
      У некоторых программ на C **неопределённое поведение** (UB): стандарт C
      *никак не ограничивает* то, что произойдёт. Любой вывод, аварийное
      завершение или код, который сегодня «работает», а завтра нет, —
      всё «допустимо».

      Один из источников UB — **изменение одной и той же переменной больше
      одного раза в одном выражении** (или её изменение и чтение в другом месте
      того же выражения), потому что C не фиксирует порядок вычисления частей.
      Примеры:

      ```c
      i = i++ + 1;              /* undefined */
      x = (++i) + (i++) + (++i);  /* undefined */
      printf("%d %d", i, i++);  /* undefined: argument order is not specified */
      ```

      Компилятор предупреждает: *multiple unsequenced modifications to 'i'*.
      Разные компиляторы — или один компилятор с разными опциями —
      действительно выдают разные числа.

      > [!correction] Слайд 47 показывает `(++i)+(i++)+(++i)` как пример стиля.
      > Это хуже, чем плохой стиль: это **неопределённое поведение**, поэтому
      > правильного результата для предсказания нет, и игра никогда не попросит
      > его предсказать.

      ### Решение: одно изменение на инструкцию
      Разбейте работу на инструкции. Каждая инструкция полностью
      завершается до начала следующей, поэтому порядок фиксирован.
    success: |
      Выражение, изменяющее переменную дважды (или изменяющее и читающее её),
      имеет неопределённое поведение — «правильного» значения нет. Одно
      изменение на инструкцию делает порядок явным, а результат — определённым.
    steps:
      ub-quiz:
        title: Каково значение?
        question: '`int i = 1; int x = (++i) + (i++) + (++i);` — каково значение x по стандарту C?'
        choices:
          - '8'
          - '9'
          - '7'
          - 'Правильного значения нет: поведение не определено'
        explanation: |
          Поскольку `i` изменяется трижды без упорядочивания между изменениями,
          стандарт не определяет поведение. Компилятор может вывести 8, 9, 7 или
          что-то ещё, и ни одно из них не является «ответом».
      main:
        title: Сделайте поведение определённым
        prompt: |
          Автор программы **задумывал** такое пошаговое вычисление:

          1. увеличить `i` на единицу и прибавить новое `i` к `total`;
          2. прибавить текущее `i` к `total`, затем увеличить `i` на единицу;
          3. увеличить `i` на единицу и прибавить новое `i` к `total`.

          Перепишите программу так, чтобы она делала ровно это отдельными
          инструкциями (без `++`/`--` внутри больших выражений). Для ввода `1`:

          ```
          total = 8, i = 4
          ```

          Компилятор не должен выдавать предупреждение *unsequenced
          modification*.
        explanation: |
          Каждая инструкция меняет одну вещь, поэтому порядок в точности тот, в
          котором вы написали. Для i = 1: i становится 2 (total 2), total
          становится 4, i становится 3, i становится 4 (total 8).
        hints:
          - |-
            Неопределённое поведение не исправить угадыванием порядка — запишите порядок явно.
          - |-
            Превратите каждый из трёх шагов в две отдельные инструкции: одну, меняющую i, и одну, прибавляющую к total.
          - |-
            Пишите `i++;` на отдельной строке и `total += i;` на другой. Не забудьте начать total с 0.
          - |-
            Шаг 1: `i++; total += i;`, шаг 2: `total += i; i++;`
          - |-
            Полное решение состоит из шести коротких инструкций.

  supply-depot/type-conversion:
    title: Преобразование типов
    objectives:
      - Предсказывать автоматические преобразования в смешанных выражениях вроде 1 + 1.5.
      - Понимать, что int / int остаётся целым, даже если результат сохраняется в double.
      - Использовать явное приведение (double), чтобы получить задуманный результат.
    world: { label: КАЛИБРОВОЧНАЯ СТАНЦИЯ }
    briefing: |
      Измерительная станция усредняет три целых показания, но её средние
      всегда получаются целыми — калибровка сбита. Выясните почему.
    lesson: |
      ### Автоматическое (неявное) преобразование
      Когда в выражении смешаны типы, C преобразует автоматически:

      * `1 + 1.5`: int `1` превращается в double, результат — `2.5` (`double`).
      * Присваивание double переменной int **отбрасывает дробную часть**:
        `int n = 3.99;` сохраняет `3`.
      * Присваивание int переменной double для обычных значений точно:
        `double d = 7;`

      ### Классическая ловушка
      Тип операции зависит от её **операндов**, а не от того, куда идёт
      результат:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int sum = 7, count = 2;
          double wrong = sum / count;            /* int / int = 3, then 3.0 */
          double right = (double) sum / count;   /* 7.0 / 2 = 3.5 */
          printf("%g %g\n", wrong, right);
          return 0;
      }
      ```

      ### Явное преобразование (приведение типа)
      `(тип) выражение` преобразует значение намеренно. `(double) sum`
      превращает `sum` в double *до* деления. Константа double вроде `3.0` даёт
      тот же эффект.

      **Хорошая практика:** держите типы в одном выражении одинаковыми, кроме
      очевидных случаев, и используйте явные приведения, когда хотите
      преобразовать.

      > [!correction] На слайде 31 сказано, что автоматическое преобразование
      > «может вызвать предупреждение». `1 + 1.5` никогда не вызывает
      > предупреждения. Компиляторы предупреждают только о *возможно
      > теряющих данные* преобразованиях (например, double → int), и только с
      > опциями вроде `-Wconversion`.
    success: |
      В смешанной арифметике int/double int превращается в double, но
      `int / int` — целочисленное деление, куда бы ни сохранялся результат.
      Приведение `(double) total` преобразует значение намеренно, до деления.
    steps:
      mixed-predict:
        title: Какой тип побеждает?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `a / 2` — это int / int = 2 (затем сохраняется как 2.0). `a / 2.0`
          превращает a в double и даёт 2.5. Запись 9.99 в int усекает до 9.
      main:
        title: Исправьте среднее
        prompt: |
          Программа читает три целых показания и должна вывести их среднее с
          двумя знаками после точки. Для ввода `1 2 2` правильный вывод —
          `Average: 1.67`, но программа выводит `Average: 1.00`. Исправьте её.
        explanation: |
          `(r1 + r2 + r3) / 3` делит два int, поэтому дробь терялась ещё до того,
          как результат попадал в `average`. Приведение суммы к double делает
          деление вещественным. Деление на `3.0` тоже сработало бы.
        hints:
          - |-
            Спросите себя: какие типы у двух операндов деления?
          - |-
            Сделайте хотя бы один операнд / типа double до деления.
          - |-
            Синтаксис приведения: `(double) выражение`; или используйте константу double вроде 3.0.
          - |-
            `average = (double) (r1 + r2 + r3) / 3;`
          - |-
            Полное решение приводит сумму к double.

  supply-depot/cm-to-feet:
    title: Сантиметры в футы
    objectives:
      - Разобрать программу cm2feet.c из лекции строка за строкой.
      - Использовать автоматическое преобразование double в int для получения целых футов.
      - Вычислить оставшиеся дюймы из общего числа.
    world: { label: ДАТЧИК ГРУЗА }
    briefing: |
      Старый грузовой кран строила инженерная команда, мерившая всё в футах и
      дюймах. Переведите метрические высоты склада, чтобы кран поднимал грузы
      безопасно.
    lesson: |
      В одном дюйме 2,54 см, в одном футе 12 дюймов. Программа из лекции:

      ```c example stdin=180
      /*
       * File: cm2feet.c
       * Convert a height in centimetres to feet and inches
       */
      #include <stdio.h>

      int main(void)
      {
          double cm, totalInches, inch;
          int feet;

          printf("This program converts centimeters to feet and inches.\n");
          printf("Height in centimeters? ");
          scanf("%lf", &cm);
          totalInches = cm / 2.54;
          feet = totalInches / 12;           /* automatic conversion to int */
          inch = totalInches - feet * 12;
          printf("%g cm = %d ft %g in\n", cm, feet, inch);
          return 0;
      }
      ```

      * `totalInches / 12` — это double, но при записи в **int** `feet`
        дробь отбрасывается — получаются ровно целые футы.
      * `feet * 12` при вычитании из `totalInches` снова превращается в
        double, и остаются лишние дюймы.
    success: |
      Запись double в int сохраняет только целую часть — это целые футы; если
      вычесть `feet * 12` из общего числа дюймов, получится остаток.
    steps:
      main:
        title: Восстановите конвертер
        prompt: |
          Допишите два недостающих вычисления. Для ввода `180` программа должна
          вывести (после приглашения):

          ```
          180 cm = 5 ft 10.8661 in
          ```
        explanation: |
          `feet = totalInches / 12;` опирается на автоматическое преобразование
          double → int, отбрасывающее дробь. `inch = totalInches - feet * 12;` —
          то, что остаётся после вычитания целых футов.
        hints:
          - |-
            В футе 12 дюймов; футы должны быть целым числом.
          - |-
            Разделите общее число дюймов на 12 и сохраните в переменной int; затем вычтите дюймы, ушедшие на целые футы.
          - |-
            Запись double в int сохраняет целую часть: `int n = 5.9;` сохраняет 5.
          - |-
            `feet = totalInches / 12;` и `inch = totalInches - feet * 12;`
          - |-
            Полное решение — это cm2feet.c из лекции.
        tests:
          exact: 100 дюймов = 8 футов 4 дюйма.
          short: Меньше одного фута.

  supply-depot/feet-to-cm:
    title: Футы в сантиметры
    objectives:
      - Самостоятельно написать обратное преобразование — из футов и дюймов в сантиметры.
      - Правильно смешивать значения int и double в одном вычислении.
    world: { label: ДАТЧИК ГРУЗА }
    briefing: |
      В инструкции к крану зазоры указаны в футах и дюймах. Переведите их
      обратно в сантиметры, чтобы метрические датчики склада могли ими
      пользоваться.
    lesson: |
      Это упражнение из лекции (слайд 33). Выполните обратное преобразование:
      всего дюймов = футы × 12 + дюймы, а сантиметры = всего дюймов × 2,54.

      Подумайте о типах: футы здесь целые (`int`), у дюймов может быть дробная
      часть (`double`).
    success: |
      Вы сами написали полную программу преобразования, смешав int (футы) и
      double (дюймы). В вычислении int автоматически превратился в double.
    steps:
      main:
        title: Напишите обратный конвертер
        prompt: |
          Прочитайте футы (`int`) и дюймы (`double`), затем выведите рост в
          сантиметрах. Для ввода `5 10.5`:

          ```
          5 ft 10.5 in = 179.07 cm
          ```

          Для футов используйте `%d`, для дюймов и сантиметров — `%g`.
        explanation: |
          `feet * 12` — это int; при сложении с double `inch` он превращается в
          double; умножение на 2.54 даёт сантиметры.
        hints:
          - |-
            Сначала переведите всё в дюймы, затем дюймы в сантиметры.
          - |-
            всего дюймов = feet * 12 + inch; сантиметры = всего дюймов * 2.54.
          - |-
            Прочитайте int и double одним вызовом: `scanf("%d %lf", &feet, &inch);`
          - |-
            `cm = (feet * 12 + inch) * 2.54;`, затем `printf("%d ft %g in = %g cm\n", feet, inch, cm);`
          - |-
            Полное решение использует одну переменную int и две double.

  supply-depot/depot-ledger:
    title: 'Итог главы: книга склада'
    objectives:
      - Совместить в одной программе целочисленное деление, остаток, приведение типов и составное присваивание.
      - Выводить процент с одним знаком после точки.
    world: { label: КНИГА СКЛАДА }
    briefing: |
      Дроны снабжения покидают склад с одинаковым грузом. Книга должна
      показать груз каждого дрона, остаток на складе, долю каждого дрона в
      процентах и остаток после страховой добавки.
    lesson: |
      Всё нужное было в этой главе: целочисленные `/` и `%`, приведение к
      double, `%.1f` и составное присваивание. Спланируйте вычисления до того,
      как начнёте печатать. (`%%` в строке printf выводит знак процента.)
    success: |
      Ваша книга использовала целочисленное деление для целых грузов, `%` для
      остатка, приведение типа для точного процента и составное присваивание
      для добавки. Склад снабжения полностью работает.
    steps:
      main:
        title: Напишите книгу склада
        prompt: |
          Прочитайте общий запас и число дронов (оба int, дронов ≥ 1). Выведите
          четыре строки. Для ввода `100 3`:

          ```
          Each drone: 33 units
          Reserve: 1 units
          Share per drone: 33.0%
          Reserve after top-up: 11 units
          ```

          * **Share per drone** = груз ÷ общий запас × 100, с одним знаком
            после точки (тесты не проверяют случай нулевого запаса).
          * Добавка прибавляет 10 единиц к остатку.
        explanation: |
          `/` и `%` делят общий запас на равные грузы и остаток. Приведение
          `(double) load` предотвращает целочисленное деление при вычислении
          процента. `reserve += 10` изменяет остаток на месте.
        hints:
          - |-
            Два значения получаются целочисленным делением и остатком; для процента нужно вещественное деление.
          - |-
            Сначала вычислите load, reserve и share, затем выводите. Добавку сделайте составным присваиванием перед последней строкой.
          - |-
            `share = (double) load / total * 100;` и `printf("%.1f%%\n", share);`
          - |-
            `load = total / drones; reserve = total % drones; ... reserve += 10;`
          - |-
            Полное решение выводит четыре строки по порядку.
