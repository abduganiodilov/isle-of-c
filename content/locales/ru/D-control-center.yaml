chapters:
  control-center:
    title: Центр управления
    region: Перекрёсток — центр управления
    intro: >
      На перекрёстке острова стоит центр управления. Его программы должны
      принимать решения: какой маршрут безопасен, в каком режиме работать
      машине, когда поднимать тревогу. PIP-7 изучает if, else, логические
      операции и switch.
    outro: >
      Центр управления прокладывает маршруты роботов, классифицирует показания
      датчиков и выбирает режимы машин. PIP-7 умеет принимать решения и даже
      повторять простое действие.

missions:
  control-center/blocks-and-scope:
    title: Блоки и область видимости
    objectives:
      - Группировать инструкции в блок фигурными скобками и объявлять в нём переменные.
      - Объяснить, что переменная, объявленная в блоке, существует только внутри этого блока (её область видимости).
      - Знать, что пустой блок {} допустим и что после блока точка с запятой не ставится.
    world: { label: ПУЛЬТ УПРАВЛЕНИЯ, goal: Выведите отчёт о смене }
    briefing: |
      Программа пульта центра управления не компилируется: значение,
      вычисленное внутри блока, используется снаружи. Узнайте, что такое блоки
      и где видна переменная.
    lesson: |
      ### Блоки
      Фигурные скобки `{ }` объединяют несколько инструкций в один **блок**
      (*составную инструкцию*). Блок может стоять везде, где допустима одна
      инструкция. Вы уже использовали блок — тело `main`.

      ```c
      {
          int a, b, c;
          c = (a = 1) + (b = 2);   /* c is 3: a and b are different variables */
      }
      ```

      * Переменные можно объявлять в начале блока (или где угодно внутри,
        начиная с C99).
      * **Пустой блок** `{}` допустим; он ничего не делает.
      * После закрывающей скобки `}` **точка с запятой не нужна**.

      ### Область видимости
      Переменная, объявленная внутри блока, существует только от своего
      объявления до конца **этого** блока. Эта область — её **область
      видимости**. Снаружи имя неизвестно, и компилятор сообщает *use of
      undeclared identifier*.

      ```c example error
      #include <stdio.h>

      int main(void)
      {
          {
              int inside = 5;
              printf("%d\n", inside);   /* fine */
          }
          printf("%d\n", inside);       /* error: inside is out of scope */
          return 0;
      }
      ```

      > [!note] Выражение со слайда `c = (a=1) + (b=2);` корректно, потому что
      > `a` и `b` — разные переменные, но присваивания, спрятанные внутри
      > выражений, трудно читать. Лучше одно присваивание на инструкцию.
    success: |
      Блок объединяет инструкции и может содержать свои объявления. Область
      видимости переменной заканчивается на закрывающей скобке объявившего её
      блока, поэтому значение, нужное позже, надо объявлять во внешнем блоке.
    steps:
      scope-predict:
        title: Две переменные с одним именем
        prompt: |
          Внутренний блок может объявить *новую* переменную с тем же именем, что
          и внешняя; внутри блока внутренняя скрывает внешнюю. Что выведет эта
          программа?
        answer:
          choices:
            - '2 2'
            - '1 1'
            - '2 1'
            - Ошибка компиляции
        explanation: |
          Блок объявляет отдельную переменную `level`. Она скрывает внешнюю
          только до закрывающей скобки; после этого снова видна внешняя `level`
          (1). (Так переиспользовать имена можно, но это запутывает.)
      main:
        title: Почините пульт
        prompt: |
          Сделайте так, чтобы программа компилировалась и для ввода `6 4`
          выводила:

          ```
          Shift total: 10
          Report complete
          ```

          Блок, вычисляющий сумму, оставьте; измените место объявления `total`.
        explanation: |
          `total` нужно объявить во внешнем блоке (теле main), чтобы она
          оставалась видимой в printf. Внутренний блок теперь только присваивает
          ей значение.
        hints:
          - |-
            Прочитайте ошибку: какое имя не объявлено и в какой строке?
          - |-
            Переменная видна только внутри блока, где объявлена. Объявите total там, где её видят и блок, и printf.
          - |-
            Объявите её рядом с `int morning, evening;`, а внутри блока пишите только `total = ...;`
          - |-
            Добавьте `int total;` в начало main и замените внутреннюю строку на `total = morning + evening;`
          - |-
            Полное решение выносит объявление из внутреннего блока.

  control-center/route-robot:
    title: Проложите маршрут
    objectives:
      - Написать инструкцию if/else, выбирающую одно из двух действий.
      - Использовать в условии операции сравнения < <= > >=.
      - Проверять граничное значение условия.
    world: { label: МАРШРУТНЫЕ ВОРОТА }
    briefing: |
      К центру управления ведёт узкий мост. Датчик расстояния PIP-7 сообщает,
      насколько далеко следующее препятствие. Слишком близко — стоп. Иначе —
      вперёд.
    lesson: |
      ### if и else
      ```c
      if (condition)
          statement;            /* runs only when the condition is true */

      if (condition) {
          statements;           /* true branch */
      } else {
          statements;           /* false branch */
      }
      ```

      Условие пишется в **скобках**. Если в ветви больше одной инструкции,
      используйте **блок** `{ }`. Многие программисты всегда ставят скобки — это
      защищает от ошибок, когда позже добавляют вторую инструкцию.

      ### Операции сравнения
      | Операция | Смысл | Пример |
      |---|---|---|
      | `<` | меньше | `a < 1` |
      | `<=` | меньше или равно | `a <= 1` |
      | `>` | больше | `a > 1` |
      | `>=` | больше или равно | `a >= 1` |
      | `==` | равно | `a == 1` |
      | `!=` | не равно | `a != 1` |

      ```c example stdin=72
      #include <stdio.h>

      int main(void)
      {
          int temperature;
          scanf("%d", &temperature);
          if (temperature > 60) {
              printf("Too hot\n");
          } else {
              printf("Temperature OK\n");
          }
          return 0;
      }
      ```

      > [!tip] Всегда проверяйте **границу**: если правило «меньше 50»,
      > попробуйте 49 и 50.
    success: |
      `if (условие) ... else ...` выбирает ровно одну из двух ветвей. Проверка
      границы (50) убедилась, что вы использовали `<`, а не `<=`.
    steps:
      main:
        title: Стоп или вперёд?
        prompt: |
          Прочитайте расстояние до препятствия в сантиметрах (int). Если оно
          **меньше 50**, выведите `STOP`; иначе выведите `GO`.
        explanation: |
          Выполняется ровно одна ветвь: `STOP`, когда `distance < 50`, и `GO` во
          всех остальных случаях, включая ровно 50.
        hints:
          - |-
            Два исхода: один, когда условие выполнено, другой — когда нет.
          - |-
            Добавьте ветвь else после закрывающей скобки if.
          - |-
            `} else { printf("GO\n"); }`
          - |-
            Целиком: `if (distance < 50) { printf("STOP\n"); } else { printf("GO\n"); }`
          - |-
            Полное решение добавляет ветвь else.
        tests:
          just-below: Граница — 49 меньше 50.
          boundary: Граница — 50 не меньше 50.

  control-center/truth-values:
    title: Истина, ложь, 1 и 0
    objectives:
      - Объяснить, что C считает ноль ложью, а любое ненулевое значение — истиной.
      - Использовать то, что операции сравнения и равенства дают 1 или 0.
      - Описать bool в C99 (<stdbool.h>) и C23.
    world: { label: ИНДИКАТОРЫ СОСТОЯНИЯ }
    briefing: |
      Индикаторы на панели управления либо горят (1), либо нет (0). Они
      подключены прямо к сравнениям — никаких if не нужно.
    lesson: |
      ### Условия — это числа
      В C условие — это просто значение:

      * **ноль** означает **ложь**;
      * **любое ненулевое значение** означает **истину**.

      ```c
      a = 1; if (a) b = a;    /* runs: 1 is true  */
      a = 0; if (a) b = a;    /* skipped: 0 is false */
      ```

      ### Сравнения дают 1 или 0
      Операции сравнения (`<`, `<=`, `>`, `>=`) и равенства (`==`, `!=`) дают
      значение `int` **1**, если верно, и **0**, если нет, поэтому их можно
      выводить и сохранять:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int a = 5;
          printf("%d %d %d\n", a > 3, a == 3, a != 3);
          return 0;
      }
      ```

      ### А логический тип?
      > [!correction] На слайде 37 сказано «в C нет логического типа». Это
      > было верно только для C89. **C99** добавил тип `_Bool` и заголовок
      > `<stdbool.h>` с `bool`, `true` (1) и `false` (0). В **C23** `bool`,
      > `true` и `false` стали ключевыми словами, и заголовок не нужен. Игра
      > использует C17, поэтому подключайте `<stdbool.h>`.

      ```c example
      #include <stdio.h>
      #include <stdbool.h>

      int main(void)
      {
          bool doorOpen = false;
          bool alarm = 3 > 2;          /* true */
          printf("%d %d\n", doorOpen, alarm);
          return 0;
      }
      ```

      Преобразование любого ненулевого значения в `bool` даёт `true` (1).
    success: |
      В C условия — это числа: 0 — ложь, всё остальное — истина. Сравнения
      дают 1 или 0. Начиная с C99 можно использовать `bool` из `<stdbool.h>`,
      а в C23 это ключевое слово.
    steps:
      truthy-predict:
        title: Какие ветви выполнятся?
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          −3 не ноль, поэтому `if (a)` истинно. `a + 3` равно 0 — ложь. `a < 0`
          истинно. `a == -3` даёт 1.
      main:
        title: Подключите индикаторы
        prompt: |
          Прочитайте температуру (int). Выведите значения трёх индикаторов,
          каждое **1 или 0**, используя сравнения напрямую (if не нужен):

          * `hot` — температура больше 30
          * `freezing` — температура не больше 0
          * `on target` — температура ровно 21

          Для ввода `21`:

          ```
          hot: 0
          freezing: 0
          on target: 1
          ```
        explanation: |
          Каждое сравнение — выражение со значением 1 или 0, поэтому `%d` в
          printf выводит его напрямую.
        hints:
          - |-
            Сравнение уже имеет значение 1 или 0 — его можно вывести.
          - |-
            Ещё две строки printf, каждая выводит одно сравнение.
          - |-
            «Не больше 0» — это `<= 0`; «ровно 21» — `== 21`.
          - |-
            `printf("freezing: %d\n", temperature <= 0);`
          - |-
            Полное решение выводит три сравнения.
        tests:
          zero: 0 считается заморозкой.
          boundary: 30 не больше 30.

  control-center/assign-vs-equal:
    title: На один знак равенства меньше
    objectives:
      - Различать = (присваивание) и == (сравнение).
      - Объяснить, почему if (code = 42) всегда истинно и меняет переменную.
      - Находить эту ошибку по предупреждению компилятора.
    world: { label: ЗАЩИЩЁННАЯ ДВЕРЬ }
    briefing: |
      Дверь в центр управления открывается при любом введённом коде. Кто-то
      написал один знак равенства там, где нужно два.
    lesson: |
      * `=` **присваивает**: `code = 42` сохраняет 42 в `code`, а значение
        выражения — 42.
      * `==` **сравнивает**: `code == 42` равно 1, если code равно 42, иначе 0.

      Поэтому `if (code = 42)` сохраняет 42, а затем проверяет 42 — это не
      ноль, значит условие **всегда истинно**, что бы ни ввели. Это одна из
      самых частых ошибок в C.

      Компилятор это замечает: *using the result of an assignment as a
      condition without parentheses*. Читайте предупреждения — они часто
      указывают прямо на ошибку.

      > [!tip] Некоторые пишут константу первой: `if (42 == code)`. Если
      > случайно набрать `42 = code`, это будет ошибка компиляции, а не тихий
      > баг.
    success: |
      `=` присваивает, `==` сравнивает. Присваивание внутри условия почти
      всегда ошибка, и компилятор о нём предупреждает.
    steps:
      main:
        title: Почините дверь
        prompt: |
          Дверь должна выводить `ACCESS GRANTED` только для кода 42 и
          `ACCESS DENIED` для всех остальных. Посмотрите на предупреждение и
          исправьте ошибку.
        explanation: |
          С `==` условие сравнивает, а не присваивает, поэтому 1 (истину) даёт
          только 42.
        hints:
          - |-
            Какая операция сравнивает два значения, а какая сохраняет значение?
          - |-
            Посмотрите на условие инструкции if и на предупреждение компилятора о нём.
          - |-
            Сравнение записывается двумя знаками равенства: `a == b`.
          - |-
            `if (code == 42)`
          - |-
            Полное решение меняет один символ.

  control-center/signum:
    title: Решения с тремя исходами
    objectives:
      - Построить цепочку else if с тремя исходами.
      - Реализовать функцию signum из лекции.
    world: { label: КЛАССИФИКАТОР ДАТЧИКОВ }
    briefing: |
      Датчики давления сообщают о положительном, нулевом или отрицательном
      дрейфе. Классификатор должен разложить каждое показание в одну из трёх
      корзин — по **знаку** (signum) значения.
    lesson: |
      ### else if
      В C нет специального ключевого слова `elseif`. Поскольку после `else`
      может идти *любая* инструкция — в том числе ещё одна `if`, — решения
      можно выстраивать в цепочку:

      ```c
      if (x > 0)
          signum = 1;
      else if (x == 0)
          signum = 0;
      else
          signum = -1;
      ```

      Условия проверяются сверху вниз; выигрывает первое истинное, а последнее
      `else` ловит всё остальное.

      > [!correction] Слайд 36 спрашивает, как реализовать «elseif», раз его
      > нет в C. Ответ выше: `else if` — это просто `else`, инструкцией которого
      > является ещё одна `if`.

      Функция signum: sgn(x) = 1 при x > 0, 0 при x = 0, −1 при x < 0.
    success: |
      Цепочка `else if` проверяет условия по порядку и выполняет ровно одну
      ветвь. Классификатор раскладывает каждое показание в −1, 0 или 1.
    steps:
      main:
        title: Классифицируйте дрейф
        prompt: |
          Допишите программу signum из лекции: прочитайте `double` и выведите
          его знак. Для ввода `-3.5`:

          ```
          signum = -1
          ```
        explanation: |
          Цепочка проверяет `x > 0`, затем `x == 0`; всё остальное обязано быть
          отрицательным. На каждом пути `signum` получает значение, поэтому она
          никогда не используется неинициализированной.
        hints:
          - |-
            Случаев три; первый уже сделан.
          - |-
            Продолжите if веткой `else if` для нуля и последним `else` для отрицательных значений.
          - |-
            `else if (x == 0) signum = 0;`
          - |-
            Затем `else signum = -1;`
          - |-
            Полное решение — программа signum из лекции.
        tests:
          tiny: Маленькое, но положительное.

  control-center/absolute-value:
    title: Модуль дрейфа
    objectives:
      - Самостоятельно написать полную программу с решением.
      - Вычислить модуль (абсолютное значение) числа с помощью условия.
    world: { label: ИЗМЕРИТЕЛЬ ДРЕЙФА }
    briefing: |
      Стрелка измерителя дрейфа движется только вправо: она показывает
      величину дрейфа, но не его направление. Вычислите **модуль** значения.
    lesson: |
      Модуль |x| равен x при x ≥ 0 и −x при x < 0. Это упражнение из лекции
      (слайд 40). Напишите его с инструкцией `if`; в этой миссии нельзя
      использовать библиотечные функции `fabs` и `abs`, чтобы вы отработали
      решение сами.
    success: |
      Вы сами написали решение: менять знак, только если значение
      отрицательно. (Вне этого упражнения то же самое для double делает `fabs`
      из `<math.h>`.)
    steps:
      main:
        title: Напишите программу модуля
        prompt: |
          Прочитайте `double` и выведите его модуль через `%g`. Для ввода
          `-4.5`:

          ```
          |x| = 4.5
          ```
        explanation: |
          Если значение отрицательно, унарный минус меняет его знак; иначе оно
          уже равно своему модулю. Достаточно одного `if` без `else`.
        hints:
          - |-
            Меняются только отрицательные значения.
          - |-
            Прочитайте x; если он меньше нуля, замените его на противоположное значение; затем выведите.
          - |-
            Смена знака: `x = -x;`
          - |-
            `if (x < 0) { x = -x; }`, затем `printf("|x| = %g\n", x);`
          - |-
            Полное решение использует одну инструкцию if.

  control-center/logic-gates:
    title: Логические вентили
    objectives:
      - Объединять условия с помощью && (и), || (или) и ! (не).
      - Читать составное условие и определять, когда оно истинно.
      - Отличать логические операции && || от побитовых & |.
    world: { label: СТАРТОВАЯ ПЛОЩАДКА }
    briefing: |
      Дроны снабжения могут взлетать, только когда это безопасно — или когда
      оператор объявил чрезвычайную ситуацию. Несколько условий нужно
      объединить в одно решение.
    lesson: |
      ### Логические операции
      При `a = 1` и `b = 0`:

      | Операция | Смысл | Пример | Значение |
      |---|---|---|---|
      | `!` | не | `!a` | 0 |
      | `&&` | и: истинно, только если **оба** истинны | `a && b` | 0 |
      | `\|\|` | или: истинно, если истинен **хотя бы один** | `a \|\| b` | 1 |

      Как и сравнения, результаты — int 1 и 0. Сильнее всех связывает `!`,
      затем `&&`, затем `||`; сравнения связывают сильнее `&&` и `||`, поэтому
      в `x > 0 && x < 10` дополнительные скобки не нужны. При смешивании `&&` и
      `||` добавляйте скобки для читателей.

      ```c example
      #include <stdio.h>

      int main(void)
      {
          int battery = 80, wind = 40;
          printf("%d\n", battery >= 20 && wind <= 30);
          printf("%d\n", battery >= 20 || wind <= 30);
          printf("%d\n", !(wind <= 30));
          return 0;
      }
      ```

      ### & и | — другие операции
      В отличие от MATLAB, в C `&` и `|` — **побитовые** операции: они
      объединяют отдельные биты двух целых чисел. `6 & 3` равно 2 (двоичные 110 &
      011 = 010), а `6 && 3` равно 1 (оба не нули). Побитовые операции в этом
      курсе не изучаются — в условиях всегда используйте `&&` и `||`.
    success: |
      `&&` требует обоих условий, `||` — хотя бы одного, а `!` обращает
      условие. `&` и `|` — побитовые операции, это другой инструмент.
    steps:
      bitwise-predict:
        title: '&& или &'
        prompt: Введите в точности то, что выведет эта программа.
        explanation: |
          `&&` лишь проверяет, что обе стороны не нули (да → 1). `&` объединяет
          биты: 6 & 3 = 2, а 4 & 1 = 0 (общих битов нет). Поэтому `&` в условии
          может дать неверный ответ.
      main:
        title: Правила взлёта
        prompt: |
          Прочитайте три int: уровень заряда (%), скорость ветра (км/ч) и флаг
          чрезвычайной ситуации (1 или 0). Выведите `LAUNCH`, если заряд **не
          меньше 20 и** ветер **не больше 30**, **или** если установлен флаг
          ЧС. Иначе выведите `HOLD`. Используйте одну инструкцию `if` с `&&` и
          `||`.
        explanation: |
          `battery >= 20 && wind <= 30` — условие «безопасно»; `|| emergency`
          добавляет принудительный взлёт. Скобки не обязательны (&& связывает
          сильнее ||), но делают замысел очевидным.
        hints:
          - |-
            Сначала запишите условие безопасной погоды, затем добавьте аварийное исключение.
          - |-
            Безопасно = оба условия (заряд и ветер) истинны (&&). Взлёт = безопасно ИЛИ ЧС (||).
          - |-
            `if ((условие1 && условие2) || условие3)`
          - |-
            `if ((battery >= 20 && wind <= 30) || emergency)`
          - |-
            Полное решение использует один if/else.
        tests:
          emergency: Исключение позволяет взлететь даже в плохих условиях.
          boundaries: Ровно 20% и ровно 30 км/ч допустимы.

  control-center/short-circuit:
    title: Короткое замыкание
    objectives:
      - Объяснить сокращённое вычисление && и ||.
      - Расставлять условия так, чтобы защитная проверка предотвращала опасную операцию, например деление на ноль.
    world: { label: МОНИТОР ПОТОКА }
    briefing: |
      Монитор потока аварийно завершается, когда труба сообщает о нуле
      замеров. Он делит на число замеров до того, как его проверить.
      Используйте сокращённое вычисление, чтобы сделать его безопасным.
    lesson: |
      ### Сокращённое вычисление
      `&&` и `||` сначала вычисляют **левый** операнд, а правый вычисляют
      **только если он ещё может изменить результат**:

      * `a && b`: если `a` ложно (0), результат 0, и `b` **не вычисляется**.
      * `a || b`: если `a` истинно, результат 1, и `b` **не вычисляется**.

      Это позволяет писать **защитные проверки**:

      ```c
      if (count > 0 && total / count > 10)   /* division only happens when count > 0 */
      ```

      Если поменять части местами, сначала вычислится `total / count` — а
      деление на ноль — неопределённое поведение. (В этой игре программа
      останавливается с ошибкой выполнения.)

      > [!note] `&&` и `||` (а также операция запятая и `?:`) — одни из немногих
      > операций, для которых C гарантирует порядок вычисления. Для большинства
      > операций, например `+` или аргументов функций, порядок не определён.
    success: |
      `&&` останавливается, как только левая часть ложна, а `||` — как только
      левая часть истинна. Если поставить проверку (`count > 0`) первой,
      деление выполнится только тогда, когда это безопасно.
    steps:
      main:
        title: Защитите деление
        prompt: |
          Монитор читает общий поток и число замеров. Если замеры есть **и**
          среднее (total / count, целочисленное деление подходит) больше 10,
          выведите `HIGH`; иначе выведите `NORMAL`. При 0 замеров программа
          должна вывести `NORMAL`, а не аварийно завершиться. Запустите тесты,
          посмотрите на аварию, затем исправьте.
        explanation: |
          Когда `count > 0` стоит слева, `&&` пропускает деление, если count
          равен 0. Порядок операндов здесь важен.
        hints:
          - |-
            Авария происходит в тесте с 0 замеров. Какая операция тогда недопустима?
          - |-
            && сначала вычисляет левую часть и пропускает правую, если левая ложна.
          - |-
            Поставьте проверку безопасности слева: `if (безопасно && рискованно)`.
          - |-
            `if (count > 0 && total / count > 10)`
          - |-
            Полное решение меняет два условия местами.
        tests:
          no-samples: Ноль замеров не должен вызывать аварию.
          boundary: Среднее ровно 11 больше 10.

  control-center/conditional-operator:
    title: Выбор значения
    objectives:
      - 'Использовать условную операцию (условие) ? выражение1 : выражение2 для выбора значения.'
      - Переписать простое присваивание с if/else как условное выражение.
    world: { label: ДЕТЕКТОР ПИКОВ }
    briefing: |
      Детектор пиков сравнивает два показания и записывает большее и меньшее.
      Компактная операция выбирает значение в одном выражении.
    lesson: |
      ### Условная операция ?:
      ```c
      (condition) ? expression1 : expression2
      ```

      Если условие истинно, результат — `выражение1`, иначе — `выражение2`.
      Вычисляется только выбранное выражение. Эти два фрагмента делают одно и
      то же:

      ```c
      if (x > y) max = x;
      else max = y;

      max = (x > y) ? x : y;
      ```

      Используйте `?:` для **выбора значения**, а `if` — для выбора между
      **действиями**. Вложенные `?:` быстро становятся нечитаемыми.
    success: |
      `(условие) ? a : b` — выражение со значением `a` или `b`. Оно идеально для
      коротких выборов вроде максимума и минимума.
    steps:
      main:
        title: Детектор пиков
        prompt: |
          Прочитайте два int и выведите большее и меньшее, вычисляя каждое
          **условной операцией**. Для ввода `7 12`:

          ```
          max = 12, min = 7
          ```
        explanation: |
          Каждая строка выбирает одно из двух значений. Если a равно b, оба
          варианта одинаковы, и неважно, какой выбран.
        hints:
          - |-
            Условная операция выбирает одно из двух значений в зависимости от условия.
          - |-
            max: если a больше — выбрать a, иначе b. min: противоположное сравнение.
          - |-
            `результат = (условие) ? еслиИстина : еслиЛожь;`
          - |-
            `max = (a > b) ? a : b;`
          - |-
            Полное решение использует ?: дважды.

  control-center/machine-modes:
    title: Режимы машин
    objectives:
      - Написать инструкцию switch с метками case, break и default.
      - Объяснить, как switch переходит к подходящей метке case.
      - Знать, что switch работает с целыми значениями (включая char), но не с double и не со строками.
    world: { label: НАСОСНАЯ СТАНЦИЯ }
    briefing: |
      Машинами насосной станции управляют номера режимов. Переведите каждый
      номер в название режима — идеальная работа для `switch`.
    lesson: |
      ### switch
      ```c
      switch (expression) {
      case value1:
          statements;
          break;
      case value2:
          statements;
          break;
      default:
          statements;
          break;
      }
      ```

      * Выражение вычисляется один раз, и C **переходит** к метке `case` с тем
        же значением; если совпадения нет — к `default` (если он есть).
      * Выполнение продолжается оттуда **до `break`** (или до конца switch).
      * Метки case должны быть **целочисленными константами** (`3`, `'A'`), а
        выражение switch — целого типа. `switch` по `double` или по строке
        недопустим (MATLAB разрешает строки — C нет).

      Пример с рангом карты из лекции (с прямыми кавычками):

      ```c example stdin=11
      #include <stdio.h>

      int main(void)
      {
          int n;
          printf("What is the rank of the card (1-13)? ");
          scanf("%d", &n);
          switch (n)
          {
          case 1: printf("Ace\n"); break;
          case 11: printf("Jack\n"); break;
          default: printf("%d\n", n); break;
          }
          return 0;
      }
      ```

      > [!correction] На слайде 43 сказано, что switch «сравнивает ... с каждым
      > case по порядку». По сути он сразу переходит к подходящей метке;
      > порядок case не влияет на результат (если каждый заканчивается
      > `break`). Кроме того, на слайде 44 есть типографская кавычка `“` в
      > `"%d\n“` — выше она исправлена.
    success: |
      `switch` переходит к подходящему `case`, выполняется до `break` и
      использует `default` для всего остального. Он работает с целыми и
      символьными значениями.
    steps:
      main:
        title: Назовите режимы
        prompt: |
          Прочитайте номер режима и выведите его название с помощью `switch`:

          | Режим | Вывести |
          |---|---|
          | 1 | `IDLE` |
          | 2 | `PUMPING` |
          | 3 | `HEATING` |
          | 4 | `COOLING` |
          | любой другой | `UNKNOWN MODE` |
        explanation: |
          Каждый case выводит одно название и выходит из switch через `break`.
          `default` обрабатывает все неперечисленные значения, включая 0,
          отрицательные числа и 5.
        hints:
          - |-
            У каждого номера режима своя метка case; значения без case попадают в default.
          - |-
            Скопируйте блок case 1 для 2, 3 и 4, затем добавьте блок default.
          - |-
            `case 2: printf("PUMPING\n"); break;` и `default: printf("UNKNOWN MODE\n"); break;`
          - |-
            Не забудьте break после каждого printf, иначе выполнение провалится в следующий case.
          - |-
            Полное решение содержит четыре case и default.

  control-center/card-ranks:
    title: Проваливание
    objectives:
      - Предсказать, что происходит, когда в case нет break (проваливание).
      - Исправить случайное проваливание и использовать намеренное для группировки case.
    world: { label: СЧИТЫВАТЕЛЬ КАРТ, goal: Правильно назовите каждый ранг карты }
    briefing: |
      Исследователи оставили терминал карточной игры, который называет ранги
      карт. Иногда он печатает два названия для одной карты. Разберитесь с
      пропущенным `break`.
    lesson: |
      ### Что если break нет?
      После перехода к подходящему `case` switch продолжает выполнять
      инструкции — **включая инструкции следующих case** — пока не встретит
      `break` или конец. Это называется **проваливанием** (fall-through):

      ```c example stdin=1
      #include <stdio.h>

      int main(void)
      {
          int n;
          printf("What is the rank of the card (1-13)? ");
          scanf("%d", &n);
          switch (n)
          {
          case 1: printf("Ace\n");          /* no break! */
          case 11: printf("Jack\n"); break;
          default: printf("%d\n", n); break;
          }
          return 0;
      }
      ```

      Компилятор предупреждает *unannotated fall-through between switch
      labels* (в игре включён `-Wimplicit-fallthrough`).

      ### Намеренное проваливание
      Несколько меток case подряд используют общий код — полезный приём:

      ```c
      case 11:
      case 12:
      case 13:
          printf("Face card\n");
          break;
      ```

      Метки без инструкций между ними предупреждения не вызывают.
    success: |
      Без `break` выполнение проваливается в следующий case. Случайное
      проваливание — ошибка; метки подряд вроде `case 12: case 13:` — намеренный
      и понятный способ использовать общий код.
    steps:
      fall-predict:
        title: Туз и…?
        prompt: Пример выше запущен с вводом `1`. Введите в точности то, что он выведет после приглашения (по строке на строку вывода; приглашение не пишите).
        explanation: |
          `case 1` выводит Ace; без break выполнение продолжается в `case 11` и
          выводит Jack, затем останавливается на его break.
      main:
        title: Исправьте и расширьте считыватель
        prompt: |
          Прочитайте ранг (int) и выведите:

          * 1 → `Ace`
          * от 2 до 10 → само число, например `7`
          * 11 → `Jack`, 12 → `Queen`, 13 → `King`
          * всё остальное → `Invalid rank`

          Затем **только для 11, 12 и 13** выведите вторую строку `Face card`,
          используя одну общую группу меток case. Каждый ранг должен выводить
          только свои строки.
        explanation: |
          `break` после Ace убирает случайное проваливание. Числовые карты
          обрабатываются в общей ветви default, которая также отсекает неверные
          ранги. Второй switch ставит метки 11, 12 и 13 подряд — намеренное
          проваливание — чтобы один раз вывести `Face card`.
        hints:
          - |-
            Запустите тест для ранга 1 и сравните: что выводится лишнего?
          - |-
            Каждому case нужен break. Ранги 2–10 и неверные ранги обработайте в default с помощью if.
          - |-
            Метки подряд используют общий код: `case 11: case 12: case 13: printf(...); break;`
          - |-
            Добавьте `break;` после Ace, добавьте case 12 и 13, а в default проверяйте `n >= 2 && n <= 10`.
          - |-
            Полное решение использует две инструкции switch.

  control-center/first-loop:
    title: Мигание маяка
    objectives:
      - С помощью простого цикла for повторить инструкцию n раз.
      - Объяснить роль i = 0, i < n и i++ в заголовке цикла.
    world: { label: ЛАМПА МАЯКА, goal: Мигните маяком n раз }
    briefing: |
      Маяк центра управления должен мигнуть заданное число раз. Писать один и
      тот же printf снова и снова нельзя — число меняется. Знакомьтесь с первым
      циклом.
    lesson: |
      ### Простой цикл for
      ```c
      for (i = 0; i < n; i++)
          printf("i=%d\n", i);
      ```

      Он повторяет printf при `i` = 0, 1, 2, …, n−1 — то есть **n раз**:

      1. `i = 0` выполняется один раз в начале;
      2. `i < n` проверяется **перед** каждым повторением — если ложно, цикл
         заканчивается;
      3. после каждого повторения `i++` прибавляет единицу.

      Если инструкций несколько, используйте блок:

      ```c example stdin=3
      #include <stdio.h>

      int main(void)
      {
          int i, n;
          scanf("%d", &n);
          for (i = 0; i < n; i++)
          {
              printf("i=%d\n", i);
          }
          return 0;
      }
      ```

      Подробно циклы разбираются в главе «Автоматический завод».

      > [!correction] В примерах слайда 46 типографские кавычки (`“i=%d\n”`);
      > в коде всегда набирайте `"`.
    success: |
      `for (i = 0; i < n; i++)` повторяет тело n раз, а i считает от 0 до n−1.
      Если n равно 0, условие сразу ложно, и тело не выполняется ни разу.
    steps:
      main:
        title: Мигните n раз
        prompt: |
          Прочитайте `n` и выведите `blink 0`, `blink 1`, … до `blink n-1`, по
          одному на строку, затем `done`. Для ввода `3`:

          ```
          blink 0
          blink 1
          blink 2
          done
          ```
        explanation: |
          Переменная цикла `i` начинается с 0, тело выполняется, пока `i < n`, а
          `i++` переходит к следующему значению. `done` стоит вне цикла, поэтому
          выводится один раз.
        hints:
          - |-
            Повторите один и тот же printf n раз, подставляя значение счётчика.
          - |-
            Возьмите цикл из теории и измените текст, выводимый в теле.
          - |-
            `for (i = 0; i < n; i++) printf("blink %d\n", i);`
          - |-
            Поставьте этот цикл между scanf и строкой done.
          - |-
            Полное решение добавляет один цикл for.
        tests:
          zero: Ноль миганий.

  control-center/style-review:
    title: Читаемый код
    objectives:
      - Переписать скомканный код читаемо, не меняя его поведения.
      - Применять правила стиля — комментарии, отступы, осмысленные имена, одна инструкция на строку, без лишней сложности.
    world: { label: СИГНАЛИЗАЦИЯ ДАВЛЕНИЯ }
    briefing: |
      Сигнализация давления работает — но её программа записана одной
      нечитаемой строкой. Следующий инженер, который её тронет, внесёт ошибку.
      Сделайте её читаемой, не меняя того, что она делает.
    lesson: |
      ### Стиль программирования
      Программы читают гораздо чаще, чем пишут. Правила стиля из лекции:

      * **Комментарии** сообщают читателю то, что ему нужно знать (*почему*, а
        не каждое *что*).
      * **Отступы** показывают уровни управления: всё внутри блока сдвинуто на
        один уровень глубже, чем его скобки.
      * **Осмысленные имена**: `difference` вместо `c`. Короткие имена вроде
        `i` или `n` подходят для счётчиков циклов и простых количеств.
      * **Соглашение об именах** помогает читателю: например, `camelCase` для
        переменных.
      * **Стандартные идиомы**: пишите так, как ожидают опытные программисты
        на C (например, `for (i = 0; i < n; i++)`).
      * **Без лишней сложности**: одна инструкция на строку, никаких
        хитростей.

      Плохой пример из лекции втискивает целый цикл в несколько строк:

      ```c
      while (1){ scanf("%d", &n);
      if (n==0) break; else if (n==1) continue;
      printf("n=%d\n", n);}
      ```

      Он работает, но его приходится читать трижды, чтобы понять. `while`,
      `break` и `continue` вы встретите в следующей главе.

      В этой миссии игра проверяет поведение тестами и выполняет простые
      автоматические проверки стиля: не больше одной инструкции на строку,
      отступ внутри блоков, хотя бы один комментарий и описательные имена
      переменных (не короче 3 символов, кроме `i`, `j`, `k`, `n`, `x`, `y`).
      Настоящую проверку стиля делают люди — воспользуйтесь и чек-листом.
    success: |
      Поведение то же, но код объясняет сам себя: понятные имена, одна
      инструкция на строку, отступы, показывающие структуру, и комментарий о
      назначении программы.
    steps:
      main:
        title: Приведите сигнализацию в порядок
        prompt: |
          Перепишите программу так, чтобы она вела себя точно так же (это
          проверяют тесты), но соответствовала правилам стиля. Она читает два
          показания давления и выводит `ALERT <разница>`, если они различаются
          больше чем на 10, иначе `ok <разница>`.
        explanation: |
          Логика не изменилась. Понятные имена (`first`, `second`,
          `difference`), одна инструкция на строку, единообразные отступы и
          комментарий делают назначение ясным с первого взгляда.
        checklist:
          - Поймёт ли программу однокурсник, не задавая вопросов?
          - Говорит ли имя каждой переменной, что она хранит?
          - Сдвинут ли каждый блок на один уровень глубже своих скобок?
          - Избежали ли вы приёмов, которые читателю пришлось бы расшифровывать?
        hints:
          - |-
            Поведение не меняется; меняются только расположение и имена.
          - |-
            Сначала разбейте код на одну инструкцию на строку, затем сделайте отступы в блоках, затем переименуйте a, b и c, затем добавьте комментарий.
          - |-
            Отступ внутри скобок — 4 пробела. Комментарий выглядит как `/* ... */` или `// ...`.
          - |-
            Переименуйте a → first, b → second, c → difference и разместите каждый if/else на своих строках.
          - |-
            Полное решение показывает приведённую в порядок программу.
        tests:
          boundary: Разница ровно 10 — ещё ok.

  control-center/control-room:
    title: 'Итог главы: пункт управления'
    objectives:
      - Совместить в одной программе switch, цепочки else-if и логические операции.
      - Выбирать разумные границы и проверять их.
    world: { label: ПУНКТ УПРАВЛЕНИЯ }
    briefing: |
      Каждый датчик на острове сообщает букву типа и значение. Пункт
      управления должен решить для каждого сообщения: всё в порядке, нужно
      предупреждение или есть опасность.
    lesson: |
      Используйте изученное в этой главе: `switch` по типу датчика,
      `if / else if` для диапазонов и `&&` / `||` там, где они сокращают
      правила. Символы читайте так: `scanf(" %c", &type)` читает один символ
      (пробел перед `%c` пропускает пробелы и переводы строк).

      > [!note] `%c` в scanf читает *любой* символ, включая пробел и перевод
      > строки. Пробел в `" %c"` велит scanf сначала пропустить пробельные
      > символы.
    success: |
      Ваш пункт управления совмещает `switch` по типам датчиков с проверками
      диапазонов. Центр управления острова полностью работает, и
      автоматический завод за ним теперь доступен.
    steps:
      main:
        title: Классифицируйте сообщения датчиков
        prompt: |
          Прочитайте символ типа датчика и целое значение, например `T 85`.
          Выведите одно слово по этим правилам:

          | Тип | OK | WARNING | DANGER |
          |---|---|---|---|
          | `T` температура | от 0 до 60 | от 61 до 80 | меньше 0 или больше 80 |
          | `P` давление | от 90 до 110 | 80–89 или 111–120 | меньше 80 или больше 120 |
          | `W` уровень воды | не больше 70 | от 71 до 90 | больше 90 |

          Любая другая буква типа выводит `UNKNOWN SENSOR`. Пример: `T 85` →
          `DANGER`.
        explanation: |
          switch выбирает набор правил по типу датчика. Внутри каждого case
          сначала проверяется самое опасное условие, поэтому следующие ветви
          видят только значения, уже попавшие в допустимый диапазон.
        hints:
          - |-
            Сначала решите, какая строка таблицы подходит (по типу), затем какой столбец (по значению).
          - |-
            Используйте switch (type) с case 'T', case 'P', case 'W' и default. Внутри каждого case — цепочка else-if от DANGER к OK.
          - |-
            Символьные метки пишутся в одинарных кавычках: `case 'T':`. Диапазоны: `value < 0 || value > 80`.
          - |-
            Для T: `if (value < 0 || value > 80) DANGER; else if (value > 60) WARNING; else OK;`
          - |-
            Полное решение содержит три case с цепочками else-if и default.
        tests:
          newline: Тип и значение на разных строках.
