      L10.while: Синтаксис цикла while; бесконечный цикл while (1) {}
      L10.digit-sum: 'digitsum.c: сумма цифр целого числа через % 10 и / 10'
      L10.for-purpose: 'Цикл for: повторение операции заданное число раз'
      L10.for-syntax: 'for (init; test; step): когда выполняется каждая часть'
      L10.for-variants: Эквивалентные циклы for, пропущенные части, for (;;) и while (1)
      L10.comma-operator: 'Операция запятая: a = 2, 3 и a = (2, 3); циклы-произведения'
      L10.do-while: Цикл do ... while
      L10.break: break завершает цикл
      L10.continue: continue переходит к следующей итерации
      L10.times-table: 'timestab.c: вложенные циклы выводят таблицу умножения с %4d'
      L10.celsius-table: 'Упражнение: таблица Цельсий–Фаренгейт для -20..40'
      L10.why-functions: 'Зачем функции: программы состоят из функций; уменьшение концептуальной сложности'
      L10.decomposition: 'Разделяй и властвуй: проектирование сверху вниз, пошаговое уточнение, чёткие интерфейсы'
      L10.black-boxes: Функции как чёрные ящики (входы -> выходы) и функции, выполняющие действия
      L10.prototypes: 'Объявление до использования: прототип, вызов, реализация; прототипы библиотечных функций берутся из файлов .h'
      L10.library-functions: 'Библиотечные функции: stdio.h (printf, scanf), math.h (sqrt, sin, cos)'
      L10.function-anatomy: 'Анатомия times2: тип результата, имя, параметр, инструкция return, возвращаемое значение'
      L10.calling-functions: Вызов функции; полная программа с прототипом, вызовом и реализацией; одинаковые имена в разных функциях
      L10.max-function: 'Упражнение: функция max() двух целых; проектирование входов и выходов'
      L10.parameter-passing: Аргументы сопоставляются с параметрами и преобразуются к типам параметров
      L10.distance-function: 'distance(): передача констант, int и выражений как аргументов double'
      L10.local-variables: Параметры и локальные переменные; локальные не инициализируются автоматически; функции не видят переменных друг друга
      L10.call-by-value: 'Передача по значению: функция получает копии; их изменение не влияет на вызывающую сторону'
      L10.void-function: 'Тип результата void: функции, вызываемые ради действия, без возвращаемого значения'
      L10.void-parameter: 'Список параметров void: функции без входных данных'
      L10.digit-root: 'Упражнение: повторять сумму цифр, пока не сойдётся (одна цифра), в виде функции'
    corrections:
      smart-quotes: 'В примерах циклов типографские кавычки (“i=%d\n”). В настоящем коде используйте простую ".'
      press-any-key: '«Press any key to continue . . .» в примере вывода печатает IDE (Visual Studio) после завершения программы, а не сама программа.'
      comma-assignment: 'a = 2, 3; присваивает 2 (присваивание связывает сильнее запятой); a = (2, 3); присваивает 3. Компиляторы предупреждают, что отброшенное значение не используется: операция запятая редко нужна вне заголовков for.'
      empty-body: 'У for (i=1, prod=1; i<=n; prod *= i++); пустое тело (одинокая ;). Это работает, но лишняя точка с запятой — классическая ошибка, поэтому большинство руководств по стилю предпочитают третью форму с явным телом.'
      do-while-use: 'do-while встречается реже, но это естественный выбор, когда тело должно выполниться хотя бы раз, например при запросе ввода до получения допустимого значения.'
      declare-before-use: 'Верно для C99 и новее: вызов необъявленной функции — ошибка (C89 допускал неявные объявления с «implicit int»).'
      libm: 'В gcc на Linux программам с <math.h> иногда нужен -lm в конце команды (gcc prog.c -o prog -lm), чтобы подключить математическую библиотеку.'
      return-parentheses: 'return (2 * x); и return 2 * x; идентичны: return — не функция, скобки необязательны.'
      int-1234567: 'Для sayHi(1234567) int должен быть шире 16 бит; стандарт гарантирует только до 32767. Для номеров, которые на маленьких системах могут быть больше, используйте long.'
      implicit-arg-conversion: 'В вызове со слайда distance(1, i, x1, sqrt(y1)+2) внутри distance y1 равно 2.0 (double), потому что аргумент int i преобразуется к типу параметра.'
