notebook:
  game-howto:
    title: Как играть
    summary: Управление, горячие клавиши и как выполняется ваш код.
    body: |
      * **Запуск** (Ctrl+Enter): скомпилировать и запустить программу; текст из
        поля **Ввод** — её входные данные.
      * **Проверить** (Ctrl+Shift+Enter): запустить все тесты миссии.
      * **Стоп** (Esc): немедленно завершить работающую программу.
      * **Сброс**: вернуть исходный код миссии (черновик будет потерян).
      * **Подсказка**: подсказки бывают пяти уровней — идея, стратегия,
        синтаксис, частичное решение, полное решение. Полное решение отмечает
        миссию как пройденную *с помощью*; позже можно получить *мастерство*
        повтором.
      * **Вид мира** реагирует на то, что ваша программа действительно
        сделала: её вывод, результаты тестов или вызовы API острова.
      * Черновики и прогресс сохраняются автоматически в этом браузере.
  compile-outside:
    title: Компиляция C вне игры
    summary: Команды gcc, a.out / a.exe и чем отличается компилятор игры.
    body: |
      ```
      gcc -std=c17 -Wall -Wextra program.c -o program      (для math.h в Linux добавьте -lm)
      ./program            Linux / macOS
      program.exe          Windows
      ```

      Простая команда `gcc program.c` создаёт `a.out` (Linux/macOS) или `a.exe`
      (Windows).

      Конвейер: **исходник (.c) → компиляция → объектный файл (.o / .obj) →
      компоновка с библиотеками → исполняемый файл → запуск.**

      **В игре:** Clang 22 (скомпилированный в WebAssembly) компилирует и
      компонует программу прямо в браузере с флагами `-std=c17 -Wall -Wextra
      -Wimplicit-fallthrough -O0`, а также с проверками неопределённого
      поведения во время выполнения (`-fsanitize=undefined`, с остановкой).
      Программа работает в изолированной песочнице с лимитом времени 3 секунды
      и лимитом вывода 64 КБ. Размеры типов — как в 32-битном WebAssembly:
      `int` 4 байта, `long` 4 байта, `long long` 8 байт, указатели 4 байта.
      Ввод берётся из поля «Ввод», а не с клавиатуры в реальном времени.
  program-skeleton:
    title: Скелет программы
    summary: Части, которые есть в каждой программе на C.
    body: |
      ```c
      /* comment: notes for humans */
      #include <stdio.h>        /* header of the standard I/O library */

      int main(void)            /* entry point: exactly one per program */
      {
          printf("Hello\n");    /* statement: ends with ; */
          return 0;             /* report success */
      }
      ```

      `int main(void)` — main возвращает int и не принимает аргументов.
  escapes:
    title: Строки и escape-последовательности
    summary: '\n, \t, \", \\ и %%'
    body: |
      | Пишем | Выводится |
      |---|---|
      | `\n` | новая строка |
      | `\t` | табуляция |
      | `\"` | `"` |
      | `\\` | `\` |
      | `%%` (в формате printf) | `%` |

      printf никогда не добавляет перевод строки сама. Используйте простые
      ASCII-кавычки `"`, а не типографские `“ ”`.
  common-errors:
    title: Как читать сообщения компилятора
    summary: файл:строка:столбец; сначала исправляйте первую ошибку.
    body: |
      `main.c:6:5: error: expected ';' after expression` → файл `main.c`,
      строка 6, столбец 5.

      * Исправьте **первую** ошибку, затем скомпилируйте снова.
      * *expected ';'* — посмотрите в конец предыдущей строки.
      * *use of undeclared identifier* — опечатка, нет объявления или
        переменная вне своей области видимости.
      * *call to undeclared function* — опечатка в имени, нет `#include` или
        нет прототипа.
      * *unexpected character <U+201C>* — типографские кавычки; используйте `"`.
      * *undefined symbol* (компоновщик) — функция объявлена, но нигде не
        определена.
      * Считайте **предупреждения** ошибками, пока не доказано обратное.
  variables:
    title: Переменные и объявления
    summary: Объявление, инициализация и имена переменных.
    body: |
      ```c
      int count;              /* declaration */
      int total = 0;          /* declaration with initialisation */
      int a, b, c;            /* several at once */
      count = 5;              /* assignment */
      ```

      Имена: начинаются с буквы или `_`; дальше буквы, цифры, `_`; регистр
      различается; не ключевое слово. Неинициализированные локальные
      переменные содержат мусор.
  scanf-basics:
    title: Чтение ввода через scanf
    summary: scanf нужен адрес (&) каждой переменной.
    body: |
      ```c
      scanf("%d", &n);                 /* one int */
      scanf("%d %d", &a, &b);          /* two ints */
      scanf("%lf", &x);                /* double */
      scanf(" %c", &ch);               /* one char, skipping whitespace first */
      if (scanf("%d", &n) != 1) { /* nothing could be read */ }
      ```

      `&n` — адрес `n`; scanf сохраняет значение туда. scanf возвращает
      количество прочитанных значений.
  ascii:
    title: Таблица ASCII
    summary: Коды 0–127 в десятичном и шестнадцатеричном виде с символами.
    body: |
      `'A'` = 65, `'a'` = 97, `'0'` = 48, пробел = 32, перевод строки = 10.
      `%c` выводит код как символ, `%d` — как число. Коды 0–31 и 127 —
      управляющие символы.
  types:
    title: Типы и размеры
    summary: Минимальные диапазоны, типичные размеры и sizeof.
    body: |
      | Тип | Минимум по стандарту | Эта игра (wasm32) | Linux x86-64 |
      |---|---|---|---|
      | `char` | 8 бит | 1 байт | 1 байт |
      | `short` | 16 бит | 2 | 2 |
      | `int` | 16 бит | 4 | 4 |
      | `long` | 32 бита | 4 | 8 |
      | `long long` | 64 бита | 8 | 8 |
      | `float` | ~6 цифр | 4 | 4 |
      | `double` | ~10 цифр (на практике 15–16) | 8 | 8 |

      `sizeof(тип)` → размер в байтах, выводится через `%zu`. `<limits.h>`:
      `INT_MAX`, `INT_MIN`, `CHAR_BIT`, … Типы `unsigned` хранят только
      неотрицательные значения и переполняются по кругу; переполнение
      знаковых типов не определено.
  printf-formats:
    title: Спецификаторы printf
    summary: '%d %c %f %e %g %E %G %zu, ширина и точность.'
    body: |
      | Спецификатор | Для | Пример вывода |
      |---|---|---|
      | `%d` | int (и char как число) | `42` |
      | `%c` | символ | `A` |
      | `%f` | double/float, фиксированная точка | `1234.500000` |
      | `%e` / `%E` | научная запись | `1.234500e+03` / `1.234500E+03` |
      | `%g` / `%G` | короче из %f/%e | `1234.5` |
      | `%zu` | результат sizeof (size_t) | `4` |
      | `%%` | знак процента | `%` |

      Ширина и точность: `%4d` (ширина 4, выравнивание вправо), `%.2f`
      (2 знака), `%6.1f` (ширина 6, 1 знак).
  scanf-formats:
    title: Спецификаторы scanf
    summary: '%d — int, %f — float, %lf — double; scanf строга.'
    body: |
      | Переменная | scanf |
      |---|---|
      | `int` | `%d` |
      | `float` | `%f` (`%e`, `%g` — то же самое) |
      | `double` | `%lf` |
      | `char` | `" %c"` |

      printf автоматически превращает float в double; scanf — нет, потому что
      пишет по адресу.
  floating:
    title: Числа с плавающей точкой
    summary: Приближённые значения; сравнивайте с допуском.
    body: |
      Хранятся как мантисса × 2^порядок. Большинство десятичных дробей (0.1) —
      приближения: `0.1 + 0.2` через `%.17g` выводится как
      `0.30000000000000004`. Константы пишутся как `2.9979e8` (= 2,9979 × 10⁸).
      Предпочитайте `double`. Не сравнивайте вещественные результаты через
      `==`; проверяйте, мала ли разница.
  operators:
    title: Операции и приоритет
    summary: Таблица приоритетов и целочисленное деление.
    body: |
      | Уровень (от высокого к низкому) | Операции | Группировка |
      |---|---|---|
      | постфиксные | `x++` `x--` `f()` | → |
      | унарные | `++x` `--x` `-x` `!x` `(type)x` `sizeof` | ← |
      | мультипликативные | `*` `/` `%` | → |
      | аддитивные | `+` `-` | → |
      | сравнения | `<` `<=` `>` `>=` | → |
      | равенство | `==` `!=` | → |
      | логическое и | `&&` | → |
      | логическое или | `\|\|` | → |
      | условная | `?:` | ← |
      | присваивание | `=` `+=` `-=` `*=` `/=` `%=` | ← |
      | запятая | `,` | → |

      `int / int` отбрасывает дробь (усекает к нулю); `%` — остаток. Если
      сомневаетесь — ставьте скобки.
  assignment:
    title: Присваивание, ++ и составные операции
    summary: a = b = 0, x++ и ++x, x += y.
    body: |
      * `a = b = 0;` → `a = (b = 0);` (справа налево)
      * `y = x++;` → y получает старое x; `y = ++x;` → y получает новое x
      * `x += y` — это `x = x + y` (также `-=` `*=` `/=` `%=`)
      * Никогда не изменяйте переменную дважды в одном выражении
        (`i = i++ + 1;` — неопределённое поведение).
  undefined-behaviour:
    title: Неопределённое поведение
    summary: Код, которому стандарт C не придаёт смысла.
    body: |
      Примеры: целочисленное деление на ноль, переполнение знакового целого,
      изменение переменной дважды в одном выражении (`(++i)+(i++)`),
      использование значения неинициализированной переменной, чтение за
      пределами памяти. Результат может быть любым — и разным у разных
      компиляторов. Игра останавливает многие такие случаи во время выполнения
      с ошибкой проверки; обычный компилятор без `-fsanitize=undefined`, как
      правило, этого не делает.
  conversions:
    title: Преобразования типов и приведения
    summary: Смешанные выражения, усечение и приведение (double).
    body: |
      * `1 + 1.5` → int преобразуется в double → `2.5`.
      * `int n = 3.99;` сохраняет `3` (дробь отбрасывается).
      * `7 / 2` равно `3`, даже если результат сохраняется в double; для `3.5`
        используйте `7.0 / 2` или `(double) 7 / 2`.
      * Аргументы преобразуются к типам параметров функции.
  blocks-scope:
    title: Блоки и область видимости
    summary: Переменная живёт до конца своего блока.
    body: |
      `{ ... }` объединяет инструкции. Переменная, объявленная в блоке, видна
      только от объявления до закрывающей скобки. Пустой блок `{}` допустим;
      после `}` точка с запятой не нужна. Локальные переменные функции видны
      только в этой функции.
  conditions:
    title: if, else if, else
    summary: Решения, значения истинности и bool.
    body: |
      ```c
      if (x > 0) {
          ...
      } else if (x == 0) {
          ...
      } else {
          ...
      }
      ```

      0 — ложь, любое другое значение — истина. Сравнения дают 1 или 0.
      `<stdbool.h>` (C99) даёт `bool`, `true`, `false`; в C23 это ключевые
      слова. `=` присваивает, `==` сравнивает.
  logic:
    title: Логические операции
    summary: '&&, ||, ! и сокращённое вычисление.'
    body: |
      * `a && b` — оба истинны; `b` не вычисляется, если `a` ложно.
      * `a || b` — хотя бы одно истинно; `b` не вычисляется, если `a` истинно.
      * `!a` — отрицание.
      * `&` и `|` — **побитовые** операции, а не логические.
      * Защитная проверка: `if (count > 0 && total / count > 10)`.
  conditional-op:
    title: 'Условная операция ?:'
    summary: Выбор значения в одном выражении.
    body: |
      `max = (a > b) ? a : b;` — значение `a`, если условие истинно, иначе `b`.
      Используйте для выбора значений, а `if` — для действий.
  switch:
    title: switch
    summary: Переход к совпадающему целому case.
    body: |
      ```c
      switch (mode) {
      case 1:
          ...
          break;
      case 2:
      case 3:              /* stacked labels share code */
          ...
          break;
      default:
          ...
          break;
      }
      ```

      Только целое (или char) выражение и константные метки. Без `break`
      выполнение проваливается в следующий case.
  style:
    title: Стиль программирования
    summary: Пишите код для людей.
    body: |
      Комментарии объясняют замысел; отступы показывают структуру; имена
      говорят, что означает значение; одна инструкция на строку; стандартные
      идиомы; никаких лишних хитростей.
  while-loops:
    title: while и do-while
    summary: Цикл, пока выполняется условие.
    body: |
      ```c
      while (condition) { ... }          /* tests first, may run 0 times */
      do { ... } while (condition);      /* runs at least once */
      while (1) { ... if (done) break; } /* deliberate endless loop */
      ```

      Каждому циклу нужно продвижение к концу. Цифры: `n % 10` — последняя
      цифра, `n /= 10` её отбрасывает.
  for-loops:
    title: Циклы for
    summary: for (init; test; step), варианты и вложенность.
    body: |
      ```c
      for (i = 0; i < n; i++)      /* n times: 0 .. n-1 */
      for (i = 1; i <= n; i++)     /* n times: 1 .. n */
      for (t = n; t >= 1; t--)     /* counting down */
      for (i = 1, p = 1; i <= n; i++) p *= i;   /* comma operator */
      for (;;)                     /* endless, like while (1) */
      ```

      init один раз → проверка перед каждым проходом → тело → шаг после
      каждого прохода. Вложенные циклы: внутренний цикл выполняется полностью
      на каждой итерации внешнего.
  break-continue:
    title: break и continue
    summary: Выйти из цикла или перейти к следующей итерации.
    body: |
      `break` выходит из самого внутреннего цикла (или switch). `continue`
      пропускает остаток текущей итерации (цикл `for` всё равно выполняет шаг).
  island-api:
    title: API острова (только в игре)
    summary: robot_move, robot_scan, robot_repair, robot_x, robot_y.
    body: |
      **Не стандартный C.** Эти функции существуют только в этой игре.
      Подключаются через `#include <island.h>`.

      | Функция | Действие |
      |---|---|
      | `int robot_move(char dir)` | `'N'` `'S'` `'E'` `'W'`; возвращает 1, если сдвинулся, 0, если заблокирован |
      | `int robot_scan(void)` | повреждение текущей клетки (0 — исправна) |
      | `void robot_repair(void)` | отремонтировать текущую клетку |
      | `int robot_x(void)` / `int robot_y(void)` | текущий столбец / строка (x растёт на восток, y — на юг) |

      Каждый вызов выполняется игрой во время работы программы и
      записывается; вид мира воспроизводит записанные вызовы по порядку (не
      более 5000). Превышение времени или вызов неизвестной функции
      останавливают программу.
  functions:
    title: Как писать функции
    summary: Прототип, вызов, определение, return.
    body: |
      ```c
      int times2(int x);            /* prototype */

      int main(void)
      {
          int y = times2(21);       /* call: argument 21 */
          ...
      }

      int times2(int x)             /* definition: parameter x */
      {
          return 2 * x;
      }

      void sayHi(void)              /* no result, no parameters */
      {
          printf("Hi!\n");
      }
      ```

      Объявляйте до использования. Аргументы сопоставляются с параметрами по
      позиции и преобразуются к их типам.
  math-library:
    title: math.h
    summary: sqrt, sin, cos и другие.
    body: |
      `#include <math.h>` — `sqrt(x)`, `sin(rad)`, `cos(rad)`, `fabs(x)`,
      `pow(x, y)`. Принимают и возвращают `double`. Углы — в радианах:
      `rad = deg * pi / 180`. В gcc на Linux компонуйте с `-lm`.
  call-by-value:
    title: Передача по значению и локальные переменные
    summary: Функции получают копии; возвращайте результаты.
    body: |
      Параметры — локальные копии, инициализированные значениями аргументов.
      Остальные локальные переменные изначально не инициализированы.
      Изменение параметра никогда не меняет переменную вызывающей стороны —
      верните новое значение и присвойте его: `fuel = refuel(fuel, 25);`.
      Функция не видит локальных переменных другой функции.

lectures:
  L09:
    title: 'Начало работы с C: типы данных, выражения, if и switch, простой цикл for'
    topics:
      L09.outline: План лекции и разделители разделов
      L09.what-is-c: 'Что такое C: Деннис Ритчи, ANSI C (C89), C99, C11, C17; системное программирование, ядро Linux, встраиваемые системы'
      L09.build-process: Исходные файлы .c, компиляция в объектные файлы, компоновка исполняемого файла (.exe в Windows), запуск
      L09.compilers: 'Компиляторы: GCC, Clang/LLVM, MSVC; в курсе используется GCC'
      L09.hello-program: 'Первая программа (aloha.c): комментарий, подключение библиотеки, функция main'
      L09.libraries: Библиотеки, заголовочные файлы, stdio, #include <имя.h>
      L09.main-function: 'main: точка входа, ровно одна в программе, фигурные скобки окружают тело, return 0'
      L09.printf-basics: 'printf: строки в двойных кавычках, инструкции заканчиваются точкой с запятой (сравнение с fprintf в MATLAB)'
      L09.using-gcc: 'Использование gcc: gcc file.c создаёт a.out (Linux) или a.exe (Windows)'
      L09.add-two-numbers: 'add2.c: объявление переменных, приглашения, чтение двух целых чисел, вывод суммы'
      L09.scanf-address: scanf читает ввод; & даёт адрес, по которому сохраняется значение
      L09.basic-types: 'Основные типы: char, int, unsigned, float, double; предпочтителен double; размеры зависят от платформы'
      L09.char-type: Символы, символьные константы 'a', коды символов, ASCII
      L09.ascii-table: Коды ASCII 0–127 (таблица Dec/Hex/Char)
      L09.integer-types: short, int, long; минимальные диапазоны, гарантированные стандартом; int обычно 32 бита
      L09.floating-point: 'Представление с плавающей точкой: значащие цифры × основание^порядок, приближённость'
      L09.printf-float: printf %f, %e, %g и заглавные %E / %G
      L09.scanf-float: scanf %f для float, %lf для double; %e и %g читают как %f
      L09.add-two-doubles: 'add2f.c: сложение двух чисел с плавающей точкой'
      L09.expression-terms: 'Выражения: термы (константа, переменная, вызов функции, выражение в скобках) и операции'
      L09.constants: Константы, например 2.9979e8
      L09.variables-naming: У переменной есть тип, имя и значение; правила именования; регистр; ключевые слова; объявление до использования
      L09.assignment: 'Присваивание: значение выражения присваивания, цепочка a = b = 1'
      L09.arithmetic: Арифметические операции, смена знака, целочисленное деление, остаток, порядок операций и скобки
      L09.increment: 'Инкремент/декремент: префиксный ++x и постфиксный x++'
      L09.compound-assignment: Сокращённое присваивание += -= *= /=
      L09.type-conversion: Автоматическое (неявное) и явное преобразование типов
      L09.cm-to-feet: 'cm2feet.c: сантиметры в футы и дюймы'
      L09.feet-to-cm: 'Упражнение: футы и дюймы в сантиметры'
      L09.blocks: 'Блоки: группировка инструкций, объявления внутри блоков, пустые блоки, нет точки с запятой после }'
      L09.if-statement: if, if/else и построение цепочек else-if
      L09.true-false: 'Значения истинности: ноль — ложь, ненулевое — истина; логические типы'
      L09.relational: Операции сравнения и равенства (результат 0 или 1); = и ==
      L09.signum: 'Пример: функция signum'
      L09.absolute-value: 'Упражнение: модуль числа'
      L09.logical: Логические операции ! && ||; & и | — побитовые операции (в отличие от MATLAB)
      L09.conditional-operator: 'Условная операция (условие) ? выр1 : выр2'
      L09.switch: switch, case, default, break; отличие от MATLAB
      L09.card-rank: 'Пример: ранг карты через switch'
      L09.fall-through: 'Пример: switch без break (проваливание)'
      L09.simple-for: Простой цикл for
      L09.style-example: 'Пример стиля: скомканный код и выражение (++i)+(i++)+(++i)'
      L09.style-guidelines: 'Стиль программирования: комментарии, отступы, осмысленные имена, соглашения, идиомы, без лишней сложности'
    corrections:
      main-void: 'На слайдах написано int main(). В C17 пустой список параметров в определении означает «нет параметров», но это объявление в старом стиле без прототипа. int main(void) явно говорит «main не принимает аргументов» и является одной из двух форм, перечисленных в стандарте, поэтому игра использует её.'
      smart-quotes: 'В нескольких примерах на слайдах типографские кавычки (“ ” вместо "). C принимает только простую ASCII-кавычку; копирование таких строк в компилятор вызывает ошибки. Весь код в игре использует прямые кавычки.'
      typos: 'Исправлены опечатки: «objective files» означает объектные файлы (слайд 5); «floating-poing» — floating-point (слайд 22); ASCII расшифровывается как American Standard Code for Information Interchange (слайд 16).'
      char-bits: 'Не гарантируется, что char ровно 8 бит; стандарт требует не менее 8 (CHAR_BIT в <limits.h>). Практически во всех современных системах это 8.'
      int-ranges: 'Стандарт гарантирует минимальные диапазоны: short и int не менее -32767..32767 (16 бит), long не менее -2147483647..2147483647 (32 бита), long long (C99) не менее 64 бит. Реальные размеры определяются реализацией: long 64 бита в Linux/macOS x86-64, но 32 бита в Windows и в WebAssembly-компиляторе этой игры. Проверяйте через sizeof.'
      bool-type: '«В C нет логического типа» было верно только для C89. C99 добавил тип _Bool и заголовок <stdbool.h> (bool, true, false); в C23 bool, true и false стали ключевыми словами. Условия по-прежнему считают ноль ложью, а ненулевое — истиной.'
      no-elseif: 'В C нет единого ключевого слова «elseif». else if — это просто else, инструкцией которого является ещё один if, поэтому цепочки else if работают.'
      ub-increments: '(++i)+(i++)+(++i) изменяет i несколько раз без упорядочивания. Это неопределённое поведение: правильного ответа нет, компилятор может вывести что угодно, и игра никогда не просит предсказывать его значение.'
      assignment-value: 'Строго говоря, значение есть у выражения присваивания (а не у инструкции): это значение, сохранённое в левом операнде.'
      switch-order: 'switch не проверяет case по очереди, как MATLAB; он сразу переходит к подходящей метке. Управляющее выражение должно быть целого типа (char, int, long ...), а метки case — целочисленными константами.'
      conversion-warning: '1 + 1.5 молча преобразует 1 в double (обычные арифметические преобразования) без предупреждения. Предупреждения появляются для преобразований с возможной потерей данных, например double в int, если включить -Wconversion.'
      negation-glyph: 'В строке «Negation:» на слайде пропал символ; это унарный минус -x. Фраза «Use your common sense for operator order» заменена в игре настоящей таблицей приоритетов.'
      gcc-flags: 'gcc file.c работает, но лучше gcc -std=c17 -Wall -Wextra file.c -o name: стандарт выбран явно, полезные предупреждения включены, исполняемый файл назван.'
      wording: 'Уточнена формулировка: C обычно называют «относительно низкоуровневым языком высокого уровня». stdio — часть стандартной библиотеки C, определённой стандартом ISO C (изначально ANSI C).'
  L10:
    title: Циклы while и for; функции
    topics:
