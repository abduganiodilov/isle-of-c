chapters:
  first-contact:
    title: Первый контакт
    region: Пляж высадки — башня связи
    intro: >
      PIP-7, маленький ремонтный робот, просыпается на берегу заброшенного
      исследовательского острова. Единственный способ связаться с миром —
      пыльный терминал связи, который выполняет программы на C. Научите PIP-7
      говорить.
    outro: >
      Башня связи снова в эфире. PIP-7 умеет запускать полные программы на C и
      выводить ровно то, что нужно.

missions:
  first-contact/wake-up:
    title: Проснись, PIP-7
    objectives:
      - Понять, что такое программа и для чего используется язык C.
      - Запустить программу на C и увидеть её вывод.
      - Изменить текст, который выводит программа.
    world: { label: ТЕРМИНАЛ СВЯЗИ, goal: Пусть терминал покажет PIP-7 online }
    briefing: |
      PIP-7 только что включился. Терминал связи работает, но молчит: он
      показывает только то, что ему велит **программа**. Ваша первая задача —
      запустить программу, а затем изменить сообщение, которое она выводит.
    lesson: |
      ### Что такое программа?
      **Программа** — это список точных инструкций для компьютера. Компьютер
      делает ровно то, что написано в инструкциях, — не больше и не меньше.

      ### Что такое C?
      **C** — язык программирования, созданный Деннисом Ритчи в Bell Labs в
      начале 1970-х. В 1989 году ANSI его стандартизировал (**C89**, он же
      ANSI C), позже появились версии **C99**, **C11**, **C17** и **C23**. В этой
      игре используется **C17**.

      C — *относительно низкоуровневый* язык высокого уровня: вы пишете
      понятный код, но остаётесь близко к устройству машины. Поэтому на C
      пишут операционные системы (большая часть ядра Linux написана на C),
      встраиваемые системы (автомобили, датчики, стиральные машины, роботы
      вроде PIP-7) и быстрые библиотеки для других языков.

      ### Ваша первая программа
      В редакторе справа уже есть готовая программа. Пока вам нужна только
      одна строка:

      ```c
      printf("Hello, island!\n");
      ```

      `printf` выводит текст на экран. Текст пишется между двойными кавычками
      `" "`. `\n` в конце означает «перейти на новую строку». Остальные строки —
      это **шаблонный код** (boilerplate), нужный каждой программе. Он объяснён
      в миссии 3 «Анатомия программы». Пока его понимать не обязательно.

      ### Как играть
      1. Нажмите **Запуск** (или Ctrl+Enter). Игра компилирует ваш код
         настоящим компилятором C и запускает его. Вывод появится на вкладке
         **Вывод** и на терминале PIP-7.
      2. Измените код, запустите снова и нажмите **Проверить**, чтобы
         проверить решение.

      > [!correction] Формулировка слайда 4 уточнена: C обычно называют
      > *относительно низкоуровневым языком высокого уровня*.
    success: |
      Вы запустили настоящую программу на C и изменили то, что она выводит.
      Каждую программу в этой игре компилирует настоящий компилятор C (Clang) —
      такой же инструмент, каким вы будете пользоваться вне игры.
    steps:
      main:
        title: Измените сообщение
        prompt: |
          1. Нажмите **Запуск** и посмотрите на вкладку «Вывод».
          2. Измените текст между кавычками так, чтобы программа вывела ровно:

          ```
          PIP-7 online
          ```

          Оставьте `\n` в конце и не удаляйте кавычки.
        explanation: |
          Меняется только текст между двойными кавычками. `printf` выводит этот
          текст в точности как написано, а `\n` завершает строку.
        hints:
          - |-
            Текст, который выводит программа, — это часть внутри двойных кавычек.
          - |-
            Найдите строку с `printf`. Замените только слова между `"` и `\n`.
          - |-
            Строка с printf выглядит так: `printf("Какой-то текст\n");`
          - |-
            Ваша строка должна начинаться с `printf("PIP-7` и заканчиваться `\n");`
          - |-
            В полном решении Hello, island! заменено на PIP-7 online.
        tests:
          message: Терминал должен показать ровно PIP-7 online.
          one-line: Больше ничего не выводится.

  first-contact/build-pipeline:
    title: Конвейер сборки
    objectives:
      - Описать путь от файла .c до работающей программы (компиляция, объектные файлы, компоновка, запуск).
      - Назвать распространённые компиляторы C и типичные имена исполняемых файлов.
      - Прочитать сообщение компилятора и по номеру строки исправить ошибку.
      - Объяснить, чем запуск C в игре отличается от gcc на вашем компьютере.
    world: { label: СБОРОЧНЫЙ ЦЕХ }
    briefing: |
      Сборочный цех острова превращает **исходный код** на C в **программу**,
      которую может выполнить робот. Конвейер заклинило: один исходный файл
      больше не компилируется. Разберитесь, как работает цех, и почините файл.
    lesson: |
      ### От исходного кода к работающей программе
      Компьютер не может выполнить текст на C напрямую. Его переводит
      **компилятор**:

      1. **Пишем исходный код** в одном или нескольких файлах с расширением
         **`.c`** (например, `aloha.c`).
      2. **Компилируем** каждый файл `.c` в **объектный файл** (`.o` в
         Linux/macOS, `.obj` в MSVC). В объектном файле уже машинный код, но это
         ещё не готовая программа.
      3. **Компонуем** (линкуем) объектные файлы вместе с **библиотеками**,
         которые они используют (например, с кодом, реализующим `printf`).
         Результат — **исполняемый файл**.
      4. **Запускаем** исполняемый файл.

      Обычно шаги 2 и 3 выполняет одна команда.

      ### Компиляторы
      Распространённые компиляторы C — **GCC**, **Clang/LLVM** и **MSVC**
      (Microsoft Visual C++). В лекционном курсе используется **GCC**, поэтому
      убедитесь, что ваш код компилируется и gcc. Код, написанный по стандарту
      C, работает со всеми.

      ### Имена исполняемых файлов
      `gcc aloha.c` создаёт исполняемый файл **`a.out`** в Linux/macOS или
      **`a.exe`** в Windows. Исполняемые файлы Windows заканчиваются на `.exe`;
      в Linux и macOS у них обычно вообще нет расширения.

      ### Ошибки компиляции и ошибки компоновки
      Если компилятор не понимает код, он сообщает **ошибку компиляции** с
      позицией: `main.c:5:5: error: ...` значит *файл main.c, строка 5, столбец
      5*. Если все файлы скомпилировались, но при сборке чего-то не хватает,
      ошибку сообщает **компоновщик**. Попробуйте пример: он обещает, что
      функция `calibrate` существует, но не даёт её тела, поэтому компоновка не
      удаётся.

      ```c example error
      #include <stdio.h>

      int calibrate(void);   /* a promise: "calibrate exists somewhere" */

      int main(void)
      {
          printf("Calibrating...\n");
          calibrate();       /* the linker cannot find it -> link error */
          return 0;
      }
      ```

      ### Как игра запускает ваш C
      Когда вы нажимаете **Запуск**, игра с помощью **Clang** (скомпилированного
      в WebAssembly) компилирует *и компонует* программу **прямо в браузере**.
      Получается исполняемый файл WebAssembly, который работает в
      изолированной песочнице: он может читать поле «Ввод» и выводить текст —
      и больше ничего. На сервере он не выполняется.

      > [!outside] **Вне игры** — если установлен GCC, сохраните файл как
      > `aloha.c` и введите:
      >
      > `gcc -std=c17 -Wall -Wextra aloha.c -o aloha`
      >
      > затем запустите `./aloha` (Linux/macOS) или `aloha.exe` (Windows).
      > Простая команда `gcc aloha.c` тоже работает и создаёт `a.out` / `a.exe`.
      > `-std=c17` выбирает стандарт C, `-Wall -Wextra` включают полезные
      > предупреждения, а `-o aloha` задаёт имя исполняемого файла.

      > [!correction] На слайде 5 написано «objective files»: правильный термин —
      > **объектные файлы** (object files). Команда `gcc yourfilename.c` со
      > слайда 11 работает, но лучше привыкнуть добавлять
      > `-std=c17 -Wall -Wextra -o имя`.
    success: |
      Вы знаете конвейер сборки: **исходник (.c) → компиляция → объектные файлы →
      компоновка (с библиотеками) → исполняемый файл → запуск**. Вы прочитали
      настоящую ошибку компилятора, перешли к указанной строке и исправили её.
    steps:
      order:
        title: Почините конвейер
        prompt: Расставьте этапы сборки программы на C в правильном порядке.
        lines:
          - Написать исходный код в файле .c
          - Скомпилировать каждый файл .c в объектный файл
          - Скомпоновать объектные файлы и библиотеки в исполняемый файл
          - Запустить исполняемый файл
        explanation: |
          Исходный код компилируется в объектные файлы, которые компоновщик
          объединяет с библиотеками в исполняемый файл. Запустить можно только
          исполняемый файл.
      names:
        title: Какой файл запускать?
        question: Вы вводите `gcc aloha.c` в Windows без `-o`. Какой файл можно потом запустить?
        choices:
          - aloha.c
          - aloha.o
          - a.exe
          - stdio.h
        explanation: |
          Без `-o` gcc называет исполняемый файл `a.exe` в Windows (`a.out` в
          Linux/macOS). `aloha.c` — исходный код, файлы `.o` — объектные, а
          `stdio.h` — заголовочный файл.
      main:
        title: Почините заклинивший файл
        prompt: |
          Нажмите **Запуск**. Компилятор остановится с ошибкой. Прочитайте
          сообщение на вкладке **Диагностика**, найдите указанную строку и
          исправьте ошибку, чтобы программа вывела:

          ```
          Pipeline restored
          ```
        explanation: |
          Функция называется `printf` (print **f**ormatted — форматированный
          вывод). С переставленными буквами компилятор не находит объявления
          `prinft`, а начиная с C99 это ошибка. Диагностика указала точную строку
          и столбец.
        hints:
          - |-
            Сообщения компилятора начинаются с файл:строка:столбец. Посмотрите на номер строки.
          - |-
            В ошибке говорится о «необъявленной функции». Сравните её имя с функцией из миссии 1.
          - |-
            Функция вывода пишется p-r-i-n-t-f: `printf("...\n");`
          - |-
            Строка 5 должна начинаться с `printf(`, а не с `prinft(`.
          - |-
            Исправьте написание printf — больше ничего не меняется.
        tests:
          output: Исправленная программа выводит сообщение о восстановлении.
          clean-exit: Программа завершается нормально (возвращает 0).

  first-contact/anatomy:
    title: Анатомия программы
    objectives:
      - Объяснить комментарии, #include <stdio.h>, int main(void), фигурные скобки, инструкции, точки с запятой и return 0.
      - Знать, что библиотека — это готовый код, а заголовок (.h) сообщает компилятору, что в ней есть.
      - Дописать программу, добавив недостающую строку include и инструкцию return.
    world: { label: ТЕРМИНАЛ СВЯЗИ, goal: Выведите отчёт о запуске из трёх строк }
    briefing: |
      Терминалу связи нужен полный отчёт о запуске, но в его программе не
      хватает частей. Прежде чем чинить её, разберитесь, что означает каждая
      строка программы на C.
    lesson: |
      Вот первая программа из лекции (с одним современным улучшением):

      ```c example
      /*
       * File: aloha.c
       * -------------
       * Print the message "Aloha" on the screen
       */

      #include <stdio.h>

      int main(void)
      {
          printf("Aloha!\n");
          return 0;
      }
      ```

      | Часть | Значение |
      |---|---|
      | `/* ... */` | **Комментарий**: заметки для людей. Компилятор его игнорирует. Комментарий `// ...` длится до конца строки. |
      | `#include <stdio.h>` | **Подключение библиотеки.** *Библиотека* — набор инструментов, написанных другими программистами. `stdio.h` — **заголовочный файл** стандартной библиотеки ввода-вывода; он сообщает компилятору, что `printf` существует и как её вызывать. Стандартные заголовки подключаются как `#include <имя.h>`. |
      | `int main(void)` | **Функция main.** В каждой программе ровно одна `main`; запуск программы — это выполнение `main`. `int` означает, что main возвращает целое число; `void` — что она не принимает входных данных. |
      | `{ ... }` | **Фигурные скобки** окружают тело функции — инструкции, принадлежащие `main`. |
      | `printf("Aloha!\n");` | **Инструкция.** Каждая простая инструкция заканчивается **точкой с запятой** `;`. Текст в двойных кавычках `" "` — это **строка**. |
      | `return 0;` | Завершает `main` и сообщает системе, запустившей программу, об «успехе» (0). |

      Если вы знаете MATLAB: `printf` похожа на `fprintf` из MATLAB, но в C
      после каждой инструкции нужна точка с запятой, а строки всегда пишутся в
      двойных кавычках.

      > [!correction] На слайдах написано `int main()`. В C17 рекомендуется
      > более ясная форма `int main(void)`: она явно говорит, что main **не
      > принимает аргументов**, и это одна из двух форм `main`, перечисленных в
      > стандарте C (вторая принимает аргументы командной строки). `int main()` —
      > объявление в старом стиле без прототипа; оно работает, но `(void)`
      > точнее.

      Инструкции выполняются **сверху вниз**, одна за другой.
    success: |
      Вы можете назвать каждую часть программы на C: комментарии,
      `#include <stdio.h>`, `int main(void)`, фигурные скобки тела, инструкции с
      `;` в конце и `return 0;`. Теперь вы можете писать этот шаблонный код сами.
    steps:
      comment-predict:
        title: Что делает комментарий?
        prompt: Что выведет эта программа?
        answer:
          choices:
            - Tower ready
            - Tower broken
            - Tower ready, затем Tower broken
            - 'Ничего: в программе ошибка'
        explanation: |
          Второй printf находится внутри `/* ... */`, значит это комментарий.
          Компилятор его игнорирует, и выводится только `Tower ready`.
      main:
        title: Допишите отчёт о запуске
        prompt: |
          В программе ниже не хватает двух строк, которые нужны каждой программе
          (ищите комментарии `TODO`). Добавьте их, чтобы терминал вывел ровно:

          ```
          COMMS ONLINE
          Island relay found
          Waiting for orders
          ```
        explanation: |
          `#include <stdio.h>` объявляет `printf`, чтобы компилятор знал, как её
          вызывать. `return 0;` завершает main и сообщает об успехе. (На самом
          деле C17 позволяет `main` дойти до закрывающей скобки и сам возвращает
          0, но явная запись понятнее и соответствует тому, что нужно всем
          остальным функциям.)
        hints:
          - |-
            Без нужного заголовка компилятор не знает, что такое printf.
          - |-
            Посмотрите на пример aloha.c в теории: какая строка стоит перед int main(void)? Какая — последней внутри скобок?
          - |-
            Строка заголовка: `#include <stdio.h>`. Завершение main: `return 0;`
          - |-
            Замените TODO 1 на `#include <stdio.h>` и поставьте `return 0;` перед закрывающей скобкой.
          - |-
            Полное решение добавляет ровно эти две строки.
        tests:
          report: Все три строки по порядку.
          header: printf должна быть объявлена через подключение stdio.h.

  first-contact/newlines:
    title: Строки и экранирование
    objectives:
      - Предсказать, как склеивается вывод printf без \n.
      - Использовать в строках управляющие последовательности \n, \t, \" и \\.
      - Вывести точное многострочное изображение.
    world: { label: ДИСПЛЕЙ РЕТРАНСЛЯТОРА, goal: Нарисуйте баннер ретранслятора в рамке }
    briefing: |
      Дисплей ретранслятора рисует баннер в рамке, но старая программа
      выводила всё в одну строку. Разберитесь, как `printf` решает, где
      заканчивается строка.
    lesson: |
      ### printf выводит ровно то, что вы ей дали
      `printf` **не** добавляет перевод строки сама. Два вызова без `\n`
      окажутся на одной строке:

      ```c example
      #include <stdio.h>

      int main(void)
      {
          printf("Power ");
          printf("on\n");
          printf("Ready\n");
          return 0;
      }
      ```

      ### Управляющие (escape-) последовательности
      Некоторые символы нельзя набрать прямо внутри строки, поэтому в C есть
      **обратная косая черта**, начинающая *escape-последовательность*:

      | Пишем | Выводится |
      |---|---|
      | `\n` | новая строка |
      | `\t` | табуляция (переход к следующей позиции табуляции) |
      | `\"` | двойная кавычка (обычная `"` закончила бы строку) |
      | `\\` | одна обратная косая черта |

      ```c example
      #include <stdio.h>

      int main(void)
      {
          printf("Path:\tC:\\island\\relay\n");
          printf("Label: \"Relay 7\"\n");
          return 0;
      }
      ```
    success: |
      `printf` выводит символы в точности как задано; переводами строк вы
      управляете с помощью `\n`. Чтобы вывести кавычку или обратную косую черту
      внутри строки, экранируйте их: `\"` или `\\`.
    steps:
      join-predict:
        title: Где обрываются строки?
        prompt: Введите в точности то, что выведет эта программа (по одной строке вывода на строку).
        explanation: |
          Без `\n` следующий printf продолжает ту же строку, поэтому A и B
          склеиваются, затем C и D.
      main:
        title: Нарисуйте баннер ретранслятора
        prompt: |
          Напишите тело `main` так, чтобы программа вывела ровно этот баннер (три
          строки; кавычки вокруг 7 — часть текста):

          ```
          +------------------+
          | ISLAND RELAY "7" |
          +------------------+
          ```
        explanation: |
          Внутри строки `\"` выводит двойную кавычку, не завершая строку. Каждая
          строка заканчивается `\n`. Если скопировать строку рамки для нижней
          границы, ширина совпадёт.
        hints:
          - |-
            Двойная кавычка обычно завершает строку, значит нужен способ вывести её внутри текста.
          - |-
            Выведите три строки тремя вызовами printf, каждый с \n в конце.
          - |-
            Чтобы вывести кавычку внутри строки, поставьте перед ней обратную косую черту: `printf("say \"hi\"\n");` выводит say "hi".
          - |-
            Средняя строка: `printf("| ISLAND RELAY \"7\" |\n");`
          - |-
            Полное решение: рамка, средняя строка с экранированными кавычками, снова рамка.
        tests:
          banner: Баннер должен совпадать символ в символ.
          lines: Ровно три строки.

  first-contact/beacon-debug:
    title: Отладка маяка
    objectives:
      - Исправлять несколько ошибок компиляции по одной, начиная с первого сообщения.
      - Распознавать типографские («умные») кавычки, скопированные из документов, и заменять их.
      - Помнить, что C различает регистр, а каждой инструкции нужна точка с запятой.
    world: { label: УПРАВЛЕНИЕ МАЯКОМ, goal: Перезапустите маяк }
    briefing: |
      Программу аварийного маяка переписали из промокшего руководства. В копии
      несколько ошибок, из-за которых она не компилируется. Исправьте их все.
    lesson: |
      ### Как читать несколько ошибок
      Одна ошибка может запутать компилятор и вызвать несколько сообщений.
      Исправьте **первую** ошибку, запустите снова и повторите.

      ### Ошибки, возникающие при копировании кода со слайдов или из документов
      * **«Умные» кавычки.** Текстовые редакторы и программы для слайдов часто
        превращают `"` в типографские кавычки `“ ”`. C понимает только простую
        ASCII-кавычку `"`. Компилятор сообщает что-то вроде *unexpected
        character <U+201C>*.
      * **Регистр букв.** C различает заглавные и строчные буквы: `Printf` — не
        `printf`, а `Main` — не `main`.
      * **Пропущенные точки с запятой.** Каждая инструкция заканчивается `;`.
        Компилятор обычно сообщает об ошибке на *следующем* символе, поэтому
        проверьте и конец предыдущей строки.

      > [!correction] На нескольких слайдах лекции (например, в примерах со
      > `scanf` и `switch`) есть «умные» кавычки вроде `“%d\n”`. В настоящем
      > коде всегда набирайте простую `"`.
    success: |
      Вы исправляли ошибки по одной, начиная с первого сообщения: «умные»
      кавычки заменены на простые `"`, исправлена заглавная буква (C различает
      регистр) и добавлена пропущенная точка с запятой.
    steps:
      main:
        title: Почините программу маяка
        prompt: |
          Исправьте все ошибки, чтобы программа скомпилировалась и вывела:

          ```
          BEACON ACTIVE
          Signal: strong
          ```

          В исходном коде ошибки трёх разных видов.
        explanation: |
          В строке 5 использованы типографские кавычки `“ ”`, которые C не
          принимает, — нужны простые `"`. В строке 6 было `Printf` (C различает
          регистр, нужно `printf`) и не хватало точки с запятой в конце.
        hints:
          - |-
            Сначала исправьте первую ошибку, затем запустите снова: следующие ошибки могут исчезнуть.
          - |-
            Сравните каждый символ двух строк с printf со строкой, которая точно работает: кавычки, написание, конец строки.
          - |-
            Правильная строка: `printf("BEACON ACTIVE\n");` — прямые кавычки, строчная p, точка с запятой.
          - |-
            Строка 5: замените “ и ” на ". Строка 6: Printf → printf и добавьте ; в конце.
          - |-
            В полном решении две правильные инструкции printf.
        tests:
          beacon: Выводятся обе строки.
          exit: Программа завершается нормально.

  first-contact/comms-tower:
    title: 'Итог главы: башня связи'
    objectives:
      - Написать полную программу на C с пустого файла без шаблона.
      - Использовать escape-последовательности для кавычек и обратной косой черты.
    world: { label: БАШНЯ СВЯЗИ, goal: Передайте полную последовательность запуска }
    briefing: |
      Память башни стёрта. Напишите программу запуска целиком сами — на этот раз
      без шаблона. Когда она заработает, башня выйдет в эфир и откроется
      следующий район острова.
    lesson: |
      Это **итоговое задание главы**: всё необходимое было в этой главе.
      Напишите строку include, `main`, инструкции printf и инструкцию return
      сами. Если нужно что-то вспомнить — откройте Блокнот (значок книги).
    success: |
      Вы написали полную программу на C с нуля: заголовок, `main`, инструкции с
      escape-последовательностями и `return 0;`. Башня связи в эфире, и
      Лаборатория датчиков теперь доступна.
    steps:
      main:
        title: Напишите программу запуска
        prompt: |
          Начиная с пустого файла, напишите программу, которая выводит ровно:

          ```
          PIP-7 COMMS v1.0
          Status: "ready"
          Log path: C:\island\comms
          ```
        explanation: |
          В программе четыре знакомые части: `#include <stdio.h>`,
          `int main(void)`, тело в фигурных скобках и `return 0;`. Кавычки
          внутри строки пишутся как `\"`, а каждая обратная косая черта — как `\\`.
        hints:
          - |-
            Каждой полной программе нужны подключение заголовка, функция main с телом в фигурных скобках и return.
          - |-
            Сначала напишите шаблон и запустите его (он ничего не выведет), затем добавьте по printf на каждую строку.
          - |-
            Экранирование: `\"` выводит кавычку, `\\` — одну обратную косую черту, `\n` завершает строку.
          - |-
            Строка 3: `printf("Log path: C:\\island\\comms\n");`
          - |-
            Ниже показано полное решение со всеми тремя printf.
        tests:
          sequence: Все три строки точно.
          count: Ничего лишнего.
